<!-- Cognitive Vocabulary Trainer · «Building Effective Agents» · для блока T123 (Tilda). Вставьте весь код целиком. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
#cvt{
  --bg:#EEF1F7; --surface:#FFFFFF; --surface2:#F6F7FB; --ink:#23283A; --muted:#5C6378; --line:#DCE1EC;
  --peri:#5966D6; --peri-ink:#FFFFFF; --peri-soft:#E3E6FB; --peri-mid:#AEB6F2;
  --mint:#D6F1E1; --mint-ink:#1E6943; --mint-line:#93D3AE;
  --rose:#FBDCDC; --rose-ink:#A12F3A; --rose-line:#EFA3A8;
  --butter:#F7E3A1; --butter-soft:#FBF1CF; --lav:#ECE8FC;
  --shadow:0 1px 2px rgba(35,40,58,.06),0 8px 24px rgba(35,40,58,.06);
  --ui:"Onest","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --lex:"Newsreader",Georgia,"Times New Roman",serif;
  color-scheme:light;
  background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:17px;line-height:1.5;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%;text-align:left;
  min-height:100px;width:100%;position:relative;
}
@media (prefers-color-scheme:dark){ #cvt:not([data-theme="light"]){
  color-scheme:dark; --bg:#171A24; --surface:#20242F; --surface2:#262B38; --ink:#E8EAF2; --muted:#A3A9BC; --line:#343A4A;
  --peri:#8E99F2; --peri-ink:#151827; --peri-soft:#2C3152; --peri-mid:#5562B8;
  --mint:#1D3A2B; --mint-ink:#9FE0BC; --mint-line:#2F6B4A; --rose:#432428; --rose-ink:#F5B3B8; --rose-line:#7A3940;
  --butter:#D9C47A; --butter-soft:#3A3524; --lav:#2A2740; --shadow:0 1px 2px rgba(0,0,0,.3);
}}
#cvt[data-theme="dark"]{
  color-scheme:dark; --bg:#171A24; --surface:#20242F; --surface2:#262B38; --ink:#E8EAF2; --muted:#A3A9BC; --line:#343A4A;
  --peri:#8E99F2; --peri-ink:#151827; --peri-soft:#2C3152; --peri-mid:#5562B8;
  --mint:#1D3A2B; --mint-ink:#9FE0BC; --mint-line:#2F6B4A; --rose:#432428; --rose-ink:#F5B3B8; --rose-line:#7A3940;
  --butter:#D9C47A; --butter-soft:#3A3524; --lav:#2A2740; --shadow:0 1px 2px rgba(0,0,0,.3);
}

/* reset inside the block so Tilda styles don't leak in */
#cvt *,#cvt *::before,#cvt *::after{box-sizing:border-box}
#cvt h1,#cvt h2,#cvt h3,#cvt p,#cvt ul,#cvt table{margin:0;padding:0;letter-spacing:normal;text-transform:none}
#cvt h1,#cvt h2,#cvt h3{color:inherit}
#cvt button,#cvt input,#cvt select{font:inherit;color:inherit;margin:0;letter-spacing:normal;text-transform:none;-webkit-tap-highlight-color:transparent}
#cvt button{cursor:pointer;touch-action:manipulation;-webkit-appearance:none;appearance:none;border:none;background:none;text-align:inherit;line-height:1.3}
#cvt button:disabled{cursor:default}
#cvt :focus{outline:none}
#cvt :focus-visible{outline:3px solid var(--peri);outline-offset:2px}
#cvt .en{font-family:var(--lex);font-weight:500}
#cvt .muted{color:var(--muted)} #cvt .small{font-size:15px}
#cvt .app{max-width:760px;margin:0 auto;padding:16px 14px 40px}
#cvt .loading{padding:40px 16px;text-align:center;color:var(--muted)}

/* header */
#cvt .top{display:grid;grid-template-columns:1fr auto;gap:12px 10px;align-items:start}
#cvt .brand h1{font-family:var(--lex);font-weight:600;font-size:23px;letter-spacing:-.01em;line-height:1.15;margin:0}
#cvt .brand .sub{margin:4px 0 0;color:var(--muted);font-size:14px;line-height:1.35}
#cvt .top-r{display:flex;gap:8px}
#cvt .schema{grid-column:1 / -1;background:var(--surface);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow);display:grid;gap:8px}
#cvt .schema-l{font-size:14px;line-height:1.3}
#cvt .cells{display:flex;flex-wrap:wrap;gap:3px}
#cvt .cells i{width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line)}
#cvt .cells i.m2{background:var(--peri-mid);box-shadow:none}
#cvt .cells i.m3{background:var(--peri);box-shadow:none}
#cvt .icon-btn{width:46px;height:46px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ink)}
#cvt .icon-btn svg{width:22px;height:22px}
#cvt .menu-w{position:relative}
#cvt .menu{position:absolute;right:0;top:54px;z-index:40;background:var(--surface);border-radius:18px;box-shadow:0 12px 40px rgba(20,24,38,.22);padding:12px;width:min(310px,calc(100vw - 28px));display:grid;gap:4px}
#cvt .menu p{margin:2px 6px 6px}
#cvt .menu .mi{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 10px;border-radius:12px;min-height:48px;font-size:16px}
#cvt .menu .mi:active{background:var(--surface2)}
#cvt .menu .mi.danger{color:var(--rose-ink)}
#cvt .menu hr{border:none;border-top:1px solid var(--line);margin:4px 0}
#cvt .menu .seg{box-shadow:none;background:var(--surface2)}
#cvt .sw{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none;transition:background .2s}
#cvt .sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
#cvt .sw.on{background:var(--peri)}
#cvt .sw.on::after{transform:translateX(18px)}

/* tabs */
#cvt .tabs{position:relative;display:flex;gap:8px;margin:16px -14px 14px;padding:3px 14px 6px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
#cvt .tabs::-webkit-scrollbar{display:none}
#cvt .tab{flex:0 0 auto;width:124px;scroll-snap-align:center;background:var(--surface);border-radius:16px;padding:9px 11px 11px;text-align:left;display:grid;grid-template-columns:auto 1fr;column-gap:8px;row-gap:7px;align-items:center;box-shadow:var(--shadow);color:var(--muted);transition:background .2s,color .2s}
#cvt .tab .tn{width:26px;height:26px;border-radius:9px;background:var(--surface2);display:grid;place-items:center;font-weight:600;font-size:14px;color:var(--ink)}
#cvt .tab .tt{font-size:13.5px;font-weight:500;line-height:1.15}
#cvt .tab .tp{grid-column:1 / -1;height:4px;border-radius:2px;background:var(--surface2);overflow:hidden}
#cvt .tab .tp i{display:block;height:100%;background:var(--peri-mid)}
#cvt .tab[aria-selected="true"]{background:var(--peri);color:var(--peri-ink)}
#cvt .tab[aria-selected="true"] .tn{background:rgba(255,255,255,.22);color:var(--peri-ink)}
#cvt .tab[aria-selected="true"] .tp{background:rgba(255,255,255,.25)}
#cvt .tab[aria-selected="true"] .tp i{background:var(--peri-ink)}
#cvt .tab-final{background:var(--butter-soft)}
#cvt .tab-final .tn{background:var(--butter);color:#23283A}
#cvt .tab-final[aria-selected="true"]{background:var(--ink);color:var(--bg)}
#cvt .tab-final[aria-selected="true"] .tn{background:var(--butter);color:#23283A}

/* level head */
#cvt .lv-head{display:grid;gap:10px;margin-bottom:12px}
#cvt .learned{display:flex;align-items:center;gap:12px;font-size:15px}
#cvt .learned b{font-weight:600}
#cvt .learned .bar{flex:1}
#cvt .bar{display:block;height:6px;border-radius:3px;background:var(--line);overflow:hidden;min-width:60px}
#cvt .bar i{display:block;height:100%;background:var(--peri);border-radius:3px;transition:width .4s}
#cvt .lv-ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#cvt .seg{display:inline-flex;background:var(--surface);border-radius:13px;padding:3px;box-shadow:var(--shadow)}
#cvt .seg button{padding:8px 12px;border-radius:10px;font-size:14px;color:var(--muted);white-space:nowrap;min-height:38px}
#cvt .seg button[aria-pressed="true"]{background:var(--peri-soft);color:var(--ink);font-weight:600}
#cvt .seg-w{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
#cvt .seg.dir{width:100%}
#cvt .seg.dir button{flex:1;text-align:center}
#cvt .btn-sm{min-height:44px;padding:8px 14px;font-size:14px;margin-left:auto;display:inline-flex;align-items:center;gap:6px}
#cvt .btn-sm svg{width:17px;height:17px}

/* cards */
#cvt .card{background:var(--surface);border-radius:22px;padding:20px 16px;box-shadow:var(--shadow);margin-bottom:14px;position:relative;scroll-margin-top:80px}
#cvt .card h2{font-family:var(--lex);font-weight:600;font-size:26px;line-height:1.2;margin:0 0 10px;letter-spacing:-.01em}
#cvt .card p{margin:0 0 10px}
#cvt .h3{font-family:var(--lex);font-weight:600;font-size:22px;margin:0 0 10px}
#cvt .sess-prog{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:var(--muted);margin-bottom:14px}
#cvt .sess-prog .bar{width:110px;flex:none}
#cvt .hint{color:var(--muted);margin:0 0 12px;font-size:15px}
#cvt .word{font-family:var(--lex);font-weight:500;font-size:clamp(32px,9vw,52px);line-height:1.08;letter-spacing:-.015em;margin:4px 0 20px;overflow-wrap:anywhere;hyphens:auto}
#cvt .word.ru{font-family:var(--ui);font-weight:600;font-size:clamp(23px,6.4vw,32px);letter-spacing:-.01em;line-height:1.2}
#cvt .mean{color:var(--muted);margin:-8px 0 16px;font-size:16px}
#cvt .ex{font-family:var(--lex);font-style:italic;font-size:18px;line-height:1.45}

/* buttons */
#cvt .btn{border-radius:14px;padding:13px 20px;font-weight:600;font-size:16px;min-height:52px;text-align:center;transition:transform .12s,background .2s,opacity .2s}
#cvt .btn:active:not(:disabled){transform:scale(.97)}
#cvt .btn:disabled{opacity:.45}
#cvt .btn-primary{background:var(--peri);color:var(--peri-ink)}
#cvt .btn-ghost{background:var(--surface2);color:var(--ink)}
#cvt .btn-ok{background:var(--mint);color:var(--mint-ink)}
#cvt .btn-bad{background:var(--rose);color:var(--rose-ink)}
#cvt .btn.faded{opacity:.4}
#cvt .btn-wide{width:100%}
#cvt .row2{display:flex;gap:10px;flex-wrap:wrap}
#cvt .row2 .btn{flex:1 1 140px}

/* feedback */
#cvt .fb{border-radius:18px;padding:14px 16px;margin-top:16px;display:grid;gap:8px;animation:cvtpop .25s ease;scroll-margin-bottom:16px}
#cvt .fb-ok{background:var(--mint);color:var(--mint-ink)}
#cvt .fb-bad{background:var(--rose);color:var(--rose-ink)}
#cvt .fb-h{font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px}
#cvt .fb-h svg{width:22px;height:22px;flex:none}
#cvt .fb-b{color:var(--ink);font-size:16px}
#cvt .fb-b p{margin:7px 0 0}
#cvt .fb .btn{width:100%}
#cvt .fb-ok .btn-primary{background:var(--mint-ink);color:var(--mint)}
#cvt .fb-bad .btn-primary{background:var(--rose-ink);color:var(--rose)}
@keyframes cvtpop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes cvtshake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* toast (level 1) */
#cvt .toast{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(calc(100vw - 24px),480px);z-index:2147482000;border-radius:18px;padding:13px 16px;box-shadow:0 10px 30px rgba(20,24,38,.25);animation:cvtpop .2s ease;font-size:15px;line-height:1.35}
#cvt .toast b{display:block;font-size:17px;margin-bottom:2px}

/* level 1 */
#cvt .match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#cvt .col{display:grid;gap:8px;align-content:start}
#cvt .pair{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 10px;min-height:58px;text-align:left;font-size:15px;line-height:1.25;overflow-wrap:anywhere;hyphens:auto;transition:background .2s,border-color .2s,opacity .3s}
#cvt .pair.en{font-family:var(--lex);font-size:18px;font-weight:500}
#cvt .pair.sel{border-color:var(--peri);background:var(--peri-soft);box-shadow:0 0 0 2px var(--peri) inset}
#cvt .pair.good{background:var(--mint);border-color:var(--mint-line)}
#cvt .pair.badf{background:var(--rose);border-color:var(--rose-line);animation:cvtshake .3s}
#cvt .pair.matched{background:var(--mint);border-color:transparent;color:var(--mint-ink);opacity:.5}
#cvt .set-done{margin-top:14px}

/* level 2 */
#cvt .opts{display:grid;grid-template-columns:1fr;gap:9px}
#cvt .opt{border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;text-align:left;display:flex;gap:12px;align-items:center;min-height:60px;font-size:16px;line-height:1.3}
#cvt .opt .k{flex:none;width:28px;height:28px;border-radius:9px;background:var(--surface2);display:grid;place-items:center;font-weight:600;font-size:14px}
#cvt .opt.good{background:var(--mint);border-color:var(--mint-line)}
#cvt .opt.badf{background:var(--rose);border-color:var(--rose-line);animation:cvtshake .3s}
#cvt .opt.faded{opacity:.45}

/* level 3 */
#cvt .flip{display:flex;flex-direction:column;justify-content:center;width:100%;background:var(--lav);border-radius:20px;padding:24px 18px;margin-bottom:14px;min-height:200px;text-align:left}
#cvt .flip .word{margin:0}
#cvt .flip .tap-hint{margin-top:16px;color:var(--muted);font-size:14px}
#cvt .flip .back{margin-top:18px;padding-top:16px;border-top:1.5px dashed var(--peri-mid);animation:cvtpop .3s ease}
#cvt .flip .back p{margin:10px 0 0}
#cvt .answer{font-size:clamp(22px,6vw,30px);font-weight:600;line-height:1.25}
#cvt .answer.en{font-family:var(--lex);font-weight:500}
#cvt .replist{margin:0;padding-left:20px}
#cvt .replist li{margin:6px 0}

/* level 4/5 */
#cvt .cloze{font-family:var(--lex);font-size:clamp(21px,5.6vw,28px);line-height:1.55;margin:4px 0 18px}
#cvt .gap{display:inline-flex;gap:6px;vertical-align:baseline;flex-wrap:wrap}
#cvt .gapw{display:inline-block;height:1.05em;border-bottom:2.5px solid var(--peri);vertical-align:-.15em;max-width:100%}
#cvt .answer-form{display:grid;gap:10px}
#cvt .answer-form input{width:100%;min-height:56px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface2);padding:12px 16px;font-family:var(--lex);font-size:22px;-webkit-appearance:none;appearance:none;box-shadow:none}
#cvt .answer-form input:focus{border-color:var(--peri);outline:none;background:var(--surface)}
#cvt .answer-form input.ok{border-color:var(--mint-line);background:var(--mint)}
#cvt .answer-form input.bad{border-color:var(--rose-line);background:var(--rose);text-decoration:line-through;text-decoration-thickness:1.5px}

/* level 6 */
#cvt .claim{display:flex;flex-direction:column;gap:6px;margin:4px 0 20px}
#cvt .claim .word{margin:0}
#cvt .eq{color:var(--muted);font-size:15px}
#cvt .claim-ru{font-size:clamp(20px,5.6vw,26px);font-weight:600;line-height:1.3}

/* summary & final */
#cvt .sum-line{font-size:18px}
#cvt .big{font-family:var(--lex);font-size:32px;font-weight:600}
#cvt .test-nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 14px}
#cvt .grid-toggle{width:100%;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:14px;background:var(--surface2);font-size:15px;min-height:48px}
#cvt .grid-toggle svg{width:18px;height:18px;transition:transform .2s}
#cvt .grid-toggle[aria-expanded="true"] svg{transform:rotate(180deg)}
#cvt .grid50{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin-top:10px}
#cvt .cell{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;min-height:42px;font-size:14px;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted)}
#cvt .cell.filled{background:var(--peri-soft);color:var(--ink);border-color:var(--peri-soft)}
#cvt .cell.cur{border-color:var(--ink);color:var(--ink);font-weight:700}
#cvt .finish-row{display:grid;gap:10px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
#cvt .intro p{max-width:62ch}
#cvt .stats3,#cvt .stats4{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
#cvt .stats4{grid-template-columns:1fr 1fr}
#cvt .stats3>div,#cvt .stats4>div{background:var(--surface2);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px}
#cvt .sv{font-family:var(--lex);font-size:26px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
#cvt .sl{font-size:13px;color:var(--muted);line-height:1.3}
#cvt .hist-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
#cvt .daysel{display:flex;gap:8px;align-items:center;font-size:15px;color:var(--muted)}
#cvt .daysel select{border-radius:10px;border:1.5px solid var(--line);background:var(--surface2);padding:8px 10px;color:var(--ink);min-height:42px;max-width:220px}
#cvt .tblwrap{overflow-x:auto}
#cvt table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
#cvt th{text-align:left;color:var(--muted);font-weight:500;padding:8px;border-bottom:1px solid var(--line);background:none}
#cvt td{padding:9px 8px;border-bottom:1px solid var(--line);background:none}
#cvt .win{text-align:center;overflow:hidden;background:linear-gradient(180deg,var(--butter-soft),var(--surface) 70%)}
#cvt .win-h{font-size:clamp(24px,6.5vw,34px)!important;max-width:620px;margin:10px auto 8px!important}
#cvt .badge{width:116px;height:116px;margin:6px auto 0;display:block}
#cvt .confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#cvt .modal{position:fixed;inset:0;background:rgba(20,24,38,.5);display:flex;align-items:flex-end;justify-content:center;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:2147483000}
#cvt .modal-box{background:var(--surface);color:var(--ink);border-radius:22px;padding:22px 18px;max-width:460px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.25);animation:cvtpop .2s ease}
#cvt .modal-box h2{margin:0 0 8px;font-family:var(--lex);font-size:24px;line-height:1.2}
#cvt .modal-box p{margin:0 0 16px}

@media (min-width:600px){
  #cvt .app{padding:24px 24px 56px}
  #cvt .brand h1{font-size:30px}
  #cvt .card{padding:26px 28px}
  #cvt .card h2{font-size:30px}
  #cvt .opts{grid-template-columns:1fr 1fr}
  #cvt .pair{padding:12px 14px;font-size:16px}
  #cvt .pair.en{font-size:20px}
  #cvt .tabs{margin:20px 0 16px;padding:3px 2px 6px}
  #cvt .tab{flex:1 1 0;width:auto;min-width:96px}
  #cvt .stats4{grid-template-columns:repeat(4,1fr)}
  #cvt .sv{font-size:30px}
  #cvt .modal{align-items:center}
  #cvt .answer-form{grid-template-columns:1fr auto}
  #cvt .finish-row{grid-template-columns:1fr auto;align-items:center}
}
@media (hover:hover){
  #cvt .pair:hover:not(:disabled){border-color:var(--peri-mid)}
  #cvt .opt:hover:not(:disabled){border-color:var(--peri)}
  #cvt .menu .mi:hover{background:var(--surface2)}
}
@media (prefers-reduced-motion:reduce){#cvt *,#cvt *::before,#cvt *::after{animation:none!important;transition:none!important}}
</style>

<script>

  {ok:function(){return window.React&&window.React.useState;},src:["https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js","https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"]},
  {ok:function(){return window.ReactDOM&&(window.ReactDOM.createRoot||window.ReactDOM.render);},src:["https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js","https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"]},
  {ok:function(){return window.htm;},src:["https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js","https://unpkg.com/htm@3.1.1/dist/htm.umd.js"]}
];
function fail(){ var r=document.getElementById("cvt-root"); if(r) r.innerHTML='<div class="loading">Не удалось загрузить тренажёр. Проверьте интернет и обновите страницу.</div>'; }
function load(i){ if(i>=LIBS.length){ try{ start(); }catch(e){ console.error(e); fail(); } return; }
  if(LIBS[i].ok()) return load(i+1); tryUrl(i,0); }
function tryUrl(i,k){ var s=document.createElement("script"); s.src=LIBS[i].src[k]; s.async=false;
  s.onload=function(){ load(i+1); }; s.onerror=function(){ if(k+1<LIBS[i].src.length) tryUrl(i,k+1); else fail(); };
  document.head.appendChild(s); }
function boot(){ if(window.__cvtStarted||!document.getElementById("cvt-root")) return; window.__cvtStarted=true; load(0); }
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",boot); else boot();

/* ================================================================ */
function start(){
const {useState,useEffect,useRef,useMemo,useCallback} = React;
const html = htm.bind(React.createElement);
const HOST = document.getElementById("cvt");
const SET = window.CVT_VOCAB, WORDS = SET.words, BY = Object.fromEntries(WORDS.map(w=>[w.id,w]));
const TOTAL = WORDS.length;
const LS_KEY = "cvt:"+SET.id+":v1", LS_PREF = "cvt:prefs";
/* отступ сверху при автопрокрутке (если у страницы Тильды фиксированное меню, увеличьте) */
const TOP_OFFSET = 76;

/* ---------------- utils ---------------- */
const norm = s => (s||"").toLowerCase().normalize("NFKC")
  .replace(/[\u2010-\u2015\u2212]/g,"-").replace(/[\u2018\u2019`´]/g,"'")
  .replace(/-/g," ").replace(/\s+/g," ").trim().replace(/[.!?,;:]+$/,"").trim();
const accepts = (list, input) => { const n = norm(input); return n.length>0 && list.some(a=>norm(a)===n); };
const clozeList = w => w.clozeAnswers || w.acceptedEnglishAnswers.filter(a=>!/^(to|an|a) /i.test(a));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const dayKey = ts => { const d=new Date(ts); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const fmtDT = ts => new Date(ts).toLocaleString("ru-RU",{day:"numeric",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"});
const fmtDayKey = k => { const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString("ru-RU",{weekday:"short",day:"numeric",month:"long"}); };
const plural=(n,a,b,c)=>{const m10=n%10,m100=n%100;return m10===1&&m100!==11?a:(m10>=2&&m10<=4&&(m100<12||m100>14)?b:c);};
const plainSentence = w => w.exampleSentence.replace(/\[\[(.+?)\]\]/g,"$1");
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const ExtraExamples = ({w}) => html`<div class="muted small">${(w.extraExamples||[]).map((sentence,i)=>html`<p key=${i} style=${{margin:"7px 0 0"}}><span class="ex" lang="en">${sentence}</span></p>`)}</div>`;

/* ---------------- мобильная прокрутка и фокус ---------------- */
let acted=false;
["pointerdown","keydown","touchstart"].forEach(e=>window.addEventListener(e,()=>{acted=true;},{capture:true,passive:true}));
const finePointer = () => !!(window.matchMedia && matchMedia("(pointer:fine)").matches);
const reduced = () => !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
const viewH = () => window.visualViewport ? window.visualViewport.height : window.innerHeight;
const scrollByY = d => window.scrollBy({top:d,behavior:reduced()?"auto":"smooth"});
function revealBottom(el){ if(!el||!acted) return; const r=el.getBoundingClientRect(), h=viewH();
  if(r.bottom>h-12){ const d=Math.min(r.bottom-h+16, r.top-TOP_OFFSET); if(d>4) scrollByY(d); } }
function revealTop(el){ if(!el||!acted) return; const r=el.getBoundingClientRect(); if(r.top<TOP_OFFSET-6) scrollByY(r.top-TOP_OFFSET); }
function useRevealTop(dep){ const ref=useRef(null); useEffect(()=>{ revealTop(ref.current); },[dep]); return ref; }
/* не даём кнопке забрать фокус у поля ввода — клавиатура телефона не закрывается */
const keepFocus = e => e.preventDefault();

/* ---------------- state ---------------- */
const LEVELS = [
  {n:1,key:"match",title:"Найди пару"},
  {n:2,key:"choice",title:"Выбери перевод"},
  {n:3,key:"cards",title:"Вспомни перевод"},
  {n:4,key:"cloze",title:"Заполни пропуск"},
  {n:5,key:"reverse",title:"Переведи наоборот"},
  {n:6,key:"truefalse",title:"Найди ошибку"},
  {n:7,key:"final",title:"Итоговая проверка"}
];
function freshState(){
  const levels={}; for(let i=1;i<=6;i++) levels[i]={learned:[],size:10,runs:0,session:null};
  return {v:1,updatedAt:0,stats:{},levels,test:{current:null,history:[]},tab:1};
}
function sanitize(s){
  const f=freshState(); if(!s||typeof s!=="object") return f;
  const out=Object.assign(f,s); out.levels=Object.assign(freshState().levels,s.levels||{});
  out.test=Object.assign({current:null,history:[]},s.test||{}); out.stats=s.stats||{}; return out;
}
function loadLocal(){ try{ return sanitize(JSON.parse(localStorage.getItem(LS_KEY))); }catch(e){ return freshState(); } }
function saveLocal(s){ try{ localStorage.setItem(LS_KEY,JSON.stringify(s)); }catch(e){} }

/* weighted pick: words with mistakes and words not yet learned in this level come up more often */
function pickWords(state, level, n){
  const learned=new Set(state.levels[level].learned);
  const keyed=WORDS.map(w=>{const st=state.stats[w.id]||{c:0,w:0};
    let wt=1+2.2*Math.min(st.w,5)+(learned.has(w.id)?0:1.2)-Math.min(st.c,5)*0.15; wt=Math.max(.3,wt);
    return {id:w.id,k:Math.pow(Math.random(),1/wt)};});
  keyed.sort((a,b)=>b.k-a.k); return keyed.slice(0,n).map(x=>x.id);
}
function distractors(target, n, field){
  const t=BY[target];
  const ok=w=>w.id!==target && !(t.group && w.group===t.group) && w[field]!==t[field];
  let pool=shuffle(WORDS.filter(w=>ok(w)&&w.category===t.category));
  if(pool.length<n) pool=pool.concat(shuffle(WORDS.filter(w=>ok(w)&&w.category!==t.category)));
  return pool.slice(0,n).map(w=>w.id);
}
function mastery(st){ if(!st) return 0; const m=st.c-st.w; if(m>=3) return 3; if(m>=1) return 2; return 1; }

/* ---------------- звук и вибрация ---------------- */
let actx=null;
function audio(){ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
  try{ if(!actx) actx=new AC(); if(actx.state==="suspended") actx.resume(); }catch(e){ return null; } return actx; }
/* телефоны разрешают звук только после касания — «будим» аудио при первом нажатии */
function unlockAudio(){ const c=audio(); if(!c) return; try{ const b=c.createBuffer(1,1,22050), s=c.createBufferSource(); s.buffer=b; s.connect(c.destination); s.start(0); }catch(e){} }
HOST.addEventListener("pointerdown",unlockAudio,{passive:true});
HOST.addEventListener("touchend",unlockAudio,{passive:true});
document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&actx&&actx.state==="suspended") actx.resume(); });
function tone(seq){ const c=audio(); if(!c) return; try{ const t0=c.currentTime+.02;
  seq.forEach(([f,start,dur,vol,type,f2])=>{ const o=c.createOscillator(), g=c.createGain();
    o.type=type||"sine"; o.frequency.setValueAtTime(f,t0+start); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t0+start+dur);
    g.gain.setValueAtTime(0.0001,t0+start); g.gain.linearRampToValueAtTime(vol||.2,t0+start+.012); g.gain.exponentialRampToValueAtTime(.0001,t0+start+dur);
    o.connect(g); g.connect(c.destination); o.start(t0+start); o.stop(t0+start+dur+.05); }); }catch(e){} }
const SFX={
  ok:[[659.25,0,.16,.22,"triangle"],[987.77,.085,.3,.2,"sine"]],
  bad:[[246,0,.2,.2,"triangle",196],[250,0,.2,.06,"sawtooth",200],[185,.15,.32,.2,"triangle",150],[188,.15,.32,.05,"sawtooth",152]],
  set:[[523.25,0,.14,.18,"triangle"],[659.25,.08,.14,.18,"triangle"],[783.99,.16,.3,.2,"sine"]],
  finish:[[392,0,.22,.17,"triangle"],[523.25,.11,.22,.17,"triangle"],[659.25,.22,.42,.18,"sine"]],
  done:[[523.25,0,.3,.2,"triangle"],[659.25,.08,.3,.2,"triangle"],[783.99,.16,.4,.2,"triangle"],[1046.5,.26,.7,.2,"sine"]],
  tap:[[520,0,.07,.08,"sine"]]
};
const VIB={ok:18,bad:[45,50,45],set:[20,40,20],finish:[25,40,60],done:[30,40,30,40,90]};

/* ---------------- icons ---------------- */
const IcoOk = html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;
const IcoBad = html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>`;
const IcoRestart = html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6"/><path d="M3.5 3.5V8H8"/></svg>`;
const IcoChevron = html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>`;

/* ---------------- shared UI ---------------- */
function Feedback({ok,children,onNext,nextLabel,title}){
  const box=useRef(null), btn=useRef(null);
  useEffect(()=>{ if(btn.current&&finePointer()) btn.current.focus({preventScroll:true});
    const t=setTimeout(()=>revealBottom(box.current),60); return ()=>clearTimeout(t); },[]);
  return html`<div ref=${box} class=${"fb "+(ok?"fb-ok":"fb-bad")} role="status" aria-live="polite">
    <div class="fb-h">${ok?IcoOk:IcoBad}${title||(ok?"Правильно!":"Ошибка")}</div>
    ${children?html`<div class="fb-b">${children}</div>`:null}
    ${onNext?html`<button ref=${btn} class="btn btn-primary" onClick=${onNext}>${nextLabel||"Дальше"}</button>`:null}
  </div>`;
}
function LevelHead({level,state,update,onRestart,extra}){
  const L=state.levels[level], learned=L.learned.length;
  return html`<div class="lv-head">
    <div class="learned"><span>Изучено <b>${learned}</b> из ${TOTAL}</span><span class="bar" aria-hidden="true"><i style=${{width:(learned/TOTAL*100)+"%"}}></i></span></div>
    ${extra}
    <div class="lv-ctrl">
      <div class="seg-w"><span>Слов:</span>
        <div class="seg" role="group" aria-label="Слов в тренировке">
          ${[10,20,50].map(n=>html`<button key=${n} aria-pressed=${L.size===n} onClick=${()=>{update(s=>{s.levels[level].size=n;s.levels[level].session=null;});}}>${n}</button>`)}
        </div>
      </div>
      <button class="btn btn-ghost btn-sm" onClick=${onRestart}>${IcoRestart}Заново</button>
    </div>
  </div>`;
}
function Progress({pos,len,label}){
  return html`<div class="sess-prog"><span>${label||"Задание"} ${Math.min(pos+1,len)} из ${len}</span><span class="bar" aria-hidden="true"><i style=${{width:(pos/len*100)+"%"}}></i></span></div>`;
}
function Summary({sess,onAgain,sfx}){
  const ref=useRef(null);
  useEffect(()=>{ sfx&&sfx("finish"); revealTop(ref.current); },[]);
  const pct=Math.round(sess.correct/Math.max(1,sess.correct+sess.wrong)*100);
  return html`<div class="card summary" ref=${ref}>
    <h2>Тренировка завершена</h2>
    <p class="sum-line"><span class="big">${sess.correct}</span> ${plural(sess.correct,"правильный ответ","правильных ответа","правильных ответов")} и <span class="big">${sess.wrong}</span> ${plural(sess.wrong,"ошибка","ошибки","ошибок")}</p>
    <p class="muted">Точность ${pct}%. Слова с ошибками будут чаще попадаться в следующих тренировках.</p>
    <button class="btn btn-primary btn-wide" onClick=${onAgain}>Ещё одна тренировка</button>
  </div>`;
}

/* record a training answer */
function record(s, level, id, ok){
  const st=s.stats[id]||(s.stats[id]={c:0,w:0}); if(ok) st.c++; else st.w++;
  if(ok && !s.levels[level].learned.includes(id)) s.levels[level].learned.push(id);
}

/* ---------------- Level 1: matching ---------------- */
function buildSets(ids){
  const sets=[]; const rest=ids.slice();
  while(rest.length){ const size=rest.length<=8?rest.length:6; const set=[];
    for(let i=0;i<rest.length&&set.length<size;){ const w=BY[rest[i]];
      if(!w.group||!set.some(x=>BY[x].group===w.group)){ set.push(rest[i]); rest.splice(i,1);} else i++; }
    if(!set.length) set.push(rest.shift());
    sets.push({ids:set,ru:shuffle(set),matched:[]}); }
  return sets;
}
function Match({state,update,sfx}){
  const lv=1, L=state.levels[lv];
  const start=()=>update(s=>{const ids=pickWords(s,lv,s.levels[lv].size);s.levels[lv].session={sets:buildSets(ids),idx:0,correct:0,wrong:0,done:false};s.levels[lv].runs++;});
  useEffect(()=>{ if(!L.session) start(); },[L.session]);
  const S=L.session;
  return html`<div>
    <${LevelHead} level=${lv} state=${state} update=${update} onRestart=${start}/>
    ${!S?null:S.done?html`<${Summary} sess=${S} onAgain=${start} sfx=${sfx}/>`:html`<${MatchSet} key=${S.idx+":"+L.runs} S=${S} update=${update} sfx=${sfx}/>`}
  </div>`;
}
function MatchSet({S,update,sfx}){
  const lv=1, set=S.sets[S.idx];
  const [sel,setSel]=useState({en:null,ru:null}); const [flash,setFlash]=useState(null); const [msg,setMsg]=useState(null);
  const card=useRevealTop(S.idx);
  const setDone=set.matched.length===set.ids.length;
  useEffect(()=>{ if(setDone&&!S.done){ const t=setTimeout(()=>update(s=>{s.levels[lv].session.idx++;}),1300); return ()=>clearTimeout(t);} },[setDone,S.done]);
  useEffect(()=>{ if(!msg) return; const t=setTimeout(()=>setMsg(null),msg.ok?1200:3200); return ()=>clearTimeout(t); },[msg]);
  const trySel=(side,id)=>{
    if(set.matched.includes(id)) return;
    const next=Object.assign({},sel,{[side]:sel[side]===id?null:id});
    if(next.en!=null&&next.ru!=null){
      const ok=next.en===next.ru, en=next.en;
      const completes = ok && set.matched.length+1===set.ids.length;
      setFlash({en:next.en,ru:next.ru,ok}); sfx(ok?(completes?"set":"ok"):"bad"); setMsg({ok,en,k:Date.now()});
      setTimeout(()=>setFlash(null),650); setSel({en:null,ru:null});
      update(s=>{const ss=s.levels[lv].session, st=ss.sets[ss.idx]; record(s,lv,en,ok);
        if(ok){ss.correct++; st.matched.push(en); if(st.matched.length===st.ids.length && ss.idx===ss.sets.length-1) ss.done=true;}
        else ss.wrong++;});
    } else { sfx("tap"); setSel(next); }
  };
  const cls=(side,id)=>{ let c="pair"; if(set.matched.includes(id)) c+=" matched"; if(sel[side]===id) c+=" sel";
    if(flash&&flash[side]===id) c+=flash.ok?" good":" badf"; return c; };
  return html`<div class="card" ref=${card}>
      <${Progress} pos=${S.idx} len=${S.sets.length} label="Набор"/>
      <p class="hint">Нажмите английское слово, а затем его перевод.</p>
      <div class="match">
        <div class="col" role="group" aria-label="Английские слова">${set.ids.map(id=>html`<button key=${"e"+id} class=${cls("en",id)+" en"} lang="en" disabled=${set.matched.includes(id)} aria-pressed=${sel.en===id} onClick=${()=>trySel("en",id)}>${BY[id].english}</button>`)}</div>
        <div class="col" role="group" aria-label="Переводы">${set.ru.map(id=>html`<button key=${"r"+id} class=${cls("ru",id)} lang="ru" disabled=${set.matched.includes(id)} aria-pressed=${sel.ru===id} onClick=${()=>trySel("ru",id)}>${BY[id].russian}</button>`)}</div>
      </div>
      ${setDone?html`<div class="fb fb-ok set-done"><div class="fb-h">${IcoOk}Набор собран!</div><div class="fb-b">${S.idx<S.sets.length-1?"Переходим к следующему набору.":"Это был последний набор."}</div></div>`:null}
      ${msg&&!setDone?html`<div key=${msg.k} class=${"toast "+(msg.ok?"fb-ok":"fb-bad")} role="status" aria-live="polite">
          <b>${msg.ok?"Правильно!":"Ошибка"}</b>${!msg.ok?html`<span style=${{color:"var(--ink)"}}><span lang="en" class="en">${BY[msg.en].english}</span> означает «${BY[msg.en].russian}».</span>`:null}</div>`:null}
    </div>`;
}

/* ---------------- queue-based levels (2,4,5,6) ---------------- */
function newQueueSession(s,lv,extra){ const ids=pickWords(s,lv,s.levels[lv].size);
  s.levels[lv].session=Object.assign({queue:ids,pos:0,correct:0,wrong:0,requeued:[],ans:null,done:false},extra?extra(ids):{}); s.levels[lv].runs++; }
function advance(s,lv){ const ss=s.levels[lv].session; ss.pos++; ss.ans=null; if(ss.pos>=ss.queue.length) ss.done=true; }
function answerQ(s,lv,id,ok,ans){ const ss=s.levels[lv].session; record(s,lv,id,ok); if(ok) ss.correct++; else { ss.wrong++;
  if(!ss.requeued.includes(id)){ ss.requeued.push(id); const at=Math.min(ss.queue.length, ss.pos+3+Math.floor(Math.random()*3)); ss.queue.splice(at,0,id); } }
  ss.ans=Object.assign({ok},ans); }

/* Level 2 */
function Choice({state,update,sfx}){
  const lv=2,L=state.levels[lv];
  const start=()=>update(s=>newQueueSession(s,lv,()=>({opts:{}})));
  useEffect(()=>{ if(!L.session) start(); },[L.session]);
  const S=L.session;
  return html`<div><${LevelHead} level=${lv} state=${state} update=${update} onRestart=${start}/>
    ${!S?null:S.done?html`<${Summary} sess=${S} onAgain=${start} sfx=${sfx}/>`:html`<${ChoiceItem} S=${S} update=${update} sfx=${sfx}/>`}</div>`;
}
function ChoiceItem({S,update,sfx}){
  const lv=2, id=S.queue[S.pos], w=BY[id];
  const card=useRevealTop(S.pos);
  useEffect(()=>{ if(!S.opts[S.pos]) update(s=>{const ss=s.levels[lv].session; ss.opts[ss.pos]=shuffle([id].concat(distractors(id,3,"russian")));}); },[S.pos]);
  const o=S.opts[S.pos]||[];
  const choose=c=>{ if(S.ans) return; const ok=c===id; sfx(ok?"ok":"bad"); update(s=>answerQ(s,lv,id,ok,{choice:c})); };
  useEffect(()=>{ const k=e=>{ if(S.ans||/input|textarea|select/i.test(e.target.tagName)) return; const n=parseInt(e.key,10); if(n>=1&&n<=4&&o[n-1]!=null) choose(o[n-1]); };
    window.addEventListener("keydown",k); return ()=>window.removeEventListener("keydown",k); });
  return html`<div class="card" ref=${card}>
      <${Progress} pos=${S.pos} len=${S.queue.length}/>
      <div class="word" lang="en">${w.english}</div>
      <div class="opts" role="group" aria-label="Варианты перевода">
        ${o.map((c,i)=>{ let cl="opt"; if(S.ans){ if(c===id) cl+=" good"; else if(c===S.ans.choice) cl+=" badf"; else cl+=" faded"; }
          return html`<button key=${c} class=${cl} disabled=${!!S.ans} onClick=${()=>choose(c)}><span class="k" aria-hidden="true">${i+1}</span>${BY[c].russian}</button>`; })}
      </div>
      ${S.ans?html`<${Feedback} key=${"f"+S.pos} ok=${S.ans.ok} onNext=${()=>update(s=>advance(s,lv))}>
        ${S.ans.ok?html`<span class="ex" lang="en">${plainSentence(w)}</span><${ExtraExamples} w=${w}/>`:html`<span><span lang="en" class="en">${w.english}</span> означает «${w.russian}». Пример: <span class="ex" lang="en">${plainSentence(w)}</span><${ExtraExamples} w=${w}/></span>`}
      </${Feedback}>`:null}
    </div>`;
}

/* Level 3: cards */
function Cards({state,update,sfx}){
  const lv=3,L=state.levels[lv];
  const start=()=>update(s=>{const dir=(s.levels[lv].session&&s.levels[lv].session.dir)||"en";newQueueSession(s,lv,()=>({dir,revealed:false,repeat:[]}));});
  useEffect(()=>{ if(!L.session) start(); },[L.session]);
  const S=L.session;
  const card=useRevealTop(S?S.pos:0);
  if(!S) return null;
  const setDir=d=>update(s=>{s.levels[lv].session.dir=d;s.levels[lv].session.revealed=false;});
  const extra=html`<div class="seg dir" role="group" aria-label="Направление карточек">
    <button aria-pressed=${S.dir==="en"} onClick=${()=>setDir("en")}>EN → RU</button>
    <button aria-pressed=${S.dir==="ru"} onClick=${()=>setDir("ru")}>RU → EN</button></div>`;
  if(S.done) return html`<div><${LevelHead} level=${lv} state=${state} update=${update} onRestart=${start} extra=${extra}/>
    <${Summary} sess=${S} onAgain=${start} sfx=${sfx}/>
    ${S.repeat.length?html`<div class="card"><h3 class="h3">Повторить эти слова</h3><ul class="replist">${S.repeat.map(i=>html`<li key=${i}><span lang="en" class="en">${BY[i].english}</span> <span class="muted">${BY[i].russian}</span></li>`)}</ul></div>`:null}</div>`;
  const id=S.queue[S.pos], w=BY[id];
  const front = S.dir==="en"? html`<div class="word" lang="en">${w.english}</div>` : html`<div class="word ru">${w.russian}</div>`;
  const back = S.dir==="en"? html`<div class="answer">${w.russian}</div>` : html`<div class="answer en" lang="en">${w.english}</div>`;
  const reveal=()=>{ if(S.revealed) return; sfx("tap"); update(s=>{s.levels[lv].session.revealed=true;}); };
  const mark=ok=>{ sfx(ok?"ok":"bad"); update(s=>{const ss=s.levels[lv].session; answerQ(s,lv,id,ok,{}); if(!ok&&!ss.repeat.includes(id)) ss.repeat.push(id); advance(s,lv); ss.revealed=false;}); };
  return html`<div><${LevelHead} level=${lv} state=${state} update=${update} onRestart=${start} extra=${extra}/>
    <div class="card flash" ref=${card}>
      <${Progress} pos=${S.pos} len=${S.queue.length} label="Карточка"/>
      ${S.revealed
        ? html`<div class="flip on">${front}<div class="back">${back}<p class="ex" lang="en">${plainSentence(w)}</p><p class="muted small">${w.exampleTranslation}</p><${ExtraExamples} w=${w}/></div></div>`
        : html`<button class="flip" onClick=${reveal} aria-label="Показать перевод">${front}<span class="tap-hint">Вспомните перевод и нажмите на карточку</span></button>`}
      ${!S.revealed?html`<button class="btn btn-primary btn-wide" onClick=${reveal}>Показать перевод</button>`
        :html`<${RevealBtns} key=${"m"+S.pos} mark=${mark}/>`}
      ${S.repeat.length?html`<p class="muted small" style=${{margin:"12px 0 0"}}>Для повторения: ${S.repeat.length}</p>`:null}
    </div></div>`;
}
function RevealBtns({mark}){
  const ref=useRef(null);
  useEffect(()=>{ const t=setTimeout(()=>revealBottom(ref.current),60); return ()=>clearTimeout(t); },[]);
  return html`<div class="row2" ref=${ref}><button class="btn btn-ok" onClick=${()=>mark(true)}>Я вспомнила правильно</button><button class="btn btn-bad" onClick=${()=>mark(false)}>Не вспомнила</button></div>`;
}

/* Typing levels 4 & 5 */
function TypeLevel({lv,state,update,sfx,mode}){
  const L=state.levels[lv];
  const start=()=>update(s=>newQueueSession(s,lv));
  useEffect(()=>{ if(!L.session) start(); },[L.session]);
  const [val,setVal]=useState(""); const inp=useRef(null);
  const S=L.session;
  const card=useRevealTop(S?S.pos:0);
  useEffect(()=>{ setVal(""); if(inp.current&&acted&&finePointer()) inp.current.focus({preventScroll:true}); },[S&&S.pos,S&&S.done]);
  if(!S) return null;
  if(S.done) return html`<div><${LevelHead} level=${lv} state=${state} update=${update} onRestart=${start}/><${Summary} sess=${S} onAgain=${start} sfx=${sfx}/></div>`;
  const id=S.queue[S.pos], w=BY[id];
  const list = mode==="cloze"? clozeList(w) : w.acceptedEnglishAnswers;
  const submit=e=>{ e&&e.preventDefault();
    if(S.ans){ update(s=>advance(s,lv)); return; }
    if(!val.trim()) return; const ok=accepts(list,val); sfx(ok?"ok":"bad"); update(s=>answerQ(s,lv,id,ok,{given:val})); };
  let prompt;
  if(mode==="cloze"){
    const parts=w.exampleSentence.split(/\[\[(.+?)\]\]/);
    prompt=html`<p class="cloze" lang="en">${parts.map((p,i)=> i%2? html`<span key=${i} class="gap">${p.split(" ").map((x,j)=>html`<span key=${j} class="gapw" style=${{width:Math.max(3,x.length*.62)+"em"}}></span>`)}</span>` : p)}</p>
      <p class="mean">Значение пропущенного слова: «${w.russian}»</p>`;
  } else {
    prompt=html`<div class="word ru">${cap(w.testPrompt)}</div><p class="mean">Напишите английское слово или выражение.</p>`;
  }
  return html`<div><${LevelHead} level=${lv} state=${state} update=${update} onRestart=${start}/>
    <div class="card" ref=${card}>
      <${Progress} pos=${S.pos} len=${S.queue.length}/>
      ${prompt}
      <form class="answer-form" onSubmit=${submit} autocomplete="off">
        <input ref=${inp} lang="en" class=${S.ans?(S.ans.ok?"ok":"bad"):""} value=${S.ans?S.ans.given:val} readOnly=${!!S.ans} onChange=${e=>{ if(!S.ans) setVal(e.target.value); }}
          placeholder="Ответ на английском" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint=${S.ans?"next":"done"} aria-label="Ответ"/>
        ${!S.ans?html`<button class="btn btn-primary" type="submit" onMouseDown=${keepFocus} disabled=${!val.trim()}>Проверить</button>`
          :html`<button class="btn btn-primary" type="submit" onMouseDown=${keepFocus}>Дальше</button>`}
      </form>
      ${S.ans?html`<${Feedback} key=${"f"+S.pos} ok=${S.ans.ok}>
        ${mode==="cloze"?html`<span>${!S.ans.ok?html`<span>Правильно: <b lang="en" class="en">${clozeList(w)[0]}</b><br/></span>`:null}<span class="ex" lang="en">${plainSentence(w)}</span><br/><span class="muted">${w.exampleTranslation}</span><${ExtraExamples} w=${w}/>${!S.ans.ok?html`<p class="muted">Это слово встретится ещё раз в этой тренировке.</p>`:null}</span>`
          :html`<span>Правильно: <b lang="en" class="en">${w.english}</b>${w.acceptedEnglishAnswers.length>1?html` <span class="muted">(принимается также: ${w.acceptedEnglishAnswers.filter(a=>norm(a)!==norm(w.english)).join(", ")})</span>`:null}${!S.ans.ok?html`<br/><span class="muted">Это слово встретится ещё раз в этой тренировке.</span>`:null}</span>`}
      </${Feedback}>`:null}
    </div></div>`;
}

/* Level 6 */
function TrueFalse({state,update,sfx}){
  const lv=6,L=state.levels[lv];
  const start=()=>update(s=>newQueueSession(s,lv,ids=>{const t={};const half=shuffle(ids).slice(0,Math.ceil(ids.length/2));ids.forEach(i=>t[i]=half.includes(i));return {truth:t};}));
  useEffect(()=>{ if(!L.session) start(); },[L.session]);
  const S=L.session;
  const card=useRevealTop(S?S.pos:0);
  const fallback=useRef({});
  if(!S) return null;
  if(S.done) return html`<div><${LevelHead} level=${lv} state=${state} update=${update} onRestart=${start}/><${Summary} sess=${S} onAgain=${start} sfx=${sfx}/></div>`;
  const id=S.queue[S.pos], w=BY[id];
  let isTrue = S.truth[id];
  if(isTrue===undefined){ const fk=S.pos+":"+id; if(fallback.current[fk]===undefined) fallback.current[fk]=Math.random()<.5; isTrue=fallback.current[fk]; }
  const shown = isTrue? w.russian : w.wrongRussian;
  const pick=v=>{ if(S.ans) return; const ok=v===isTrue; sfx(ok?"ok":"bad"); update(s=>{ answerQ(s,lv,id,ok,{v,isTrue,shown}); const ss=s.levels[lv].session; if(ss.truth[id]!==undefined && ss.requeued.includes(id)) ss.truth[id]=!ss.truth[id]; }); };
  const disp = S.ans? S.ans.shown : shown;
  const truthNow = S.ans? S.ans.isTrue : isTrue;
  return html`<div><${LevelHead} level=${lv} state=${state} update=${update} onRestart=${start}/>
    <div class="card" ref=${card}>
      <${Progress} pos=${S.pos} len=${S.queue.length}/>
      <p class="hint">Верен ли перевод?</p>
      <div class="claim"><span class="word" lang="en">${w.english}</span><span class="eq">означает</span><span class="claim-ru">«${disp}»</span></div>
      <div class="row2">
        <button class=${"btn btn-ok"+(S.ans&&S.ans.v!==true?" faded":"")} disabled=${!!S.ans} onClick=${()=>pick(true)}>Правильно</button>
        <button class=${"btn btn-bad"+(S.ans&&S.ans.v!==false?" faded":"")} disabled=${!!S.ans} onClick=${()=>pick(false)}>Неправильно</button>
      </div>
      ${S.ans?html`<${Feedback} key=${"f"+S.pos} ok=${S.ans.ok} onNext=${()=>update(s=>advance(s,lv))}>
        ${truthNow?html`<span>Перевод верный: «${w.russian}».</span>`:html`<span>Перевод неверный. Правильно: <b>«${w.russian}»</b>.</span>`}
      </${Feedback}>`:null}
    </div></div>`;
}

/* ---------------- Level 7: final test ---------------- */
function Confetti(){
  const ref=useRef(null);
  useEffect(()=>{ if(reduced()) return;
    const c=ref.current,x=c.getContext("2d"); const dpr=window.devicePixelRatio||1; let W,H; W=c.width=c.offsetWidth*dpr; H=c.height=c.offsetHeight*dpr;
    const cols=["#7C89F0","#9DDBB7","#F6D77A","#F2A9B6","#B9A8F2"];
    const P=Array.from({length:120},()=>({x:Math.random()*W,y:-Math.random()*H*.6,vx:(Math.random()-.5)*2*dpr,vy:(2+Math.random()*3)*dpr,r:(4+Math.random()*5)*dpr,a:Math.random()*6,va:(Math.random()-.5)*.25,c:cols[Math.floor(Math.random()*cols.length)]}));
    let raf,t0=performance.now();
    const step=t=>{x.clearRect(0,0,W,H);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore();});
      if(t-t0<4200) raf=requestAnimationFrame(step); else x.clearRect(0,0,W,H);};
    raf=requestAnimationFrame(step); return ()=>cancelAnimationFrame(raf); },[]);
  return html`<canvas ref=${ref} class="confetti" aria-hidden="true"></canvas>`;
}
function Badge(){
  return html`<svg class="badge" viewBox="0 0 120 120" aria-hidden="true">
    <circle cx="60" cy="60" r="54" fill="var(--butter)"/><circle cx="60" cy="60" r="44" fill="none" stroke="#23283A" stroke-width="2" stroke-dasharray="3 5"/>
    <text x="60" y="58" text-anchor="middle" font-family="Newsreader, Georgia, serif" font-size="28" font-weight="600" fill="#23283A">${TOTAL}/${TOTAL}</text>
    <text x="60" y="80" text-anchor="middle" font-family="Onest, sans-serif" font-size="11" fill="#23283A">все слова</text></svg>`;
}
function History({hist}){
  const days=useMemo(()=>{const m={};hist.forEach(h=>{const k=dayKey(h.ts);(m[k]=m[k]||[]).push(h);});return m;},[hist]);
  const keys=Object.keys(days).sort().reverse(); const today=dayKey(Date.now());
  const [day,setDay]=useState(today);
  const list=(days[day]||[]).slice().sort((a,b)=>a.ts-b.ts);
  const best=list.length?Math.max(...list.map(h=>h.score)):null;
  const avg=list.length?(list.reduce((a,h)=>a+h.score,0)/list.length):null;
  const perfect=hist.filter(h=>h.score===h.total); const lastPerfect=perfect.length?Math.max(...perfect.map(h=>h.ts)):null;
  const perfectDays=new Set(perfect.map(h=>dayKey(h.ts))).size;
  const opts=keys.includes(today)?keys:[today].concat(keys);
  return html`<section class="card hist" aria-labelledby="cvt-hist-h">
    <div class="hist-top"><h2 id="cvt-hist-h" class="h3" style=${{margin:0}}>Мои результаты</h2>
      <label class="daysel">День <select value=${day} onChange=${e=>setDay(e.target.value)}>${opts.map(k=>html`<option key=${k} value=${k}>${k===today?"Сегодня":fmtDayKey(k)}</option>`)}</select></label></div>
    <div class="stats4">
      <div><span class="sv">${best!=null?best+"/"+TOTAL:"—"}</span><span class="sl">лучший результат дня</span></div>
      <div><span class="sv">${list.length}</span><span class="sl">${plural(list.length,"попытка","попытки","попыток")} за день</span></div>
      <div><span class="sv">${avg!=null?avg.toFixed(1).replace(".",","):"—"}</span><span class="sl">средний балл за день</span></div>
      <div><span class="sv">${perfectDays}</span><span class="sl">${plural(perfectDays,"день","дня","дней")} с результатом ${TOTAL}/${TOTAL}</span></div>
    </div>
    <p class="muted small">Последнее идеальное прохождение: ${lastPerfect?fmtDT(lastPerfect):"пока не было"}.</p>
    ${list.length?html`<div class="tblwrap"><table><thead><tr><th>№</th><th>Время</th><th>Результат</th><th>Ошибки</th></tr></thead>
      <tbody>${list.map((h,i)=>html`<tr key=${h.ts}><td>${i+1}</td><td>${new Date(h.ts).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})}</td><td><b>${h.score}/${h.total}</b></td><td>${h.total-h.score}</td></tr>`)}</tbody></table></div>`
      :html`<p class="muted" style=${{margin:0}}>В этот день завершённых попыток нет.</p>`}
  </section>`;
}
function Final({state,update,sfx}){
  const T=state.test, cur=T.current;
  const [result,setResult]=useState(null); const [confirm,setConfirm]=useState(false); const [grid,setGrid]=useState(false);
  const inp=useRef(null), top=useRef(null);
  const begin=()=>{ setResult(null); sfx("tap"); update(s=>{s.test.current={order:shuffle(WORDS.map(w=>w.id)),answers:{},idx:0,startedAt:Date.now()};}); };
  useEffect(()=>{ if(inp.current&&acted&&finePointer()) inp.current.focus({preventScroll:true}); revealTop(top.current); },[cur&&cur.idx]);
  useEffect(()=>{ if(result) revealTop(top.current); },[result]);
  if(result) {
    const perfect=result.score===result.total;
    return html`<div ref=${top}>
      ${perfect?html`<div class="card win"><${Confetti}/><${Badge}/>
        <h2 class="win-h">Идеальный результат! ${TOTAL} из ${TOTAL}. Ты знаешь все слова!</h2>
        <p class="muted">${fmtDT(result.ts)}</p>
        <button class="btn btn-primary btn-wide" onClick=${begin}>Пройти ещё раз</button></div>`
      :html`<div class="card result" role="status">
        <h2>Тест завершён</h2>
        <div class="stats3"><div><span class="sv">${result.score}/${result.total}</span><span class="sl">правильных ответов</span></div>
          <div><span class="sv">${result.total-result.score}</span><span class="sl">${plural(result.total-result.score,"ошибка","ошибки","ошибок")}</span></div>
          <div><span class="sv">${Math.round(result.score/result.total*100)}%</span><span class="sl">правильных</span></div></div>
        <p class="muted">${fmtDT(result.ts)}</p>
        ${result.wrong&&result.wrong.length?html`<details style=${{margin:"0 0 14px"}}><summary style=${{cursor:"pointer",padding:"8px 0",fontWeight:600}}>Показать ошибки (${result.wrong.length})</summary>
          <ul class="replist">${result.wrong.map(r=>html`<li key=${r.id}>${BY[r.id].testPrompt} — <b lang="en" class="en">${BY[r.id].english}</b>${r.given?html` <span class="muted">(ваш ответ: <s>${r.given}</s>)</span>`:null}</li>`)}</ul></details>`:null}
        <button class="btn btn-primary btn-wide" onClick=${begin}>Пройти ещё раз</button></div>`}
      <${History} hist=${T.history}/></div>`;
  }
  if(!cur) return html`<div>
    <div class="card intro">
      <h2>Итоговая проверка</h2>
      <p>${TOTAL} заданий: по русскому значению напишите английское слово или выражение. Каждое слово встретится один раз.</p>
      <p>Во время теста правильность ответов не показывается. Между заданиями можно свободно переходить и менять ответы. Результат появится после кнопки «Завершить тест».</p>
      <p class="muted">Цель: ${TOTAL} из ${TOTAL} за одну попытку. Если закрыть страницу, ответы сохранятся.</p>
      <button class="btn btn-primary btn-wide" onClick=${begin}>Начать тест</button>
    </div>
    <${History} hist=${T.history}/></div>`;
  const id=cur.order[cur.idx], w=BY[id];
  const isFilled=i=>!!(cur.answers[i]||"").trim();
  const filled=cur.order.filter(isFilled).length;
  const all=filled===cur.order.length;
  const setAns=v=>update(s=>{s.test.current.answers[id]=v;});
  const go=i=>update(s=>{s.test.current.idx=Math.max(0,Math.min(cur.order.length-1,i));});
  const nextEmpty=()=>{ const n=cur.order.length; for(let k=1;k<=n;k++){ const j=(cur.idx+k)%n; if(!isFilled(cur.order[j])) return j; } return -1; };
  const finish=()=>{ let score=0; const wrong=[];
    cur.order.forEach(i=>{ if(accepts(BY[i].acceptedEnglishAnswers,cur.answers[i])) score++; else wrong.push({id:i,given:(cur.answers[i]||"").trim()}); });
    const r={ts:Date.now(),score,total:cur.order.length}; setConfirm(false); setResult(Object.assign({wrong},r)); sfx(score===r.total?"done":"finish");
    update(s=>{s.test.history.push(r);s.test.current=null;}); };
  const onSubmit=e=>{ e.preventDefault(); if(cur.idx<cur.order.length-1) go(cur.idx+1); else { const f=nextEmpty(); if(f>=0) go(f); } };
  const ne=nextEmpty();
  return html`<div ref=${top}>
    <div class="card test">
      <div class="sess-prog"><span>Задание ${cur.idx+1} из ${cur.order.length}</span><span>Заполнено ${filled}</span></div>
      <div class="bar" aria-hidden="true" style=${{margin:"-6px 0 16px"}}><i style=${{width:(filled/cur.order.length*100)+"%"}}></i></div>
      <div class="word ru">${cap(w.testPrompt)}</div>
      <form class="answer-form" onSubmit=${onSubmit} autocomplete="off">
        <input ref=${inp} lang="en" value=${cur.answers[id]||""} onChange=${e=>setAns(e.target.value)} placeholder="Английское слово или выражение"
          autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="next" aria-label=${"Ответ на задание "+(cur.idx+1)}/>
      </form>
      <div class="test-nav">
        <button class="btn btn-ghost" onMouseDown=${keepFocus} disabled=${cur.idx===0} onClick=${()=>go(cur.idx-1)}>← Назад</button>
        <button class="btn btn-ghost" onMouseDown=${keepFocus} disabled=${cur.idx===cur.order.length-1} onClick=${()=>go(cur.idx+1)}>Вперёд →</button>
      </div>
      ${ne>=0&&ne!==cur.idx&&ne!==cur.idx+1?html`<button class="btn btn-ghost btn-wide" style=${{marginBottom:"10px",minHeight:"44px",fontSize:"15px"}} onMouseDown=${keepFocus} onClick=${()=>go(ne)}>К следующему пустому (№ ${ne+1})</button>`:null}
      <button class="grid-toggle" aria-expanded=${grid} onClick=${()=>setGrid(g=>!g)}><span>Все задания · заполнено ${filled} из ${cur.order.length}</span>${IcoChevron}</button>
      ${grid?html`<div class="grid50" role="group" aria-label="Переход к заданию">
        ${cur.order.map((i,n)=>html`<button key=${i} class=${"cell"+(n===cur.idx?" cur":"")+(isFilled(i)?" filled":"")} aria-label=${"Задание "+(n+1)+(isFilled(i)?", заполнено":", пусто")} aria-current=${n===cur.idx?"step":undefined} onClick=${()=>go(n)}>${n+1}</button>`)}
      </div>`:null}
      <div class="finish-row">
        <span class="muted small">${all?"Все ответы заполнены. Их ещё можно изменить.":`Кнопка станет доступна, когда будут заполнены все ${TOTAL} ответов.`}</span>
        <button class="btn btn-primary" disabled=${!all} onClick=${()=>setConfirm(true)}>Завершить тест</button>
      </div>
    </div>
    ${confirm?html`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="cvt-cf-h" onClick=${e=>{ if(e.target===e.currentTarget) setConfirm(false); }}><div class="modal-box">
      <h2 id="cvt-cf-h">Завершить тест?</h2><p>После этого ответы проверятся и изменить их будет нельзя.</p>
      <div class="row2"><button class="btn btn-primary" onClick=${finish}>Завершить тест</button><button class="btn btn-ghost" onClick=${()=>setConfirm(false)}>Вернуться к ответам</button></div></div></div>`:null}
    <${History} hist=${T.history}/></div>`;
}

/* ---------------- app ---------------- */

  const tab=state.tab||1;
  const setTab=n=>{ sfx("tap"); update(s=>{s.tab=n;}); };
  const resetTraining=()=>update(s=>{const f=freshState();s.stats={};s.levels=f.levels;});
  const resetHistory=()=>update(s=>{s.test.history=[];});
  const props={state,update,sfx};
  useEffect(()=>{ const c=tabsRef.current, el=c&&c.querySelector('[aria-selected="true"]'); if(!c||!el) return;
    const left=el.offsetLeft-(c.clientWidth-el.offsetWidth)/2; try{ c.scrollTo({left,behavior:acted&&!reduced()?"smooth":"auto"}); }catch(e){ c.scrollLeft=left; } },[tab]);
  const onTabKey=e=>{ if(e.key==="ArrowRight"||e.key==="ArrowLeft"){ e.preventDefault(); const n=((tab-1+(e.key==="ArrowRight"?1:-1)+7)%7)+1; setTab(n); setTimeout(()=>{const b=document.getElementById("cvt-tab-"+n); b&&b.focus();},0);} };
  const setPref=(k,v)=>setPrefs(p=>Object.assign({},p,{[k]:v}));

  return html`<div class="app">
    <header class="top">
      <div class="brand">
        <h1>Cognitive Vocabulary Trainer</h1>
        <p class="sub">${TOTAL} слов и выражений из статьи <span lang="en">“${SET.title}”</span></p>
      </div>
      <div class="top-r">
        <button class="icon-btn" aria-pressed=${prefs.sound} aria-label=${prefs.sound?"Выключить звук":"Включить звук"} onClick=${()=>{ const on=!prefs.sound; setPref("sound",on); if(on){ unlockAudio(); tone(SFX.ok); } }}>
          ${prefs.sound?html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>`
            :html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 5M22 9l-5 5"/></svg>`}
        </button>
        <div class="menu-w" ref=${menuRef}>
          <button class="icon-btn" aria-haspopup="true" aria-expanded=${menu} aria-label="Настройки" onClick=${()=>setMenu(m=>!m)}><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
          ${menu?html`<div class="menu" role="menu">
            <button class="mi" role="menuitemcheckbox" aria-checked=${prefs.sound} onClick=${()=>{ const on=!prefs.sound; setPref("sound",on); if(on){ unlockAudio(); tone(SFX.ok); } }}><span>Звук ответов</span><span class=${"sw"+(prefs.sound?" on":"")}></span></button>
            ${navigator.vibrate?html`<button class="mi" role="menuitemcheckbox" aria-checked=${prefs.vibro} onClick=${()=>{ const on=!prefs.vibro; setPref("vibro",on); if(on) try{navigator.vibrate(30);}catch(e){} }}><span>Вибрация</span><span class=${"sw"+(prefs.vibro?" on":"")}></span></button>`:null}
            <div class="mi" style=${{cursor:"default"}}><span>Тема</span>
              <div class="seg" role="group" aria-label="Тема">
                ${[["light","Светлая"],["dark","Тёмная"],["auto","Авто"]].map(([k,l])=>html`<button key=${k} aria-pressed=${prefs.theme===k} onClick=${()=>setPref("theme",k)}>${l}</button>`)}
              </div></div>
            <hr/>
            <p class="muted small">Прогресс сохраняется в этом браузере на этом устройстве.</p>
            <button class="mi danger" role="menuitem" onClick=${()=>{setMenu(false);setAsk("train");}}>Сбросить тренировочный прогресс</button>
            <button class="mi danger" role="menuitem" onClick=${()=>{setMenu(false);setAsk("hist");}}>Удалить историю итоговых тестов</button>
          </div>`:null}
        </div>
      </div>
      ${tab!==7?html`<${Schema} state=${state}/>`:null}
    </header>
    <nav class="tabs" ref=${tabsRef} role="tablist" aria-label="Уровни" onKeyDown=${onTabKey}>
      ${LEVELS.map(l=>html`<button key=${l.n} id=${"cvt-tab-"+l.n} role="tab" aria-selected=${tab===l.n} aria-controls="cvt-panel" tabIndex=${tab===l.n?0:-1} class=${"tab"+(l.n===7?" tab-final":"")} onClick=${()=>setTab(l.n)}>
        <span class="tn">${l.n}</span><span class="tt">${l.title}</span>
        ${l.n<7?html`<span class="tp" aria-hidden="true"><i style=${{width:(state.levels[l.n].learned.length/TOTAL*100)+"%"}}></i></span>`:null}
      </button>`)}
    </nav>
    <main id="cvt-panel" role="tabpanel" aria-labelledby=${"cvt-tab-"+tab}>
      ${tab===1?html`<${Match} ...${props}/>`:null}
      ${tab===2?html`<${Choice} ...${props}/>`:null}
      ${tab===3?html`<${Cards} ...${props}/>`:null}
      ${tab===4?html`<${TypeLevel} key="l4" lv=${4} mode="cloze" ...${props}/>`:null}
      ${tab===5?html`<${TypeLevel} key="l5" lv=${5} mode="reverse" ...${props}/>`:null}
      ${tab===6?html`<${TrueFalse} ...${props}/>`:null}
      ${tab===7?html`<${Final} ...${props}/>`:null}
    </main>
    ${ask?html`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="cvt-rs-h" onClick=${e=>{ if(e.target===e.currentTarget) setAsk(null); }}><div class="modal-box">
      <h2 id="cvt-rs-h">${ask==="train"?"Сбросить тренировочный прогресс?":"Удалить историю итоговых тестов?"}</h2>
      <p>${ask==="train"?"Статистика по словам и прогресс всех шести уровней будут удалены. История итоговых тестов сохранится.":"Все результаты итоговых тестов будут удалены. Тренировочный прогресс сохранится."}</p>
      <div class="row2"><button class="btn btn-bad" onClick=${()=>{ask==="train"?resetTraining():resetHistory();setAsk(null);}}>${ask==="train"?"Сбросить прогресс":"Удалить историю"}</button><button class="btn btn-ghost" onClick=${()=>setAsk(null)}>Отмена</button></div>
    </div></div>`:null}
  </div>`;
}

const rootEl=document.getElementById("cvt-root");
if(ReactDOM.createRoot) ReactDOM.createRoot(rootEl).render(html`<${App}/>`);
else ReactDOM.render(html`<${App}/>`,rootEl);
}
})();
</script>
