<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Learning DNA — преподаватель английского</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  --bg:#ECEEE8;--surface:#FFFFFF;--surface2:#F4F5F1;--ink:#151613;--muted:#686B64;--line:#E1E3DC;
  --dark:#171816;--on-dark:#F3F4EF;--on-dark-muted:#B8BBB2;
  --lime:#E2F36A;--lav:#BCB1EA;--orange:#EE6B32;--sage:#CEDCC9;--yellow:#F4EF6C;--peach:#F7CEA8;--on-acc:#151613;
  --ok:#3B8B4F;--warn:#C9761A;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E0F0D;--surface:#191A18;--surface2:#222420;--ink:#EEF0EA;--muted:#A3A69E;--line:#2E302B;
  --dark:#050605;--on-dark:#F3F4EF;--ok:#79C48B;--warn:#E8A65A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E0F0D;--surface:#191A18;--surface2:#222420;--ink:#EEF0EA;--muted:#A3A69E;--line:#2E302B;--dark:#050605;--on-dark:#F3F4EF;--ok:#79C48B;--warn:#E8A65A;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit}
img{max-width:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:8px}
.shell{max-width:1240px;margin:0 auto;padding:14px}
h1,h2,h3{line-height:1.08;letter-spacing:-.02em;margin:0;font-weight:600}
h1{font-size:clamp(36px,5.4vw,64px)}
h2{font-size:clamp(28px,3.6vw,44px)}
h3{font-size:clamp(20px,2vw,24px)}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:12.5px}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--dark);color:var(--on-dark);border-radius:24px;padding:10px 10px 10px 14px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;color:inherit;text-decoration:none;white-space:nowrap;font-size:15px}
.logo-mark{width:36px;height:36px;border-radius:50%;background:var(--lime);color:var(--on-acc);display:grid;place-items:center}
.nav-links{display:flex;gap:2px;margin-left:12px;flex:1}
.nav-links a{color:var(--on-dark-muted);text-decoration:none;font-size:14px;padding:8px 12px;border-radius:999px;position:relative;white-space:nowrap}
.nav-links a:hover{color:#fff}
.nav-links a.on{color:var(--lime)}
.nav-links a.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-10px;height:2px;background:var(--lime)}
.nav-right{display:flex;gap:8px;align-items:center;margin-left:auto}
.burger{display:none;width:40px;height:40px;border-radius:50%;border:1px solid #3a3c37;background:transparent;color:var(--on-dark);cursor:pointer;place-items:center}
@media(max-width:960px){
  .nav-links{display:none;position:absolute;top:calc(100% + 8px);left:0;right:0;flex-direction:column;background:var(--dark);border-radius:22px;padding:10px;margin:0}
  .nav-links.open{display:flex}.nav-links a{padding:12px 14px;font-size:16px}
  .nav-links a.on::after{display:none}.burger{display:grid}
}
@media(max-width:520px){.nav .btn-lime{display:none}}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:10px;border-radius:999px;padding:12px 20px;font-weight:600;font-size:15px;border:1px solid transparent;cursor:pointer;text-decoration:none;line-height:1.2;transition:transform .15s ease,background .15s ease}
.btn:active{transform:scale(.98)}
.btn-dark{background:var(--dark);color:var(--on-dark)}
.btn-lime{background:var(--lime);color:var(--on-acc)}
.btn-white{background:#fff;color:#151613}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{background:var(--surface2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;margin-right:-10px}
.btn-dark .ic{background:var(--lime);color:var(--on-acc)}
.btn-lime .ic,.btn-white .ic{background:var(--dark);color:var(--on-dark)}
.arrow{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;flex:none;border:0;cursor:pointer;background:var(--dark);color:var(--on-dark)}
.arrow.light{background:#fff;color:#151613}
.arrow.lime{background:var(--lime);color:var(--on-acc)}
.arrow svg,.btn svg{width:20px;height:20px}
.tag{display:inline-flex;align-items:center;gap:6px;border:1px solid currentColor;border-radius:8px;padding:2px 9px;font-size:12.5px;font-weight:500;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:7px 14px;font-size:13.5px;background:var(--surface2);border:1px solid var(--line);cursor:pointer;color:var(--ink)}
.chip.on{background:var(--dark);color:var(--on-dark);border-color:var(--dark)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}

/* surfaces */
.sec{margin-top:14px;background:var(--surface);border-radius:34px;padding:clamp(22px,4vw,52px)}
.card{border-radius:28px;padding:clamp(20px,2.6vw,30px);position:relative}
.bg-lime{background:var(--lime);color:var(--on-acc)}
.bg-lav{background:var(--lav);color:var(--on-acc)}
.bg-orange{background:var(--orange);color:#fff}
.bg-sage{background:var(--sage);color:var(--on-acc)}
.bg-yellow{background:var(--yellow);color:var(--on-acc)}
.bg-peach{background:var(--peach);color:var(--on-acc)}
.bg-dark{background:var(--dark);color:var(--on-dark)}
.bg-soft{background:var(--surface2);color:var(--ink)}
.bg-lime .muted,.bg-lav .muted,.bg-sage .muted,.bg-yellow .muted,.bg-peach .muted{color:#4b4e47}
.bg-dark .muted{color:var(--on-dark-muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:900px){.grid3,.grid4{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:26px;flex-wrap:wrap}
.head p{max-width:380px}
.stack>*+*{margin-top:12px}
.row-flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ph{display:inline-block;border:1.5px dashed currentColor;border-radius:10px;padding:1px 8px;opacity:.75;font-size:.92em}
.demo-badge{display:inline-flex;align-items:center;gap:6px;background:var(--yellow);color:var(--on-acc);border-radius:8px;padding:2px 9px;font-size:12.5px;font-weight:600}

/* hero */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:14px;margin-top:14px}
.hero-l{border-radius:34px;padding:clamp(26px,4vw,54px);display:flex;flex-direction:column;justify-content:space-between;gap:30px;min-height:520px}
.hero-l h1 .inl{display:inline-grid;place-items:center;width:.9em;height:.62em;border:2px solid currentColor;border-radius:999px;vertical-align:.08em;margin:0 .06em}
.hero-l h1 .inl svg{width:.38em;height:.38em}
.photo{border-radius:34px;min-height:520px;position:relative;overflow:hidden;background:radial-gradient(120% 90% at 70% 10%,#FBE3C9 0%,#F2B88E 45%,#D88762 100%);color:#151613}
.photo .who{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.photo .face{width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.35);display:grid;place-items:center;font-size:56px;font-weight:700;border:2px dashed rgba(21,22,19,.35)}
.float{position:absolute;background:#fff;color:#151613;border-radius:18px;padding:10px 14px;font-size:13.5px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(60,30,10,.12)}
.float .mini{width:38px;height:38px;border-radius:12px;background:var(--dark);color:var(--lime);display:grid;place-items:center}
.pin{position:absolute;border:1px solid #151613;border-radius:999px;padding:3px 10px 3px 6px;font-size:12.5px;display:flex;gap:6px;align-items:center;background:rgba(255,255,255,.45);backdrop-filter:blur(4px)}
.pin i{width:12px;height:12px;border-radius:50%;background:var(--lime);border:1px solid #151613}
@media(max-width:860px){.hero{grid-template-columns:1fr}.hero-l,.photo{min-height:auto}.photo{height:420px}}

/* path cards */
.path{min-height:260px;display:flex;flex-direction:column;justify-content:space-between;gap:24px;cursor:pointer;text-decoration:none;transition:transform .2s ease}
.path:hover{transform:translateY(-3px)}
.path h3{font-size:clamp(26px,3vw,38px)}

/* strip */
.strip{display:grid;grid-template-columns:1fr 1fr auto 1fr;gap:10px;margin-top:14px}
.strip>div{height:clamp(84px,11vw,130px);border-radius:999px;display:grid;place-items:center;font-size:clamp(22px,3.4vw,44px);font-weight:500;letter-spacing:-.02em;padding:0 24px}
.strip .ar{aspect-ratio:1.5/1;padding:0}
.strip .ar svg{width:46%;height:46%}
@media(max-width:640px){.strip{grid-template-columns:1fr 1fr}.strip .ar{display:none}}

/* mosaic */
.mosaic{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.vcard{border-radius:28px;overflow:hidden;display:flex;flex-direction:column;min-height:330px;cursor:pointer;border:0;text-align:left;padding:0}
.vcard .top{padding:22px 22px 18px;display:flex;flex-direction:column;gap:14px}
.vcard .top h3{font-size:21px;line-height:1.18}
.vcard .thumb{flex:1;min-height:150px;position:relative;display:flex;align-items:flex-end;justify-content:space-between;padding:16px 16px 16px 22px;color:#fff;background:linear-gradient(135deg,#2a2b28,#4b4c47)}
.vcard .thumb .play{position:absolute;inset:0;display:grid;place-items:center;opacity:.9}
.vcard .thumb .play span{width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;backdrop-filter:blur(4px)}
@media(max-width:900px){.mosaic{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.mosaic{grid-template-columns:1fr}}

/* rows table */
.rows .row{display:grid;grid-template-columns:1.3fr 1.3fr .9fr 52px;align-items:center;gap:14px;padding:18px 0;border-bottom:1px solid var(--line);text-decoration:none;cursor:pointer}
.rows .row:first-child{border-top:1px solid var(--line)}
.rows .row .t{font-size:clamp(18px,2vw,24px);font-weight:500}
.rows .row .arrow{width:42px;height:42px;background:transparent;border:1px solid var(--line);color:var(--ink)}
.rows .row:hover .arrow{background:var(--lime);color:var(--on-acc);border-color:var(--lime)}
@media(max-width:700px){.rows .row{grid-template-columns:1fr 42px}.rows .row .hide-m{display:none}}

/* forms */
label.f{display:block}
label.f>span{display:block;font-size:13.5px;font-weight:500;margin-bottom:6px}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:16px;padding:13px 15px;font:inherit;font-size:15px}
textarea.inp{min-height:90px;resize:vertical}
.inp:focus{outline:2px solid var(--lime);outline-offset:0;border-color:transparent}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;margin-top:2px;accent-color:#151613;flex:none}
.err{color:var(--orange);font-size:13.5px;margin-top:6px}

/* test */
.test-wrap{max-width:780px;margin:0 auto}
.prog{height:8px;border-radius:999px;background:var(--surface2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--dark);border-radius:999px;transition:width .4s ease}
.qprompt{font-size:clamp(21px,2.6vw,28px);line-height:1.3;font-weight:500;letter-spacing:-.01em}
.opts{display:grid;gap:10px;margin-top:22px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:14px 16px;font-size:17px;cursor:pointer;transition:background .15s ease,border-color .15s ease}
.opt:hover{border-color:var(--ink)}
.opt b{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);font-size:14px;flex:none}
.opt.sel{background:var(--lime);border-color:var(--lime);color:var(--on-acc)}
.opt.sel b{background:var(--dark);color:var(--lime)}
.opt.locked{cursor:default}
.stages{display:flex;gap:6px;flex-wrap:wrap}
.stages span{font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.stages span.on{background:var(--dark);color:var(--on-dark)}
.stages span.done{background:var(--sage);color:var(--on-acc)}

/* dna */
.dna-wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}
@media(max-width:860px){.dna-wrap{grid-template-columns:1fr}}
.dna svg{width:100%;height:auto;display:block}
.dna .ring{fill:none;stroke:var(--line);stroke-width:1}
.dna .spoke{stroke:var(--line);stroke-width:1}
.dna .poly{fill:rgba(226,243,106,.55);stroke:#151613;stroke-width:2;transform-box:view-box;transform-origin:180px 168px;animation:grow 1.1s cubic-bezier(.2,.9,.25,1) both}
:root[data-theme="dark"] .dna .poly{stroke:var(--lime);fill:rgba(226,243,106,.28)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dna .poly{stroke:var(--lime);fill:rgba(226,243,106,.28)}}
.dna .prev{fill:none;stroke:var(--lav);stroke-width:2;stroke-dasharray:5 5}
.dna .pt{fill:var(--dark);stroke:var(--lime);stroke-width:2}
.dna .lbl{cursor:pointer}
.dna .lbl text{fill:var(--ink);font-size:12px;font-family:inherit}
.dna .lbl .sc{font-weight:700;font-size:13px}
.dna .lbl.on rect{fill:var(--lime)}
.dna .lbl.on text{fill:#151613}
.dna .lbl rect{fill:transparent}
@keyframes grow{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.dna .poly{animation:none}*{transition:none!important}}
.meter{height:8px;border-radius:999px;background:rgba(0,0,0,.08);overflow:hidden}
.meter i{display:block;height:100%;background:#151613;border-radius:999px}
.bg-dark .meter{background:rgba(255,255,255,.12)}.bg-dark .meter i{background:var(--lime)}
.bar-row{display:grid;grid-template-columns:150px 1fr 70px;gap:12px;align-items:center;font-size:14px;padding:6px 0}
@media(max-width:600px){.bar-row{grid-template-columns:100px 1fr 54px}}
.bar{height:26px;border-radius:8px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.bg-dark .kv{border-color:#33352f}

/* admin */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}
table.t th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr.clk{cursor:pointer}
table.t tr.clk:hover td{background:var(--surface2)}
.metric{border-radius:22px;padding:18px;background:var(--surface2)}
.metric .v{font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin:6px 0}
.formula{font-size:12.5px;color:var(--muted)}
.seg{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;font-weight:700;font-size:13px}
.seg-A{background:var(--orange);color:#fff}.seg-B{background:var(--lav);color:var(--on-acc)}.seg-C{background:var(--sage);color:var(--on-acc)}.seg-D{background:var(--yellow);color:var(--on-acc)}.seg-E{background:var(--dark);color:var(--lime)}

/* modal / toast */
#modal{position:fixed;inset:0;z-index:100;display:none;background:rgba(10,11,9,.55);padding:16px;overflow:auto}
#modal.open{display:grid;place-items:center}
#modal .box{background:var(--surface);color:var(--ink);border-radius:30px;padding:clamp(20px,3vw,34px);max-width:680px;width:100%;position:relative;margin:auto}
#modal .x{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(120px);background:var(--dark);color:var(--on-dark);padding:12px 20px;border-radius:999px;z-index:110;transition:transform .3s ease;font-size:14.5px;max-width:92vw}
#toast.show{transform:translateX(-50%) translateY(0)}
footer.foot{margin-top:14px;background:var(--surface);border-radius:34px;padding:clamp(22px,4vw,44px)}
.foot-bottom{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:20px;margin-top:30px}
.note{border-left:3px solid var(--lime);padding:6px 0 6px 14px;font-size:14px;color:var(--muted)}
details summary{cursor:pointer;font-weight:600}
.timeline>div{border-left:2px solid var(--line);padding:0 0 14px 16px;position:relative;font-size:14px}
.timeline>div::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--lime);border:1px solid #151613}
</style>
</head>
<body>
<div class="shell">
  <header class="nav">
    <a class="logo" href="#home" aria-label="На главную">
      <span class="logo-mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7 3c0 6 10 6 10 12s-10 3-10 6M17 3c0 6-10 6-10 12s10 3 10 6"/><path d="M8.5 7h7M8.5 17h7"/></svg></span>
      <span id="brandName">English DNA</span>
    </a>
    <nav class="nav-links" id="navLinks">
      <a href="#home" data-r="home">Главная</a>
      <a href="#about" data-r="about">Обо мне</a>
      <a href="#lessons" data-r="lessons">Как проходят занятия</a>
      <a href="#videos" data-r="videos">Видео</a>
      <a href="#dna" data-r="dna">English Learning DNA</a>
      <a href="#cabinet" data-r="cabinet">Мой кабинет</a>
    </nav>
    <div class="nav-right">
      <a class="btn btn-lime" href="#individual">Записаться</a>
      <button class="burger" data-act="burger" aria-label="Меню"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
  </header>
  <main id="app"></main>
  <footer class="foot" id="foot"></footer>
</div>
<div id="modal" role="dialog" aria-modal="true"></div>
<div id="toast" role="status"></div>

<script>
'use strict';
/* ================= utils & storage ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S=(k,d)=>{try{const v=localStorage.getItem('eldna_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const W=(k,v)=>{try{localStorage.setItem('eldna_'+k,JSON.stringify(v))}catch(e){}};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmtDate=t=>new Date(t).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
const fmtDT=t=>new Date(t).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});

const QB=Object.fromEntries(BANK.map(x=>[x.id,x]));

/* ================= Adaptive Testing Engine (rule-based MVP) ================= */
const PLAN=[];
[['V','vk'],['G','ga'],['C','cc'],['V','lu'],['G','gr'],['C','cc'],['G','ga'],['V','vk']].forEach(([c,s])=>PLAN.push({stage:'calib',comp:c,sub:s}));
for(let i=0;i<10;i++)PLAN.push({stage:'vocab',comp:'V',sub:i%2?'lu':'vk'});
for(let i=0;i<10;i++)PLAN.push({stage:'gram',comp:'G',sub:i%2?'gr':'ga'});
for(let i=0;i<10;i++)PLAN.push({stage:'ctx',comp:'C',sub:'cc'});
for(let i=0;i<4;i++)PLAN.push({stage:'control',comp:null,sub:null});
const STAGEN={calib:'Разминка',vocab:'Лексика',gram:'Грамматика',ctx:'Контекст',control:'Финальные вопросы'};
const TOTAL=PLAN.length; // 42

function newSession(){return {id:'s'+Date.now().toString(36),started:Date.now(),idx:0,answers:[],cal:{lvl:1,st:0,er:0},lv:{},current:null,log:[],version:'demo-0.1',qStart:Date.now()}}
function rand(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function targetFor(s){
  const slot=PLAN[s.idx];
  if(slot.stage==='calib')return {lvl:s.cal.lvl,sub:slot.sub,comp:slot.comp,why:'калибровка'};
  if(slot.stage==='control'){
    const e=estimate(s.answers);const lo=clamp(Math.floor(e.a),1,4);const k=s.idx-(TOTAL-4);
    const lvl=k%2===0?lo+1:lo;
    const counts=AX.map(x=>({k:x.k,n:s.answers.filter(a=>a.sub===x.k).length,r:Math.random()})).sort((a,b)=>a.n-b.n||a.r-b.r);
    const sub=counts[0].k;
    return {lvl,sub,comp:AXK[sub].comp,why:`граница ${LV[lo]}/${LV[lo+1]}, ось с наименьшим числом ответов`};
  }
  if(s.lv[slot.comp]==null)s.lv[slot.comp]={lvl:s.cal.lvl,st:0,er:0};
  return {lvl:s.lv[slot.comp].lvl,sub:slot.sub,comp:slot.comp,why:'адаптивный этап'};
}
function pickItem(s,t){
  const used=new Set(s.answers.map(a=>a.qid));const seen=new Set(S('seen',[]));
  let pool=BANK.filter(x=>!used.has(x.id)&&x.sub===t.sub);
  if(!pool.length)pool=BANK.filter(x=>!used.has(x.id)&&x.comp===t.comp);
  if(!pool.length)pool=BANK.filter(x=>!used.has(x.id));
  const lastTopic=s.answers.length?s.answers[s.answers.length-1].topic:null;
  const scored=pool.map(x=>({x,d:Math.abs(x.lvl-t.lvl)*10+(seen.has(x.id)?3:0)+(x.topic===lastTopic?1:0)+Math.random()}));
  scored.sort((a,b)=>a.d-b.d);
  return scored[0].x;
}
function nextQuestion(s){
  if(s.current)return s.current;
  const t=targetFor(s);const it=pickItem(s,t);
  s.current={qid:it.id,order:shuffle(it.opts),target:t.lvl,why:t.why,fallback:it.lvl!==t.lvl};
  s.qStart=Date.now();
  return s.current;
}
function adapt(o,correct,isCal){
  if(correct){
    if(isCal&&o.lvl<=2){const up=o.lvl<5;if(up)o.lvl++;o.st=0;o.er=0;return 'верно на базовом уровне → сложность выше'}
    o.st++;
    if(o.st>=2){const r=o.lvl<5?'2 верных подряд → сложность выше':'2 верных подряд на максимальном уровне';if(o.lvl<5)o.lvl++;o.st=0;o.er=0;return r}
    return 'верно, накапливаем подтверждение';
  }
  o.st=0;o.er++;
  if(o.er>=2){const r=o.lvl>1?'2 ошибки на уровне → уточняющие вопросы уровнем ниже':'2 ошибки на минимальном уровне';if(o.lvl>1)o.lvl--;o.er=0;return r}
  return 'ошибка: уровень сохраняется, нужно ещё подтверждение';
}
function submitAnswer(s,chosen){
  const c=s.current;const it=QB[c.qid];const slot=PLAN[s.idx];const correct=chosen===it.ans;
  let before=null,after=null,reason='';
  if(slot.stage==='calib'){before=s.cal.lvl;reason=adapt(s.cal,correct,true);after=s.cal.lvl}
  else if(slot.stage!=='control'){const o=s.lv[it.comp]||(s.lv[it.comp]={lvl:s.cal.lvl,st:0,er:0});before=o.lvl;reason=adapt(o,correct,false);after=o.lvl}
  else reason='контрольный вопрос: уровень не меняется, уточняется оценка';
  s.answers.push({qid:it.id,comp:it.comp,sub:it.sub,lvl:it.lvl,topic:it.topic,correct,chosen,order:c.order,stage:slot.stage,ms:Date.now()-(s.qStart||Date.now())});
  s.log.push({i:s.idx+1,stage:slot.stage,qid:it.id,sub:it.sub,target:c.target,lvl:it.lvl,fallback:c.fallback,correct,before,after,reason:(c.fallback?'нужного уровня не осталось → ближайший; ':'')+reason});
  s.idx++;s.current=null;
  return s.idx>=TOTAL;
}

/* ================= Estimation ================= */
function estimate(list){
  if(!list.length)return {a:1,ps:{},by:{},n:0};
  const by={};list.forEach(a=>{const b=by[a.lvl]||(by[a.lvl]={n:0,c:0});b.n++;if(a.correct)b.c++});
  const t=Object.keys(by).map(Number).sort((x,y)=>x-y);const lo=t[0],hi=t[t.length-1];
  const raw={};t.forEach(L=>{const r=(by[L].c+0.5)/(by[L].n+1);raw[L]=Math.max(0,(r-0.25)/0.75)}); // поправка на угадывание (4 варианта)
  const ps={};
  for(let L=1;L<=5;L++){
    if(raw[L]!=null)ps[L]=raw[L];else if(L<lo)ps[L]=1;else if(L>hi)ps[L]=0;
    else{let b=L-1;while(raw[b]==null)b--;let u=L+1;while(raw[u]==null)u++;ps[L]=raw[b]+(raw[u]-raw[b])*(L-b)/(u-b)}
  }
  for(let L=4;L>=1;L--){if(by[L+1]&&by[L+1].n>=3)ps[L]=Math.max(ps[L],ps[L+1])}
  let sum=0;for(let L=1;L<=5;L++)sum+=ps[L];
  return {a:clamp(0.5+sum,0.5,5.49),ps,by,n:list.length};
}
const scoreOf=a=>Math.round((a-0.5)/5*100);
function axConf(n){return n<3?'none':n<4?'low':n<6?'mid':'high'}
const CONFN={none:'Недостаточно данных',low:'Низкая уверенность',mid:'Средняя уверенность',high:'Высокая уверенность'};

function buildReport(r){
  const all=estimate(r.answers);
  const lvl=clamp(Math.round(all.a),1,5);const f=all.a-lvl;
  const sub=lvl===5?'C1':LV[lvl]+(f<0?'.1':'.2');
  let range=null;
  if(f>=0.3&&lvl<5)range=[lvl,lvl+1];else if(f<=-0.3&&lvl>1)range=[lvl-1,lvl];
  const label=range?LV[range[0]]+'–'+LV[range[1]]:LV[lvl];
  // overall confidence
  let incons=false;const by=all.by;
  for(let L=1;L<=5;L++)for(let M=L+1;M<=5;M++){if(by[L]&&by[M]&&by[L].n>=3&&by[M].n>=3&&(by[L].c/by[L].n)+0.25<(by[M].c/by[M].n))incons=true}
  const near=r.answers.filter(a=>Math.abs(a.lvl-lvl)<=1).length;
  const conf=incons?'low':(near>=15&&Math.abs(f)<0.3?'high':'mid');
  const axes=AX.map(x=>{const l=r.answers.filter(a=>a.sub===x.k);const e=l.length>=3?estimate(l):null;return Object.assign({},x,{n:l.length,c:l.filter(a=>a.correct).length,score:e?scoreOf(e.a):null,a:e?e.a:null,conf:axConf(l.length),lvls:[...new Set(l.map(a=>a.lvl))].sort().map(v=>LV[v]).join(', ')})});
  const overall=scoreOf(all.a);
  const known=axes.filter(x=>x.score!=null);
  let strengths=known.filter(x=>x.score>=overall-3).sort((a,b)=>b.score-a.score).slice(0,3);
  if(!strengths.length&&known.length)strengths=[known.slice().sort((a,b)=>b.score-a.score)[0]];
  const weakAx=known.filter(x=>x.score<overall-4).sort((a,b)=>a.score-b.score).slice(0,2);
  // error topics: priority to errors on items at/below estimated level
  const errs={};r.answers.filter(a=>!a.correct).forEach(a=>{const e=errs[a.topic]||(errs[a.topic]={n:0,below:0});e.n++;if(a.lvl<=lvl)e.below++});
  const errTopics=Object.keys(errs).sort((a,b)=>(errs[b].below-errs[a].below)||(errs[b].n-errs[a].n)).filter(t=>errs[t].below>0||errs[t].n>=2).slice(0,3);
  const confident=[],partial=[];for(let L=1;L<=5;L++){if(all.by[L]){const p=all.by[L].c/all.by[L].n;if(p>=0.6&&all.by[L].n>=2)confident.push(L);else if(p>=0.3)partial.push(L)}}
  // commentary strictly from data
  let comment='';
  if(known.length>=2){
    const s=known.slice().sort((a,b)=>b.score-a.score);
    if(s[0].score-s[s.length-1].score<8)comment='Результаты по направлениям довольно ровные: заметного перекоса между лексикой, грамматикой и пониманием контекста не видно.';
    else comment=`Увереннее всего ты справился(-ась) с заданиями на ${s[0].ru.toLowerCase()}. Сложнее оказались задания на ${s[s.length-1].ru.toLowerCase()}.`;
  }
  if(errTopics.length)comment+=` Ошибки встречались в темах: ${errTopics.map(t=>TOP[t].n.toLowerCase()).join(', ')}. Возможно, полезно уделить им больше внимания.`;
  const gA=axes.find(x=>x.k==='ga'),vA=axes.find(x=>x.k==='lu');
  if(gA.score!=null&&vA.score!=null&&gA.score-vA.score>=15)comment+=' Грамматика у тебя заметно сильнее, чем употребление лексики в контексте, — это частый и хорошо поправимый перекос.';
  const lvlText=confident.length?`Результаты указывают на уверенное выполнение большинства заданий ${confident.map(l=>LV[l]).join(', ')}`+(partial.filter(l=>l>Math.max(...confident)).length?` и отдельных заданий ${partial.filter(l=>l>Math.max(...confident)).map(l=>LV[l]).join(', ')}.`:'.'):'Заданий, выполненных уверенно, пока немного — оценка особенно предварительная.';
  return {all,lvl,sub,range,label,conf,axes,overall,strengths,weakAx,errTopics,errs,lvlText,comment,speakout:SPEAK[sub]};
}

/* ================= simulation (to preview mechanics fast) ================= */
const SIMS=[
 {id:'a2',n:'Профиль A2',ab:{vk:1.7,lu:1.6,ga:1.8,gr:1.6,cc:1.8}},
 {id:'b1',n:'Профиль B1',ab:{vk:2.9,lu:2.8,ga:2.9,gr:2.8,cc:2.8}},
 {id:'mix',n:'B1–B2: грамматика сильнее лексики',ab:{vk:3.1,lu:2.5,ga:4.2,gr:3.9,cc:3.4}},
 {id:'c1',n:'Профиль C1',ab:{vk:5,lu:4.9,ga:5,gr:4.9,cc:5}}];
function runSim(id){
  const p=SIMS.find(x=>x.id===id);const s=newSession();
  while(s.idx<TOTAL){const c=nextQuestion(s);const it=QB[c.qid];const ab=p.ab[it.sub];
    const pr=0.25+0.75/(1+Math.exp(-2.2*(ab-it.lvl+0.6)));
    const chosen=Math.random()<pr?it.ans:rand(it.opts.filter(o=>o!==it.ans));
    s.qStart=Date.now()-(9000+Math.random()*16000);submitAnswer(s,chosen)}
  return finishSession(s,true);
}
function finishSession(s,sim){
  const res={id:s.id,date:Date.now(),started:s.started,answers:s.answers.map(a=>({qid:a.qid,comp:a.comp,sub:a.sub,lvl:a.lvl,topic:a.topic,correct:a.correct,stage:a.stage,ms:a.ms})),log:s.log,version:s.version,sim:!!sim};
  const list=S('results',[]);list.push(res);W('results',list.slice(-12));
  W('seen',[...new Set(S('seen',[]).concat(res.answers.map(a=>a.qid)))].slice(-120));
  W('session',null);
  const rep=buildReport(res);
  track('diagnostic_completed',{level:rep.label,sim:!!sim,minutes:Math.round(res.answers.reduce((m,a)=>m+a.ms,0)/60000)});
  return res;
}

/* ================= segmentation (rules over explicit actions) ================= */
function computeSegment(events,leads){
  const ev=events||S('events',[]);const ld=leads||S('leads',[]);
  const ind=ld.find(l=>l.type==='individual');const grp=ld.find(l=>l.type==='group'||l.type==='waitlist');
  const firstEngage=ev.find(e=>e.name==='diagnostic_completed'||e.name==='video_opened');
  const firstLead=ld.slice().sort((a,b)=>a.created-b.created)[0];
  if(firstLead&&firstEngage&&firstEngage.visit!==firstLead.visit&&firstEngage.t<firstLead.created)return {k:'E',why:'Раньше проходил(а) тест или смотрел(а) материалы, а затем сам(а) вернулся(-ась) и оставил(а) заявку.'};
  if(ind)return {k:'A',why:'Выбрал(а) индивидуальные занятия, видел(а) условия и оставил(а) заявку.'};
  if(grp)return {k:'B',why:'Выбрал(а) групповой формат и указал(а) цель и расписание.'};
  const sel=ev.filter(e=>e.name==='learning_option_selected').pop();
  if(S('consent',null)&&S('consent',{}).marketing)return {k:'D',why:'Подписался(-ась) на материалы, платный формат не выбран.'};
  if(sel&&(sel.option==='self'||sel.option==='browse'))return {k:'C',why:'Прошёл(а) диагностику и выбрал(а) самостоятельное обучение.'};
  if(ev.some(e=>e.name==='diagnostic_completed'))return {k:'C',why:'Прошёл(а) диагностику, намерения покупать занятия не выражено.'};
  return {k:'—',why:'Пока нет действий для сегментации.'};
}

function vcard(v,i){

function pentagon(rep,prevRep,active){
  const cx=180,cy=168,R=112;const pts=[];
  const ang=i=>(-90+i*72)*Math.PI/180;
  const P=(i,v)=>[cx+R*v/100*Math.cos(ang(i)),cy+R*v/100*Math.sin(ang(i))];
  let rings='';[20,40,60,80,100].forEach(v=>{rings+=`<polygon class="ring" points="${AX.map((_,i)=>P(i,v).join(',')).join(' ')}"/>`});
  let spokes=AX.map((_,i)=>{const p=P(i,100);return `<line class="spoke" x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}"/>`}).join('');
  const poly=rep.axes.map((x,i)=>P(i,x.score==null?0:x.score).join(',')).join(' ');
  let prev='';if(prevRep)prev=`<polygon class="prev" points="${prevRep.axes.map((x,i)=>P(i,x.score==null?0:x.score).join(',')).join(' ')}"/>`;
  const dots=rep.axes.map((x,i)=>{if(x.score==null){const p=P(i,6);return `<text x="${p[0]}" y="${p[1]+4}" text-anchor="middle" style="fill:var(--orange);font-weight:700">?</text>`}const p=P(i,x.score);return `<circle class="pt" cx="${p[0]}" cy="${p[1]}" r="5"/>`}).join('');
  const lbls=rep.axes.map((x,i)=>{const p=P(i,128);const anchor=Math.abs(p[0]-cx)<10?'middle':(p[0]>cx?'start':'end');
    const dy=i===0?-26:(i===2||i===3?6:-8);const w=118;const rx=anchor==='middle'?p[0]-w/2:(anchor==='start'?p[0]-6:p[0]-w+6);
    return `<g class="lbl${active===x.k?' on':''}" data-act="axis" data-k="${x.k}" tabindex="0" role="button" aria-label="${x.en}">
      <rect x="${rx}" y="${p[1]+dy-14}" width="${w}" height="50" rx="12"/>
      <text x="${p[0]}" y="${p[1]+dy}" text-anchor="${anchor}">${x.l1}</text>
      <text x="${p[0]}" y="${p[1]+dy+14}" text-anchor="${anchor}">${x.l2}</text>
      <text class="sc" x="${p[0]}" y="${p[1]+dy+30}" text-anchor="${anchor}">${x.score==null?'нет данных':x.score+' / 100'}</text></g>`}).join('');
  return `<svg viewBox="-30 -20 420 380" role="img" aria-label="Пентагон English Learning DNA">${rings}${spokes}${prev}<polygon class="poly" points="${poly}"/>${dots}${lbls}</svg>`;
}

    <div class="opts" role="radiogroup">${order.map((o,i)=>`<button class="opt ${chosen===o?'sel':''} ${viewing?'locked':''}" role="radio" aria-checked="${chosen===o}" ${viewing?'disabled':''} data-act="pick" data-v="${esc(o)}"><b>${'ABCD'[i]}</b><span>${esc(o)}</span></button>`).join('')}</div>

    <div class="row-flex">
      <button class="btn btn-ghost" data-act="back" ${(viewing?reviewIdx===0:s.idx===0)?'disabled':''}>Назад</button>

let viewRes=null,activeAxis='vk',chosenPath=null,practiceAns={};
R.results=()=>{
  const list=S('results',[]);
  if(!list.length)return `<section class="sec" style="margin-top:14px"><h2>Результатов пока нет</h2><p class="muted" style="margin:12px 0 20px">Пройди диагностику — или смоделируй прохождение, чтобы посмотреть, как выглядит отчёт.</p><a class="btn btn-dark" href="#dna">К диагностике</a></section>`;
  const idx=viewRes==null?list.length-1:viewRes;const r=list[idx];const rep=buildReport(r);
  const prev=idx>0?buildReport(list[idx-1]):null;
  const ax=rep.axes.find(x=>x.k===activeAxis)||rep.axes[0];
  const st=SET();
  const recVideos=VIDEOS.filter(v=>v.tags.some(t=>rep.errTopics.includes(t)));
  const mins=Math.max(1,Math.round(r.answers.reduce((m,a)=>m+a.ms,0)/60000));
  return `
<section class="hero" style="grid-template-columns:1fr 1fr">
  <div class="hero-l bg-lime" style="min-height:380px">
    <div class="row-flex" style="justify-content:space-between"><span class="tag">${fmtDate(r.date)} · ${mins} мин</span>${r.sim?'<span class="demo-badge" style="background:#fff">Смоделированное прохождение</span>':''}</div>
    <div><h1 style="font-size:clamp(32px,4.2vw,52px)">Твой языковой профиль готов!</h1>
      <p style="margin-top:18px;font-size:20px">Предварительный уровень английского: <b style="font-size:1.3em">${rep.label}</b></p>
      <p class="muted" style="margin-top:8px">Внутренняя ступень: ${rep.sub} · ориентир по программе Speakout: ${rep.speakout}</p>
    </div>
    <div class="row-flex"><span class="tag">${CONFN[rep.conf]} в оценке</span><span class="tag">${r.answers.filter(a=>a.correct).length} из ${TOTAL} верно</span></div>
  </div>
  <div class="card bg-dark" style="display:flex;flex-direction:column;justify-content:space-between;gap:16px">
    <p style="font-size:17px">${rep.lvlText}${rep.range?' Ты находишься на границе двух уровней — поэтому показан диапазон.':''}</p>
    <p class="muted small">Для более точного определения уровня нужно проверить письменную и устную речь, а также понимание английского на слух. Это предварительный профиль, а не сертифицированная оценка.</p>
    <p class="muted tiny">В каждом задании четыре варианта ответа, поэтому случайное угадывание возможно примерно в 25% случаев — расчёт это учитывает.</p>
  </div>
</section>

<section class="sec">
  <div class="head"><h2>English Learning DNA</h2><p class="muted">Пять показателей по внутренней шкале диагностики (0–100) — это не «процент знания английского». Нажми на ось, чтобы увидеть подробности.${prev?' Пунктир — предыдущее прохождение.':''}</p></div>
  <div class="dna-wrap">
    <div class="dna card bg-soft" id="dnaBox">${pentagon(rep,prev,ax.k)}</div>
    <div class="card bg-dark">
      <span class="tag" style="color:var(--lime)">${ax.comp==='V'?'Подкомпетенция лексики':ax.comp==='G'?'Подкомпетенция грамматики':'Отдельная компетенция'}</span>
      <h3 style="margin-top:16px">${ax.en}</h3><p class="muted">${ax.ru}</p>
      <div style="margin:22px 0 8px;font-size:44px;font-weight:600;letter-spacing:-.02em">${ax.score==null?'—':ax.score}<span class="muted" style="font-size:18px"> / 100</span></div>
      ${ax.score!=null?`<div class="meter"><i style="width:${ax.score}%"></i></div>`:''}
      <div style="margin-top:16px">
        <div class="kv"><span>Заданий по оси</span><b>${ax.n}</b></div>
        <div class="kv"><span>Верных ответов</span><b>${ax.c}</b></div>
        <div class="kv"><span>Уровни заданий</span><b>${ax.lvls||'—'}</b></div>
        <div class="kv"><span>Уверенность</span><b>${CONFN[ax.conf]}</b></div>
        ${prev?`<div class="kv"><span>Прошлое прохождение</span><b>${(prev.axes.find(x=>x.k===ax.k).score??'—')}</b></div>`:''}
      </div>
      <p class="muted tiny" style="margin-top:12px">Vocabulary Knowledge и Lexical Usage — две стороны лексики, Grammar Accuracy и Grammar Range — две стороны грамматики. Это не пять независимых навыков.</p>
    </div>
  </div>
  ${prev?`<p class="note" style="margin-top:16px">Сравнение с прошлым прохождением предварительное: наборы заданий отличались и банк пока не откалиброван статистически, поэтому разница не равна реальному прогрессу.</p>`:''}
</section>

<section class="sec">
  <h2>Что показывает твой профиль</h2>
  <p style="margin-top:16px;font-size:18px;max-width:820px">${esc(rep.comment)}</p>
  <div class="grid2" style="margin-top:24px">
    <div class="card bg-sage"><h3>Сильные стороны</h3><div class="stack" style="margin-top:14px">${rep.strengths.map(x=>`<p>• ${STR[x.k]} <span class="muted small">(${x.en}: ${x.score})</span></p>`).join('')||'<p class="muted">Недостаточно данных для уверенного вывода.</p>'}</div></div>
    <div class="card bg-peach"><h3>Что можно улучшить</h3><div class="stack" style="margin-top:14px">${[...rep.weakAx.map(x=>`<p>• ${IMP[x.k]}</p>`),...rep.errTopics.slice(0,Math.max(0,3-rep.weakAx.length)).map(t=>`<p>• ${esc(TOP[t].n)}</p>`)].join('')||'<p>Явных провалов нет — следующий шаг: задания уровня выше.</p>'}</div></div>
  </div>
  <div class="card bg-soft" style="margin-top:14px"><h3>Твой следующий шаг</h3>
    <div class="stack" style="margin-top:14px">${rep.errTopics.map(t=>`<div class="kv" style="display:block"><b>${esc(TOP[t].n)}.</b> <span>${esc(TOP[t].s)}</span></div>`).join('')}
    <div class="kv" style="display:block"><b>Чтение на своём уровне.</b> Короткие тексты уровня ${LV[rep.lvl]} 3–4 раза в неделю: замечай связки и устойчивые сочетания.</div></div>
  </div>
</section>

${rep.errTopics.length?`<section class="sec">
  <div class="head"><h2>Разберём твои сложные темы</h2><p class="muted">Короткие объяснения по темам, где были ошибки. Мини-задания необязательные и не влияют на результат.</p></div>
  <div class="grid3">${rep.errTopics.map((t,i)=>{const T=TOP[t];const v=VIDEOS.find(v=>v.tags.includes(t));const pa=practiceAns[t];const ord=T.q.o.slice().sort();return `<div class="card ${['bg-lav','bg-yellow','bg-sage'][i%3]}" style="display:flex;flex-direction:column;gap:12px">
    <span class="tag">${esc(T.n)}</span><p>${esc(T.e)}</p><p class="small"><b>Пример:</b> ${esc(T.x)}</p>
    ${v?`<button class="btn btn-white" data-act="video" data-id="${v.id}" style="align-self:flex-start">${PLAY} Видео по теме</button>`:''}
    <div style="border-top:1px solid rgba(0,0,0,.15);padding-top:12px"><p class="small"><b>Попробуй:</b> ${esc(T.q.p)}</p>
      <div class="row-flex" style="margin-top:8px">${ord.map(o=>`<button class="chip ${pa===o?'on':''}" data-act="practice" data-t="${t}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>
      ${pa?`<p class="small" style="margin-top:10px"><b>${pa===T.q.o[0]?'Верно.':'Правильный вариант: '+esc(T.q.o[0])+'.'}</b> ${esc(T.q.w)}</p>`:''}</div>
  </div>`}).join('')}</div>
  ${recVideos.length?`<p class="small muted" style="margin-top:16px">Подобрано по тегам тем: ${recVideos.map(v=>esc(v.t)).join(' · ')}</p>`:''}
</section>`:''}

<section class="sec bg-dark" style="background:var(--dark);color:var(--on-dark)">
  <div class="grid2">
    <div><h2>Что ещё предстоит проверить</h2><p class="muted" style="margin-top:14px;max-width:460px;color:var(--on-dark-muted)">Онлайн-диагностика помогает предварительно оценить знание языка. Для полноценного учебного маршрута важно дополнительно проверить, как ты воспринимаешь английскую речь на слух, говоришь и самостоятельно строишь связные высказывания.</p>
    ${st.paidDiag?`<a class="btn btn-lime" href="#individual" style="margin-top:20px">Подробная диагностика с преподавателем</a>`:''}</div>
    <div>${['Speaking','Listening','Writing'].map(n=>`<div class="kv" style="font-size:20px;padding:18px 0"><span>${n}</span><span class="tag" style="color:var(--on-dark-muted)">не проверено</span></div>`).join('')}</div>
  </div>
</section>

<section class="sec" id="nextStep">
  <div class="head"><h2>Что ты хочешь делать дальше?</h2><p class="muted">Любой вариант — нормальный выбор. Отчёт уже твой, запись никуда не обязательна.</p></div>
  <div class="grid4">
    ${[['self','bg-sage','Учиться самостоятельно','Рекомендации, объяснения и упражнения для самостоятельного развития английского.'],['group','bg-lav','Заниматься в группе','Регулярно, но в более доступном формате. Посмотрим, какие группы подходят по уровню и цели.'],['individual','bg-dark','Заниматься индивидуально','Персональный подход и регулярная обратная связь: условия, стоимость и свободные места.'],['browse','bg-yellow','Пока просто изучаю','Не планируешь занятия? Можно получать полезные материалы и вернуться позже.']].map(([k,c,t,d])=>`<button class="card path ${c}" style="border:0;text-align:left;${chosenPath===k?'outline:3px solid var(--orange);outline-offset:3px':''}" data-act="path" data-p="${k}"><span class="arrow ${c==='bg-dark'?'lime':''}" style="align-self:flex-end">${ARW}</span><div><h3 style="font-size:24px">${t}</h3><p class="small muted" style="margin-top:8px">${d}</p></div></button>`).join('')}
  </div>
  <div id="pathPanel" style="margin-top:14px">${pathPanel(rep)}</div>
</section>

<section class="sec">
  <div class="row-flex" style="justify-content:space-between">
    <div><h3>Сохранить результат</h3><p class="muted small" style="margin-top:6px">Сейчас отчёт хранится в этом браузере. С аккаунтом (Google или email) он будет доступен на любом устройстве и привяжется к тебе безопасно.</p></div>
    <div class="row-flex"><button class="btn btn-ghost" data-act="saveacc">Создать аккаунт</button><a class="btn btn-ghost" href="#cabinet">История прохождений</a></div>
  </div>
  <details style="margin-top:22px"><summary>Журнал адаптивности: как подбирались вопросы</summary>
    <div class="scroll-x" style="margin-top:12px"><table class="t"><thead><tr><th>#</th><th>Этап</th><th>Ось</th><th>Целевой уровень</th><th>Уровень задания</th><th>Ответ</th><th>Решение алгоритма</th></tr></thead><tbody>
    ${r.log.map(l=>`<tr><td>${l.i}</td><td>${STAGEN[l.stage]}</td><td>${AXK[l.sub].en}</td><td>${LV[l.target]}</td><td>${LV[l.lvl]}</td><td>${l.correct?'<span style="color:var(--ok)">верно</span>':'<span style="color:var(--orange)">ошибка</span>'}</td><td class="small">${esc(l.reason)}${l.before!=null&&l.after!==l.before?` <b>(${LV[l.before]} → ${LV[l.after]})</b>`:''}</td></tr>`).join('')}
    </tbody></table></div>
    <p class="tiny muted" style="margin-top:10px">Эта таблица — для проверки логики MVP. В рабочей версии она видна только преподавателю.</p>
  </details>
</section>`};

function pathPanel(rep){
  if(!chosenPath)return '';
  if(chosenPath==='self')return `<div class="card bg-soft"><h3>Твой план самостоятельной практики</h3>
    <div class="stack" style="margin-top:14px">${(rep.errTopics.length?rep.errTopics:['colloc','connect']).map(t=>`<div class="kv" style="display:block"><b>${esc(TOP[t].n)}</b> — ${esc(TOP[t].s)}</div>`).join('')}</div>
    <div class="row-flex" style="margin-top:16px"><button class="btn btn-dark" data-act="savereport">Сохранить отчёт</button><a class="btn btn-ghost" href="#videos">Видео по темам</a></div></div>${subscribeBlock('self')}`;
  if(chosenPath==='browse')return `<div class="card bg-soft"><p>Хорошо! Результат сохранён в этом браузере — вернуться к нему можно в любой момент. Если хочешь, подпишись на материалы: это отдельное согласие и ни к чему не обязывает.</p></div>${subscribeBlock('browse')}`;
  return '';
}

function gResultsHtml(){
  if(!gMatches)return `<div class="card bg-soft" style="height:100%;display:grid;place-items:center;text-align:center"><p class="muted">Заполни параметры — здесь появятся группы с объяснением, почему они подходят.</p></div>`;
  const done=S('leads',[]).filter(l=>l.type==='group'||l.type==='waitlist').map(l=>l.groupId);
  return `<div class="stack">${gMatches.map(m=>{const s=gStatus(m.g);const did=done.includes(m.g.id);return `<div class="card bg-soft">

    <div class="card bg-lav"><b>Не нашлось подходящей?</b><p class="small" style="margin-top:6px">Оставь интерес — преподаватель увидит, когда наберётся группа с похожими целями и временем.</p><button class="btn btn-dark" style="margin-top:12px" data-act="gjoin" data-id="pool" data-w="1">Добавить в пул интереса</button></div></div>`;
}
function matchGroups(f){
  return GROUPS.map(g=>{let sc=0;const why=[];
    if(f.lvl>=g.lv[0]&&f.lvl<=g.lv[1]){sc+=35;why.push('уровень совпадает')}else if(f.lvl===g.lv[0]-1||f.lvl===g.lv[1]+1){sc+=15;why.push('соседний уровень')}
    if(g.goal===f.goal){sc+=25;why.push('та же цель')}
    const ov=g.slots.filter(x=>f.slots.includes(x));if(ov.length){sc+=20;why.push('время: '+ov.map(x=>SLOTS[x].toLowerCase()).join(', '))}
    if(Math.abs(g.int-f.int)===0){sc+=10;why.push('интенсивность')}else if(Math.abs(g.int-f.int)===1)sc+=5;
    if(!f.budget)sc+=5;else if(f.budget===g.budget||f.budget==='high'){sc+=10;why.push('бюджет')}
    return {g,score:sc,why}}).sort((a,b)=>b.score-a.score);
}

function admGrp(){
  const pool=POOL.map(p=>({lvl:p[0],goal:p[1],slots:p[2],start:p[3]}));
  S('leads',[]).filter(l=>l.type==='group'||l.type==='waitlist').forEach(l=>{if(l.form)pool.push(Object.assign({local:true},l.form))});
  const band=l=>l<=2?'A1–A2':l<=4?'B1–B2':'B2–C1';
  const cl={};pool.forEach(p=>{const k=band(p.lvl)+'|'+p.goal;(cl[k]=cl[k]||[]).push(p)});
  const out=Object.entries(cl).map(([k,arr])=>{const [b,g]=k.split('|');const sc={};arr.forEach(p=>p.slots.forEach(s=>sc[s]=(sc[s]||0)+1));const top=Object.entries(sc).sort((a,b)=>b[1]-a[1])[0];const soon=arr.filter(p=>p.start!=='later').length;return {b,g,n:arr.length,top,soon,local:arr.some(p=>p.local)}}).sort((a,b)=>b.n-a.n);
  return `<p class="muted small" style="margin-bottom:14px">Рекомендательный режим: система группирует заинтересованных по уровню, цели и времени. Приглашения не отправляются автоматически — решение за преподавателем. <span class="demo-badge">Пул — демо + заявки этого браузера</span></p>
  <div class="grid3">${out.map(o=>`<div class="card ${o.n>=4?'bg-lime':'bg-soft'}"><span class="tag">${o.n>=4?'Можно собирать':'Копим интерес'}</span><h3 style="margin-top:12px">Потенциальная группа: ${o.b}, ${GOALS[o.g].toLowerCase()}</h3><p class="small" style="margin-top:10px">${o.n} заинтересованных${o.local?' (включая вас)':''}<br>У ${o.top[1]} совпадает время: ${SLOTS[o.top[0]].toLowerCase()}<br>Готовы начать в ближайший месяц: ${o.soon}</p><button class="btn btn-ghost" style="margin-top:12px" data-act="toast" data-m="В рабочей версии откроется черновик приглашения — отправка только после вашего подтверждения.">Подготовить приглашение</button></div>`).join('')}</div>`;
}

function render(keep){
  const app=$('#app');const y=window.scrollY;
  app.innerHTML=(R[cur]||R.home)();
  document.querySelectorAll('#navLinks a').forEach(a=>a.classList.toggle('on',a.dataset.r===cur||(cur==='test'||cur==='results')&&a.dataset.r==='dna'));
  $('#foot').innerHTML=footer();
  const st=SET();$('#brandName').textContent=st.name||'English DNA';
  if(keep)window.scrollTo(0,y);
}
function route(){
  const h=(location.hash||'#home').slice(1);cur=R[h]?h:'home';
  $('#navLinks').classList.remove('open');
  if(cur!=='test')reviewIdx=null;
  render(false);window.scrollTo(0,0);
  track('page_view',{page:cur});
  if(cur==='individual')track('individual_lesson_viewed');
  if(cur==='groups')track('group_lesson_viewed');
  if(cur==='results'&&S('results',[]).length)track('report_viewed');
}
function go(r){if(location.hash==='#'+r)route();else location.hash=r}

    const g=GROUPS.find(x=>x.id===el.dataset.id);const wait=!!el.dataset.w;const res=S('results',[]);const at=S('attr',{});
    const ls=S('leads',[]);ls.push({id:'L'+Date.now().toString(36),type:wait?'waitlist':'group',groupId:el.dataset.id,groupName:g?g.name:'Пул интереса',name:n,contact:c,goal:GOALS[gForm.goal],time:gForm.slots.map(s=>SLOTS[s]).join(', '),form:gForm,resultId:res.length?res[res.length-1].id:null,status:'Новая',created:Date.now(),visit:VISIT,source:(at.last||{}).source||'Источник неизвестен'});W('leads',ls);
    track(wait?'group_waitlist_joined':'lead_created',{format:'group',group:el.dataset.id});closeModal();toast(wait?'Ты в листе ожидания':'Заявка в группу отправлена');$('#gResults').innerHTML=gResultsHtml()},
  gnotify:()=>{toast('Подпишись на новости о наборе — это отдельное согласие');go('home')},
  cabtab:el=>{cabTab=el.dataset.t;render(true)},
  export:()=>{const data={sid:SID,results:S('results',[]).map(r=>({date:new Date(r.date).toISOString(),level:buildReport(r).label,axes:buildReport(r).axes.map(x=>({axis:x.en,score:x.score}))})),leads:S('leads',[]),consent:S('consent',null),attribution:S('attr',null)};$('#exportBox').innerHTML=`<textarea class="inp" style="min-height:220px;font-size:12.5px">${esc(JSON.stringify(data,null,2))}</textarea>`},
  wipe:()=>{if(!confirm('Удалить все результаты, заявки и согласия из этого браузера?'))return;['results','leads','consent','session','events','seen','attr','sid','crm'].forEach(k=>{try{localStorage.removeItem('eldna_'+k)}catch(e){}});toast('Данные удалены');render(false)},
  'admin-in':()=>{admAuth=true;render(false)},
  'admin-out':()=>{admAuth=false;render(false)},
  admtab:el=>{admTab=el.dataset.t;render(true)},
  period:el=>{admPeriod=Number(el.dataset.p);render(true)},
  crmopen:el=>crmCard(el.dataset.id),
  crmsave:el=>{const id=el.dataset.id;const crm=S('crm',{});const rows=crmRows();const r=rows.find(x=>x.id===id);const o=crm[id]||{hist:r.hist||[]};
    const ns=$('#crmStatus').value,sg=$('#crmSeg').value,nt=$('#crmNote').value;o.hist=o.hist||[];
    if(ns!==r.status){o.hist.push({t:Date.now(),what:`Статус: ${r.status} → ${ns}`});track('lead_status_changed',{to:ns});if(ns==='Начал платное обучение')track('paid_student_confirmed')}
    if(sg!==r.seg)o.hist.push({t:Date.now(),what:`Сегмент вручную: ${r.seg} → ${sg}`});
    o.status=ns;o.seg=sg;o.notes=nt;crm[id]=o;W('crm',crm);
    const ls=S('leads',[]);const li=ls.findIndex(x=>x.id===id);if(li>=0){ls[li].status=ns;W('leads',ls)}
    closeModal();toast('Сохранено, изменение записано в историю');render(true)},
  csv:()=>{const rows=crmRows();const head=['name','source','cefr','goal','format','segment','status','consent'];const lines=[head.join(',')].concat(rows.map(r=>[r.name,r.source,r.cefr,r.goal,r.format,r.seg,r.status,r.consent?'yes':'no'].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')));$('#csvBox').innerHTML=`<textarea class="inp" style="margin-top:10px;min-height:160px;font-size:12.5px">${esc(lines.join('\n'))}</textarea><p class="tiny muted">Контакты исключены из экспорта по умолчанию.</p>`},
  qprev:el=>{const x=QB[el.dataset.id];modal(`<span class="tag">${LV[x.lvl]} · ${AXK[x.sub].en}</span><p class="qprompt" style="margin-top:14px">${esc(x.prompt)}</p><div class="opts">${x.opts.map((o,i)=>`<div class="opt locked ${i===0?'sel':''}"><b>${'ABCD'[i]}</b>${esc(o)}</div>`).join('')}</div><p class="small" style="margin-top:14px"><b>Объяснение:</b> ${esc(x.expl)}</p><p class="tiny muted" style="margin-top:8px">Тема: ${esc(TOP[x.topic].n)} · правильный вариант отмечен (в тесте варианты перемешиваются)</p>`)},
  qok:el=>{const qs=S('qstatus',{});qs[el.dataset.id]=qs[el.dataset.id]==='ok'?'':'ok';W('qstatus',qs);render(true)},
  utm:()=>{const p=new URLSearchParams();[['utm_source','uSrc'],['utm_medium','uMed'],['utm_campaign','uCamp'],['utm_content','uCont']].forEach(([k,id])=>{const v=$('#'+id).value.trim();if(v)p.set(k,v)});$('#utmOut').innerHTML=`<div class="card bg-lime" style="padding:16px;word-break:break-all"><b class="small">https://ваш-домен.ru/${$('#uPage').value}?${esc(p.toString())}</b><p class="tiny" style="margin-top:6px">Домен подключается позже. Параметры сохраняются как первая и последняя точка входа.</p></div>`},
  simsrc:el=>{const a=S('attr',{})||{};const now={source:el.dataset.s,referrer:'(симуляция)',at:Date.now(),visit:VISIT};if(!a.first||a.first.source==='Источник неизвестен')a.first=now;a.last=now;W('attr',a);toast('Источник визита: '+el.dataset.s);render(true)},
  savesettings:()=>{const st=SET();document.querySelectorAll('[data-k]').forEach(i=>{st[i.dataset.k]=i.type==='checkbox'?i.checked:i.value.trim()});W('settings',st);toast('Изменения сохранены и применены на сайте');render(true)},
  resetsettings:()=>{W('settings',{});toast('Вернули заглушки');render(true)},
  toast:el=>toast(el.dataset.m),
  policy:()=>modal(`<h3>Конфиденциальность</h3><p class="muted" style="margin-top:10px">В прототипе все данные хранятся только в вашем браузере. В рабочей версии: HTTPS, защищённая авторизация, разграничение ролей, отдельное согласие на рассылку, экспорт и удаление своих данных. Полный текст политики добавит преподаватель.</p>`)
};
// показать форму повторно после «Отправить ещё одну заявку»
const _ind=R.individual;R.individual=()=>{if(R.__forceForm){R.__forceForm=false;const ls=S('leads',[]);const tmp=ls.map(l=>l.type==='individual'?Object.assign({},l,{type:'individual_prev'}):l);W('leads',tmp);const html=_ind();W('leads',ls);return html}return _ind()};

if(typeof document!=='undefined'&&document.addEventListener){
  document.addEventListener('click',e=>{
    if(e.target.id==='modal'){closeModal();return}
    const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
    if(['crmsearch','qf','consent'].includes(a))return;
    if(ACT[a]){if(el.tagName==='A'&&!el.getAttribute('href').startsWith('#'))ACT[a](el,e);else if(el.tagName==='A'){ACT[a](el,e)}else{e.preventDefault();ACT[a](el,e)}}
  });
  document.addEventListener('change',e=>{const el=e.target;if(el.dataset.act==='consent')ACT.consent(el);if(el.dataset.act==='qf'){qFilter={comp:$('#qfComp').value,lvl:$('#qfLvl').value};render(true)}});
  document.addEventListener('input',e=>{if(e.target.id==='crmQ'){const v=e.target.value.toLowerCase();document.querySelectorAll('#crmTable tbody tr').forEach(tr=>tr.style.display=tr.dataset.q.includes(v)?'':'none')}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.lbl')){e.preventDefault();ACT.axis(e.target)}});
  window.addEventListener('hashchange',route);
  document.addEventListener('DOMContentLoaded',route);
}
</script>
</body>
