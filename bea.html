<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cognitive Vocabulary Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#EEF1F7; --surface:#FFFFFF; --surface2:#F6F7FB; --ink:#23283A; --muted:#5C6378; --line:#DCE1EC;
  --peri:#5966D6; --peri-ink:#FFFFFF; --peri-soft:#E3E6FB; --peri-mid:#AEB6F2;
  --mint:#D6F1E1; --mint-ink:#1E6943; --mint-line:#93D3AE;
  --rose:#FBDCDC; --rose-ink:#A12F3A; --rose-line:#EFA3A8;
  --butter:#F7E3A1; --butter-soft:#FBF1CF; --lav:#ECE8FC;
  --shadow:0 1px 2px rgba(35,40,58,.06),0 8px 24px rgba(35,40,58,.06);
  --ui:"Onest","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --lex:"Newsreader",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  color-scheme:dark; --bg:#171A24; --surface:#20242F; --surface2:#262B38; --ink:#E8EAF2; --muted:#A3A9BC; --line:#343A4A;
  --peri:#8E99F2; --peri-ink:#151827; --peri-soft:#2C3152; --peri-mid:#5562B8;
  --mint:#1D3A2B; --mint-ink:#9FE0BC; --mint-line:#2F6B4A; --rose:#432428; --rose-ink:#F5B3B8; --rose-line:#7A3940;
  --butter:#D9C47A; --butter-soft:#3A3524; --lav:#2A2740; --shadow:0 1px 2px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  color-scheme:dark; --bg:#171A24; --surface:#20242F; --surface2:#262B38; --ink:#E8EAF2; --muted:#A3A9BC; --line:#343A4A;
  --peri:#8E99F2; --peri-ink:#151827; --peri-soft:#2C3152; --peri-mid:#5562B8;
  --mint:#1D3A2B; --mint-ink:#9FE0BC; --mint-line:#2F6B4A; --rose:#432428; --rose-ink:#F5B3B8; --rose-line:#7A3940;
  --butter:#D9C47A; --butter-soft:#3A3524; --lav:#2A2740; --shadow:0 1px 2px rgba(0,0,0,.3);
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--peri);outline-offset:2px}
[lang="en"].en,.en{font-family:var(--lex);font-weight:500}
.muted{color:var(--muted)} .small{font-size:15px}
.app{max-width:960px;margin:0 auto;padding:20px 20px 64px}

/* header */
.top{display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap}
.brand h1{margin:0;font-family:var(--lex);font-weight:600;font-size:30px;letter-spacing:-.01em;line-height:1.15}
.brand .sub{margin:2px 0 0;color:var(--muted);font-size:15px;max-width:520px}
.top-r{display:flex;align-items:center;gap:10px}
.schema{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;padding:8px 14px 8px 10px;box-shadow:var(--shadow)}
.cells{display:grid;grid-template-columns:repeat(20,9px);gap:3px}
.cells i{width:9px;height:9px;border-radius:50%;background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.cells i.m1{background:var(--peri-soft);box-shadow:none}.cells i.m2{background:var(--peri-mid);box-shadow:none}.cells i.m3{background:var(--peri);box-shadow:none}
.schema-l{font-size:14px;line-height:1.3;max-width:170px}
.icon-btn{width:44px;height:44px;border-radius:14px;border:none;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center}
.icon-btn svg{width:22px;height:22px}
.menu-w{position:relative}
.menu{position:absolute;right:0;top:52px;z-index:30;background:var(--surface);border-radius:16px;box-shadow:0 12px 40px rgba(35,40,58,.18);padding:12px;width:300px}
.menu p{margin:2px 6px 8px}
.menu button{display:block;width:100%;text-align:left;border:none;background:transparent;padding:10px;border-radius:10px}
.menu button:hover{background:var(--surface2)}

/* tabs */
.tabs{display:flex;gap:8px;margin:22px 0 18px;overflow-x:auto;scrollbar-width:none;padding:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 1 0;min-width:0;border:none;background:var(--surface);border-radius:16px;padding:10px 12px 12px;text-align:left;display:grid;grid-template-columns:auto 1fr;column-gap:8px;row-gap:6px;align-items:center;box-shadow:var(--shadow);color:var(--muted);transition:background .2s,color .2s}
.tab .tn{width:26px;height:26px;border-radius:9px;background:var(--surface2);display:grid;place-items:center;font-weight:600;font-size:14px;color:var(--ink)}
.tab .tt{font-size:14px;font-weight:500;line-height:1.2}
.tab .tp{grid-column:1 / -1;height:4px;border-radius:2px;background:var(--surface2);overflow:hidden}
.tab .tp i{display:block;height:100%;background:var(--peri-mid)}
.tab[aria-selected="true"]{background:var(--peri);color:var(--peri-ink)}
.tab[aria-selected="true"] .tn{background:rgba(255,255,255,.22);color:var(--peri-ink)}
.tab[aria-selected="true"] .tp{background:rgba(255,255,255,.25)}.tab[aria-selected="true"] .tp i{background:var(--peri-ink)}
.tab-final{background:var(--butter-soft)}
.tab-final .tn{background:var(--butter)}
.tab-final[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tab-final[aria-selected="true"] .tn{background:var(--butter);color:#23283A}

/* level head */
.lv-head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.learned{display:flex;align-items:center;gap:12px;font-size:15px}
.learned b{font-weight:600}
.bar{display:inline-block;width:140px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;vertical-align:middle}
.bar i{display:block;height:100%;background:var(--peri);border-radius:3px;transition:width .4s}
.lv-ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface);border-radius:12px;padding:3px;box-shadow:var(--shadow)}
.seg button{border:none;background:transparent;padding:7px 12px;border-radius:9px;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--peri-soft);color:var(--ink);font-weight:600}

/* cards */
.card{background:var(--surface);border-radius:24px;padding:28px 32px;box-shadow:var(--shadow);margin-bottom:16px;position:relative}
.card h2{font-family:var(--lex);font-weight:600;font-size:30px;margin:0 0 10px;letter-spacing:-.01em}
.h3{font-family:var(--lex);font-weight:600;font-size:24px;margin:0 0 10px}
.sess-prog{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:var(--muted);margin-bottom:18px}
.sess-prog .bar{width:180px}
.hint{color:var(--muted);margin:0 0 14px}
.word{font-family:var(--lex);font-weight:500;font-size:clamp(34px,6vw,56px);line-height:1.08;letter-spacing:-.015em;margin:8px 0 24px;overflow-wrap:anywhere}
.word.ru{font-family:var(--ui);font-weight:600;font-size:clamp(24px,4vw,34px);letter-spacing:-.01em;line-height:1.2}
.mean{color:var(--muted);margin:-10px 0 18px}
.ex{font-family:var(--lex);font-style:italic;font-size:18px}

/* buttons */
.btn{border:none;border-radius:14px;padding:13px 22px;font-weight:600;font-size:16px;min-height:48px;transition:transform .12s,background .2s,opacity .2s}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.45}
.btn-primary{background:var(--peri);color:var(--peri-ink)}
.btn-ghost{background:var(--surface2);color:var(--ink)}
.btn-ok{background:var(--mint);color:var(--mint-ink)}
.btn-bad{background:var(--rose);color:var(--rose-ink)}
.btn.faded{opacity:.4}
.row2{display:flex;gap:10px;flex-wrap:wrap}
.row2 .btn{flex:1 1 200px}

/* feedback */
.fb{border-radius:18px;padding:16px 18px;margin-top:18px;display:grid;gap:8px;animation:pop .25s ease}
.fb-ok{background:var(--mint);color:var(--mint-ink)}
.fb-bad{background:var(--rose);color:var(--rose-ink)}
.fb-h{font-weight:700;font-size:18px}
.fb-b{color:var(--ink);font-size:16px}
.fb .btn{justify-self:start}
.fb-ok .btn-primary{background:var(--mint-ink);color:var(--mint)}
.fb-bad .btn-primary{background:var(--rose-ink);color:var(--rose)}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* level 1 */
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.col{display:grid;gap:10px;align-content:start}
.pair{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;min-height:56px;text-align:left;font-size:16px;line-height:1.3;transition:background .2s,border-color .2s,opacity .3s}
.pair.en{font-family:var(--lex);font-size:20px;font-weight:500}
.pair:hover:not(:disabled){border-color:var(--peri-mid)}
.pair.sel{border-color:var(--peri);background:var(--peri-soft)}
.pair.good{background:var(--mint);border-color:var(--mint-line)}
.pair.badf{background:var(--rose);border-color:var(--rose-line);animation:shake .3s}
.pair.matched{background:var(--mint);border-color:transparent;color:var(--mint-ink);opacity:.55}
.match-msg{min-height:20px}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* level 2 */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 16px;text-align:left;display:flex;gap:12px;align-items:center;min-height:64px;font-size:16px;line-height:1.3}
.opt .k{flex:none;width:28px;height:28px;border-radius:9px;background:var(--surface2);display:grid;place-items:center;font-weight:600;font-size:14px}
.opt:hover:not(:disabled){border-color:var(--peri)}
.opt.good{background:var(--mint);border-color:var(--mint-line)}
.opt.badf{background:var(--rose);border-color:var(--rose-line)}
.opt.faded{opacity:.45}

/* level 3 */
.flip{background:var(--lav);border-radius:20px;padding:30px 28px;margin-bottom:18px;min-height:220px;display:flex;flex-direction:column;justify-content:center}
.flip .word{margin:0}
.flip .back{margin-top:22px;padding-top:18px;border-top:1.5px dashed var(--peri-mid);animation:pop .3s ease}
.answer{font-size:clamp(22px,3.4vw,30px);font-weight:600;line-height:1.25}
.answer.en{font-family:var(--lex);font-weight:500}
.replist{margin:0;padding-left:20px}.replist li{margin:6px 0}

/* level 4/5 */
.cloze{font-family:var(--lex);font-size:clamp(22px,3.4vw,30px);line-height:1.5;margin:6px 0 20px}
.gap{display:inline-flex;gap:8px;vertical-align:baseline}
.gapw{display:inline-block;height:1.05em;border-bottom:2.5px solid var(--peri);vertical-align:-.15em}
.answer-form{display:flex;gap:10px;flex-wrap:wrap}
.answer-form input{flex:1 1 260px;min-height:54px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface2);padding:12px 16px;font-family:var(--lex);font-size:22px}
.answer-form input:focus{border-color:var(--peri);outline:none;background:var(--surface)}
.answer-form input:disabled{opacity:1}

/* level 6 */
.claim{display:flex;flex-direction:column;gap:6px;margin:4px 0 22px}
.claim .word{margin:0}
.eq{color:var(--muted);font-size:15px}
.claim-ru{font-size:clamp(20px,3vw,26px);font-weight:600;line-height:1.3}

/* summary & final */
.summary .sum-line{font-size:18px}
.big{font-family:var(--lex);font-size:34px;font-weight:600}
.final-mode .card.test{background:var(--surface)}
.neutral{color:var(--muted)}
.test-nav{display:flex;gap:10px;margin:14px 0 18px}
.grid50{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.cell{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;min-height:38px;font-size:14px;font-variant-numeric:tabular-nums;color:var(--muted)}
.cell.filled{background:var(--surface2);color:var(--ink);border-color:var(--surface2)}
.cell.cur{border-color:var(--ink);color:var(--ink);font-weight:700}
.finish-row{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.intro p{max-width:62ch}
.stats3,.stats4{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}
.stats4{grid-template-columns:repeat(4,1fr)}
.stats3>div,.stats4>div{background:var(--surface2);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.sv{font-family:var(--lex);font-size:32px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.sl{font-size:14px;color:var(--muted);line-height:1.3}
.hist-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.daysel{display:flex;gap:8px;align-items:center;font-size:15px;color:var(--muted)}
.daysel select{border-radius:10px;border:1.5px solid var(--line);background:var(--surface2);padding:8px 10px;color:var(--ink)}
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
th{text-align:left;color:var(--muted);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line)}
.win{text-align:center;overflow:hidden;background:linear-gradient(180deg,var(--butter-soft),var(--surface) 70%)}
.win-h{font-size:clamp(26px,4vw,36px)!important;max-width:620px;margin:10px auto 8px!important}
.badge{width:120px;height:120px;margin:6px auto 0;display:block}
.confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.modal{position:fixed;inset:0;background:rgba(20,24,38,.45);display:grid;place-items:center;padding:20px;z-index:50}
.modal-box{background:var(--surface);border-radius:22px;padding:26px;max-width:460px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.modal-box h2{margin:0 0 8px;font-family:var(--lex);font-size:26px}

@media (max-width:640px){
  .app{padding:14px 12px 48px}
  .brand h1{font-size:24px}
  .top-r{width:100%;justify-content:space-between}
  .card{padding:20px 18px;border-radius:20px}
  .opts{grid-template-columns:1fr}
  .match{gap:8px}
  .pair{padding:10px;font-size:14px}.pair.en{font-size:17px}
  .grid50{grid-template-columns:repeat(7,1fr)} .cells{grid-template-columns:repeat(15,9px)}
  .stats4{grid-template-columns:1fr 1fr}
  .stats3{grid-template-columns:1fr 1fr 1fr}.sv{font-size:26px}
  .lv-head{flex-direction:column;align-items:stretch}
  .tab{flex:0 0 auto;min-width:112px}.tab .tt{white-space:nowrap}
  .bar{width:100px}.sess-prog .bar{width:100px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

<script id="app">
(function(){
"use strict";
const {useState,useEffect,useRef,useMemo,useCallback} = React;

const SET = window.VOCAB_SET, WORDS = SET.words, BY = Object.fromEntries(WORDS.map(w=>[w.id,w]));
const TOTAL = WORDS.length;
const LS_KEY = "cvt:"+SET.id+":v1", LS_PREF = "cvt:prefs";

/* ---------------- utils ---------------- */
const norm = s => (s||"").toLowerCase().normalize("NFKC")
  .replace(/[\u2010-\u2015\u2212]/g,"-").replace(/[\u2018\u2019`´]/g,"'")
  .replace(/-/g," ").replace(/\s+/g," ").trim().replace(/[.!?,;:]+$/,"").trim();
const accepts = (list, input) => { const n = norm(input); return n.length>0 && list.some(a=>norm(a)===n); };
const clozeList = w => w.clozeAnswers || w.acceptedEnglishAnswers.filter(a=>!/^(to|an|a) /i.test(a));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const dayKey = ts => { const d=new Date(ts); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const fmtDT = ts => new Date(ts).toLocaleString("ru-RU",{day:"numeric",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"});
const fmtD = ts => new Date(ts).toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"});
const fmtDayKey = k => { const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString("ru-RU",{weekday:"short",day:"numeric",month:"long",year:"numeric"}); };
const plural=(n,a,b,c)=>{const m10=n%10,m100=n%100;return m10===1&&m100!==11?a:(m10>=2&&m10<=4&&(m100<12||m100>14)?b:c);};
const plainSentence = w => w.exampleSentence.replace(/\[\[(.+?)\]\]/g,"$1");
const ExtraExamples = ({w}) => html`<div class="muted small">${(w.extraExamples||[]).map((sentence,i)=>html`<p key=${i} style=${{margin:"7px 0 0"}}><span class="ex" lang="en">${sentence}</span></p>`)}</div>`;

/* ---------------- state ---------------- */
const LEVELS = [
  {n:1,key:"match",title:"Найди пару",short:"Пары"},
  {n:2,key:"choice",title:"Выбери перевод",short:"Выбор"},
  {n:3,key:"cards",title:"Вспомни перевод",short:"Карточки"},
  {n:4,key:"cloze",title:"Заполни пропуск",short:"Пропуск"},
  {n:5,key:"reverse",title:"Переведи наоборот",short:"Перевод"},
  {n:6,key:"truefalse",title:"Найди ошибку",short:"Ошибка"},
  {n:7,key:"final",title:"Итоговая проверка",short:"Итог"}
];
function freshState(){
  const levels={}; for(let i=1;i<=6;i++) levels[i]={learned:[],size:10,runs:0,session:null};
  return {v:1,updatedAt:0,stats:{},levels,test:{current:null,history:[]},tab:1};
}
function sanitize(s){
  const f=freshState(); if(!s||typeof s!=="object") return f;
  const out=Object.assign(f,s); out.levels=Object.assign(freshState().levels,s.levels||{});
  out.test=Object.assign({current:null,history:[]},s.test||{}); out.stats=s.stats||{}; return out;
}
function loadLocal(){ try{ return sanitize(JSON.parse(localStorage.getItem(LS_KEY))); }catch(e){ return freshState(); } }
function saveLocal(s){ try{ localStorage.setItem(LS_KEY,JSON.stringify(s)); }catch(e){} }

/* weighted pick: words with mistakes and words not yet learned in this level come up more often */
function pickWords(state, level, n){
  const learned=new Set(state.levels[level].learned);
  const keyed=WORDS.map(w=>{const st=state.stats[w.id]||{c:0,w:0};
    let wt=1+2.2*Math.min(st.w,5)+(learned.has(w.id)?0:1.2)-Math.min(st.c,5)*0.15; wt=Math.max(.3,wt);
    return {id:w.id,k:Math.pow(Math.random(),1/wt)};});
  keyed.sort((a,b)=>b.k-a.k); return keyed.slice(0,n).map(x=>x.id);
}
function distractors(target, n, field){
  const t=BY[target];
  const ok=w=>w.id!==target && !(t.group && w.group===t.group) && w[field]!==t[field];
  let pool=shuffle(WORDS.filter(w=>ok(w)&&w.category===t.category));
  if(pool.length<n) pool=pool.concat(shuffle(WORDS.filter(w=>ok(w)&&w.category!==t.category)));
  return pool.slice(0,n).map(w=>w.id);
}
function mastery(st){ if(!st) return 0; const m=st.c-st.w; if(m>=3) return 3; if(m>=1) return 2; return 1; }

/* ---------------- sound ---------------- */
let actx=null;
function tone(seq){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); const t0=actx.currentTime;
  seq.forEach(([f,start,dur,vol])=>{const o=actx.createOscillator(),g=actx.createGain();o.type="sine";o.frequency.value=f;
    g.gain.setValueAtTime(0,t0+start);g.gain.linearRampToValueAtTime(vol||.12,t0+start+.015);g.gain.exponentialRampToValueAtTime(.0001,t0+start+dur);
    o.connect(g);g.connect(actx.destination);o.start(t0+start);o.stop(t0+start+dur+.05);}); }catch(e){} }
const SFX={ok:[[660,0,.14],[880,.09,.2]],bad:[[220,0,.22,.1],[196,.12,.28,.08]],done:[[523,0,.3],[659,.08,.3],[784,.16,.4],[1047,.26,.6]],tap:[[520,0,.06,.05]]};

/* ---------------- shared UI ---------------- */
function Feedback({ok,children,onNext,nextLabel}){
  const btn=useRef(null);
  useEffect(()=>{ btn.current&&btn.current.focus({preventScroll:true}); },[]);
  return html`<div class=${"fb "+(ok?"fb-ok":"fb-bad")} role="status" aria-live="polite">
    <div class="fb-h">${ok?"Правильно!":"Ошибка"}</div>

    ${onNext?html`<button ref=${btn} class="btn btn-primary" onClick=${onNext}>${nextLabel||"Дальше"}</button>`:null}
  </div>`;
}
function LevelHead({level,state,update,onRestart,extra}){
  const L=state.levels[level], learned=L.learned.length;
  return html`<div class="lv-head">
    <div class="lv-meta">
      <div class="learned"><b>Изучено ${learned} из ${TOTAL}</b><span class="bar" aria-hidden="true"><i style=${{width:(learned/TOTAL*100)+"%"}}></i></span></div>
    </div>
    <div class="lv-ctrl">
      ${extra}
      <div class="seg" role="group" aria-label="Слов в тренировке">
        ${[10,20,50].map(n=>html`<button key=${n} aria-pressed=${L.size===n} onClick=${()=>{update(s=>{s.levels[level].size=n;s.levels[level].session=null;});}}>${n} слов</button>`)}
      </div>
      <button class="btn btn-ghost" onClick=${onRestart}>Начать заново</button>
    </div>
  </div>`;
}
function Progress({pos,len,label}){
  return html`<div class="sess-prog"><span>${label||"Задание"} ${Math.min(pos+1,len)} из ${len}</span><span class="bar" aria-hidden="true"><i style=${{width:(pos/len*100)+"%"}}></i></span></div>`;
}
function Summary({sess,level,onAgain}){
  const pct=Math.round(sess.correct/Math.max(1,sess.correct+sess.wrong)*100);
  return html`<div class="card summary">
    <h2>Тренировка завершена</h2>
    <p class="sum-line"><span class="big">${sess.correct}</span> правильных ответов и <span class="big">${sess.wrong}</span> ${plural(sess.wrong,"ошибка","ошибки","ошибок")}</p>
    <p class="muted">Точность ${pct}%. Слова с ошибками будут чаще попадаться в следующих тренировках.</p>
    <button class="btn btn-primary" onClick=${onAgain}>Ещё одна тренировка</button>
  </div>`;
}

/* record a training answer */
function record(s, level, id, ok){
  const st=s.stats[id]||(s.stats[id]={c:0,w:0}); if(ok) st.c++; else st.w++;
  if(ok && !s.levels[level].learned.includes(id)) s.levels[level].learned.push(id);
}

/* ---------------- Level 1: matching ---------------- */
function buildSets(ids){
  const sets=[]; const rest=ids.slice();
  while(rest.length){ const size=rest.length<=8?rest.length:6; const set=[];
    for(let i=0;i<rest.length&&set.length<size;){ const w=BY[rest[i]];
      if(!w.group||!set.some(x=>BY[x].group===w.group)){ set.push(rest[i]); rest.splice(i,1);} else i++; }
    if(!set.length) set.push(rest.shift());
    sets.push({ids:set,ru:shuffle(set),matched:[]}); }
  return sets;
}
function Match({state,update,sfx}){
  const lv=1, L=state.levels[lv];
  const start=()=>update(s=>{const ids=pickWords(s,lv,s.levels[lv].size);s.levels[lv].session={sets:buildSets(ids),idx:0,correct:0,wrong:0,done:false};s.levels[lv].runs++;});
  useEffect(()=>{ if(!L.session) start(); },[L.session]);
  const S=L.session;
  return html`<div>
    <${LevelHead} level=${lv} state=${state} update=${update} onRestart=${start}/>
    ${!S?null:S.done?html`<${Summary} sess=${S} onAgain=${start}/>`:html`<${MatchSet} key=${S.idx+":"+L.runs} S=${S} update=${update} sfx=${sfx}/>`}
  </div>`;
}
function MatchSet({S,update,sfx}){
  const lv=1, set=S.sets[S.idx];

  const setDone=set.matched.length===set.ids.length;
  useEffect(()=>{ if(setDone&&!S.done){ const t=setTimeout(()=>update(s=>{s.levels[lv].session.idx++;}),1100); return ()=>clearTimeout(t);} },[setDone,S.done]);
  const trySel=(side,id)=>{
    if(set.matched.includes(id)) return;
    const next=Object.assign({},sel,{[side]:sel[side]===id?null:id});
    if(next.en!=null&&next.ru!=null){
      const ok=next.en===next.ru, en=next.en;
      setFlash({en:next.en,ru:next.ru,ok}); sfx(ok?"ok":"bad"); setMsg({ok,en});
      setTimeout(()=>setFlash(null),650); setSel({en:null,ru:null});
      update(s=>{const ss=s.levels[lv].session, st=ss.sets[ss.idx]; record(s,lv,en,ok);
        if(ok){ss.correct++; st.matched.push(en); if(st.matched.length===st.ids.length && ss.idx===ss.sets.length-1) ss.done=true;}
        else ss.wrong++;});
    } else setSel(next);
  };
  const cls=(side,id)=>{ let c="pair"; if(set.matched.includes(id)) c+=" matched"; if(sel[side]===id) c+=" sel";
    if(flash&&flash[side]===id) c+=flash.ok?" good":" badf"; return c; };
  return html`<div class="card">
      <${Progress} pos=${S.idx} len=${S.sets.length} label="Набор"/>
      <p class="hint">Выберите английское слово, а затем его перевод.</p>
      <div class="match">
        <div class="col" role="group" aria-label="Английские слова">${set.ids.map(id=>html`<button key=${"e"+id} class=${cls("en",id)+" en"} disabled=${set.matched.includes(id)} aria-pressed=${sel.en===id} onClick=${()=>trySel("en",id)}><span lang="en">${BY[id].english}</span></button>`)}</div>
        <div class="col" role="group" aria-label="Переводы">${set.ru.map(id=>html`<button key=${"r"+id} class=${cls("ru",id)} disabled=${set.matched.includes(id)} aria-pressed=${sel.ru===id} onClick=${()=>trySel("ru",id)}>${BY[id].russian}</button>`)}</div>
      </div>
      <div class="match-msg" aria-live="polite">
        ${setDone?html`<div class="fb fb-ok"><div class="fb-h">Набор собран!</div><div class="fb-b">${S.idx<S.sets.length-1?"Переходим к следующему набору.":"Это был последний набор."}</div></div>`
          :msg?html`<div class=${"fb "+(msg.ok?"fb-ok":"fb-bad")}><div class="fb-h">${msg.ok?"Правильно!":"Ошибка"}</div>${!msg.ok?html`<div class="fb-b"><span lang="en" class="en">${BY[msg.en].english}</span> означает «${BY[msg.en].russian}».</div>`:null}</div>`:null}
      </div>
    </div>`;
}

/* ---------------- queue-based levels (2,4,5,6) ---------------- */
function newQueueSession(s,lv,extra){ const ids=pickWords(s,lv,s.levels[lv].size);
  s.levels[lv].session=Object.assign({queue:ids,pos:0,correct:0,wrong:0,requeued:[],ans:null,done:false},extra?extra(ids):{}); s.levels[lv].runs++; }
function advance(s,lv){ const ss=s.levels[lv].session; ss.pos++; ss.ans=null; if(ss.pos>=ss.queue.length) ss.done=true; }
function answerQ(s,lv,id,ok,ans){ const ss=s.levels[lv].session; record(s,lv,id,ok); if(ok) ss.correct++; else { ss.wrong++;
  if(!ss.requeued.includes(id)){ ss.requeued.push(id); const at=Math.min(ss.queue.length, ss.pos+3+Math.floor(Math.random()*3)); ss.queue.splice(at,0,id); } }
  ss.ans=Object.assign({ok},ans); }

/* Level 2 */
function Choice({state,update,sfx}){
  const lv=2,L=state.levels[lv];
  const start=()=>update(s=>newQueueSession(s,lv,()=>({opts:{}})));
  useEffect(()=>{ if(!L.session) start(); },[L.session]);
  const S=L.session;
  return html`<div><${LevelHead} level=${lv} state=${state} update=${update} onRestart=${start}/>
    ${!S?null:S.done?html`<${Summary} sess=${S} onAgain=${start}/>`:html`<${ChoiceItem} S=${S} update=${update} sfx=${sfx}/>`}</div>`;
}
function ChoiceItem({S,update,sfx}){
  const lv=2, id=S.queue[S.pos], w=BY[id];
  useEffect(()=>{ if(!S.opts[S.pos]) update(s=>{const ss=s.levels[lv].session; ss.opts[ss.pos]=shuffle([id].concat(distractors(id,3,"russian")));}); },[S.pos]);
  const o=S.opts[S.pos]||[];
  const choose=c=>{ if(S.ans) return; const ok=c===id; sfx(ok?"ok":"bad"); update(s=>answerQ(s,lv,id,ok,{choice:c})); };
  useEffect(()=>{ const k=e=>{ if(S.ans||/input|textarea|select/i.test(e.target.tagName)) return; const n=parseInt(e.key,10); if(n>=1&&n<=4&&o[n-1]!=null) choose(o[n-1]); };
    addEventListener("keydown",k); return ()=>removeEventListener("keydown",k); });
  return html`<div class="card">
      <${Progress} pos=${S.pos} len=${S.queue.length}/>
      <div class="word" lang="en">${w.english}</div>
      <div class="opts" role="group" aria-label="Варианты перевода">
        ${o.map((c,i)=>{ let cl="opt"; if(S.ans){ if(c===id) cl+=" good"; else if(c===S.ans.choice) cl+=" badf"; else cl+=" faded"; }
          return html`<button key=${c} class=${cl} disabled=${!!S.ans} onClick=${()=>choose(c)}><span class="k" aria-hidden="true">${i+1}</span>${BY[c].russian}</button>`; })}
      </div>
      ${S.ans?html`<${Feedback} key=${"f"+S.pos} ok=${S.ans.ok} onNext=${()=>update(s=>advance(s,lv))}>
        ${S.ans.ok?html`<span class="ex" lang="en">${plainSentence(w)}</span><${ExtraExamples} w=${w}/>`:html`<span><span lang="en" class="en">${w.english}</span> означает «${w.russian}». Пример: <span class="ex" lang="en">${plainSentence(w)}</span><${ExtraExamples} w=${w}/></span>`}
      </${Feedback}>`:null}
    </div>`;
}

/* Level 3: cards */
function Cards({state,update,sfx}){
  const lv=3,L=state.levels[lv];
  const start=()=>update(s=>{const dir=(s.levels[lv].session&&s.levels[lv].session.dir)||"en";newQueueSession(s,lv,()=>({dir,revealed:false,repeat:[]}));});
  useEffect(()=>{ if(!L.session) start(); },[L.session]);
  const S=L.session; if(!S) return null;
  const setDir=d=>update(s=>{s.levels[lv].session.dir=d;s.levels[lv].session.revealed=false;});
  const extra=html`<div class="seg" role="group" aria-label="Направление карточек">
    <button aria-pressed=${S.dir==="en"} onClick=${()=>setDir("en")}>EN → RU</button>
    <button aria-pressed=${S.dir==="ru"} onClick=${()=>setDir("ru")}>RU → EN</button></div>`;
  if(S.done) return html`<div><${LevelHead} level=${lv} state=${state} update=${update} onRestart=${start} extra=${extra}/>
    <${Summary} sess=${S} onAgain=${start}/>
    ${S.repeat.length?html`<div class="card"><h3 class="h3">Повторить эти слова</h3><ul class="replist">${S.repeat.map(i=>html`<li key=${i}><span lang="en" class="en">${BY[i].english}</span> <span class="muted">${BY[i].russian}</span></li>`)}</ul></div>`:null}</div>`;
  const id=S.queue[S.pos], w=BY[id];
  const front = S.dir==="en"? html`<div class="word" lang="en">${w.english}</div>` : html`<div class="word ru">${w.russian}</div>`;
  const back = S.dir==="en"? html`<div class="answer">${w.russian}</div>` : html`<div class="answer en" lang="en">${w.english}</div>`;
  const mark=ok=>{ sfx(ok?"ok":"bad"); update(s=>{const ss=s.levels[lv].session; answerQ(s,lv,id,ok,{}); if(!ok&&!ss.repeat.includes(id)) ss.repeat.push(id); advance(s,lv); ss.revealed=false;}); };
  return html`<div><${LevelHead} level=${lv} state=${state} update=${update} onRestart=${start} extra=${extra}/>
    <div class="card flash">
      <${Progress} pos=${S.pos} len=${S.queue.length} label="Карточка"/>
      <div class=${"flip"+(S.revealed?" on":"")}>
        ${front}
        ${S.revealed?html`<div class="back">${back}<p class="ex" lang="en">${plainSentence(w)}</p><p class="muted small">${w.exampleTranslation}</p><${ExtraExamples} w=${w}/></div>`:null}
      </div>
      ${!S.revealed?html`<button class="btn btn-primary" onClick=${()=>{sfx("tap");update(s=>{s.levels[lv].session.revealed=true;});}}>Показать перевод</button>`
        :html`<div class="row2"><button class="btn btn-ok" onClick=${()=>mark(true)}>Я вспомнила правильно</button><button class="btn btn-bad" onClick=${()=>mark(false)}>Не вспомнила</button></div>`}
      ${S.repeat.length?html`<p class="muted small">Для повторения: ${S.repeat.length}</p>`:null}
    </div></div>`;
}

/* Typing levels 4 & 5 */
function TypeLevel({lv,state,update,sfx,mode}){
  const L=state.levels[lv];
  const start=()=>update(s=>newQueueSession(s,lv));
  useEffect(()=>{ if(!L.session) start(); },[L.session]);
  const [val,setVal]=useState(""); const inp=useRef(null);
  const S=L.session;
  useEffect(()=>{ setVal(""); if(inp.current) inp.current.focus({preventScroll:true}); },[S&&S.pos,S&&S.done]);
  if(!S) return null;
  if(S.done) return html`<div><${LevelHead} level=${lv} state=${state} update=${update} onRestart=${start}/><${Summary} sess=${S} onAgain=${start}/></div>`;
  const id=S.queue[S.pos], w=BY[id];
  const list = mode==="cloze"? clozeList(w) : w.acceptedEnglishAnswers;
  const submit=e=>{ e&&e.preventDefault(); if(S.ans||!val.trim()) return; const ok=accepts(list,val); sfx(ok?"ok":"bad"); update(s=>answerQ(s,lv,id,ok,{given:val})); };
  let prompt;
  if(mode==="cloze"){
    const parts=w.exampleSentence.split(/\[\[(.+?)\]\]/);
    prompt=html`<p class="cloze" lang="en">${parts.map((p,i)=> i%2? html`<span key=${i} class="gap">${p.split(" ").map((x,j)=>html`<span key=${j} class="gapw" style=${{width:Math.max(3,x.length*.62)+"em"}}></span>`)}</span>` : p)}</p>
      <p class="mean">Значение пропущенного слова: «${w.russian}»</p>`;
  } else {
    prompt=html`<div class="word ru">${w.testPrompt.charAt(0).toUpperCase()+w.testPrompt.slice(1)}</div><p class="mean">Напишите английское слово или выражение.</p>`;
  }
  return html`<div><${LevelHead} level=${lv} state=${state} update=${update} onRestart=${start}/>
    <div class="card">
      <${Progress} pos=${S.pos} len=${S.queue.length}/>
      ${prompt}
      <form class="answer-form" onSubmit=${submit}>
        <input ref=${inp} lang="en" value=${S.ans?S.ans.given:val} disabled=${!!S.ans} onInput=${e=>setVal(e.target.value)} placeholder="Ваш ответ на английском" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Ответ"/>
        ${!S.ans?html`<button class="btn btn-primary" type="submit" disabled=${!val.trim()}>Проверить</button>`:null}
      </form>
      ${S.ans?html`<${Feedback} ok=${S.ans.ok} onNext=${()=>update(s=>advance(s,lv))}>
        ${mode==="cloze"?html`<span><span class="ex" lang="en">${plainSentence(w)}</span><br/><span class="muted">${w.exampleTranslation}</span><${ExtraExamples} w=${w}/></span>`
          :html`<span>Правильно: <b lang="en" class="en">${w.english}</b>${w.acceptedEnglishAnswers.length>1?html` <span class="muted">(принимается также: ${w.acceptedEnglishAnswers.filter(a=>norm(a)!==norm(w.english)).join(", ")})</span>`:null}${!S.ans.ok?html`<br/><span class="muted">Это слово встретится ещё раз в этой тренировке.</span>`:null}</span>`}
      </${Feedback}>`:null}
    </div></div>`;
}

/* Level 6 */
function TrueFalse({state,update,sfx}){
  const lv=6,L=state.levels[lv];
  const start=()=>update(s=>newQueueSession(s,lv,ids=>{const t={};const half=shuffle(ids).slice(0,Math.ceil(ids.length/2));ids.forEach(i=>t[i]=half.includes(i));return {truth:t};}));
  useEffect(()=>{ if(!L.session) start(); },[L.session]);
  const S=L.session; if(!S) return null;
  if(S.done) return html`<div><${LevelHead} level=${lv} state=${state} update=${update} onRestart=${start}/><${Summary} sess=${S} onAgain=${start}/></div>`;
  const id=S.queue[S.pos], w=BY[id];
  const isTrue = S.truth[id]!==undefined? S.truth[id] : Math.random()<.5;
  const shown = isTrue? w.russian : w.wrongRussian;
  const pick=v=>{ if(S.ans) return; const ok=v===isTrue; sfx(ok?"ok":"bad"); update(s=>{ answerQ(s,lv,id,ok,{v,isTrue,shown}); const ss=s.levels[lv].session; if(ss.truth[id]!==undefined && ss.requeued.includes(id)) ss.truth[id]=!ss.truth[id]; }); };
  const disp = S.ans? S.ans.shown : shown;
  const truthNow = S.ans? S.ans.isTrue : isTrue;
  return html`<div><${LevelHead} level=${lv} state=${state} update=${update} onRestart=${start}/>
    <div class="card">
      <${Progress} pos=${S.pos} len=${S.queue.length}/>
      <p class="hint">Верен ли перевод?</p>
      <div class="claim"><span class="word" lang="en">${w.english}</span><span class="eq">означает</span><span class="claim-ru">«${disp}»</span></div>
      <div class="row2">
        <button class=${"btn btn-ok"+(S.ans&&S.ans.v!==true?" faded":"")} disabled=${!!S.ans} onClick=${()=>pick(true)}>Правильно</button>
        <button class=${"btn btn-bad"+(S.ans&&S.ans.v!==false?" faded":"")} disabled=${!!S.ans} onClick=${()=>pick(false)}>Неправильно</button>
      </div>
      ${S.ans?html`<${Feedback} ok=${S.ans.ok} onNext=${()=>update(s=>advance(s,lv))}>
        ${truthNow?html`<span>Перевод верный: «${w.russian}».</span>`:html`<span>Перевод неверный. Правильно: <b>«${w.russian}»</b>.</span>`}
      </${Feedback}>`:null}
    </div></div>`;
}

/* ---------------- Level 7: final test ---------------- */
function Confetti(){
  const ref=useRef(null);
  useEffect(()=>{ if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const c=ref.current,x=c.getContext("2d"); let W,H; const fit=()=>{W=c.width=c.offsetWidth*devicePixelRatio;H=c.height=c.offsetHeight*devicePixelRatio;}; fit();
    const cols=["#7C89F0","#9DDBB7","#F6D77A","#F2A9B6","#B9A8F2"];
    const P=Array.from({length:140},()=>({x:Math.random()*W,y:-Math.random()*H*.6,vx:(Math.random()-.5)*2*devicePixelRatio,vy:(2+Math.random()*3)*devicePixelRatio,r:(4+Math.random()*5)*devicePixelRatio,a:Math.random()*6,va:(Math.random()-.5)*.25,c:cols[Math.floor(Math.random()*cols.length)]}));
    let raf,t0=performance.now();
    const step=t=>{x.clearRect(0,0,W,H);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore();});
      if(t-t0<4200) raf=requestAnimationFrame(step); else x.clearRect(0,0,W,H);};
    raf=requestAnimationFrame(step); return ()=>cancelAnimationFrame(raf); },[]);
  return html`<canvas ref=${ref} class="confetti" aria-hidden="true"></canvas>`;
}
function Badge(){
  return html`<svg class="badge" viewBox="0 0 120 120" aria-hidden="true">
    <circle cx="60" cy="60" r="54" fill="var(--butter)"/><circle cx="60" cy="60" r="44" fill="none" stroke="var(--ink)" stroke-width="2" stroke-dasharray="3 5"/>
    <text x="60" y="58" text-anchor="middle" font-family="Newsreader, Georgia, serif" font-size="30" font-weight="600" fill="var(--ink)">${TOTAL}/${TOTAL}</text>
    <text x="60" y="80" text-anchor="middle" font-family="Onest, sans-serif" font-size="11" fill="var(--ink)">все слова</text></svg>`;
}
function History({hist}){
  const days=useMemo(()=>{const m={};hist.forEach(h=>{const k=dayKey(h.ts);(m[k]=m[k]||[]).push(h);});return m;},[hist]);
  const keys=Object.keys(days).sort().reverse(); const today=dayKey(Date.now());
  const [day,setDay]=useState(today);
  const list=(days[day]||[]).slice().sort((a,b)=>a.ts-b.ts);
  const best=list.length?Math.max(...list.map(h=>h.score)):null;
  const avg=list.length?(list.reduce((a,h)=>a+h.score,0)/list.length):null;
  const perfect=hist.filter(h=>h.score===h.total); const lastPerfect=perfect.length?Math.max(...perfect.map(h=>h.ts)):null;
  const perfectDays=new Set(perfect.map(h=>dayKey(h.ts))).size;
  const opts=keys.includes(today)?keys:[today].concat(keys);
  return html`<section class="card hist" aria-labelledby="hist-h">
    <div class="hist-top"><h2 id="hist-h" class="h3">Мои результаты</h2>
      <label class="daysel">День <select value=${day} onChange=${e=>setDay(e.target.value)}>${opts.map(k=>html`<option key=${k} value=${k}>${k===today?"Сегодня":fmtDayKey(k)}</option>`)}</select></label></div>
    <div class="stats4">
      <div><span class="sv">${best!=null?best+"/"+TOTAL:"—"}</span><span class="sl">лучший результат дня</span></div>
      <div><span class="sv">${list.length}</span><span class="sl">${plural(list.length,"попытка","попытки","попыток")} за день</span></div>
      <div><span class="sv">${avg!=null?avg.toFixed(1).replace(".",","):"—"}</span><span class="sl">средний балл за день</span></div>
      <div><span class="sv">${perfectDays}</span><span class="sl">${plural(perfectDays,"день","дня","дней")} с результатом ${TOTAL}/${TOTAL}</span></div>
    </div>
    <p class="muted small">Последнее идеальное прохождение: ${lastPerfect?fmtDT(lastPerfect):"пока не было"}.</p>
    ${list.length?html`<div class="tblwrap"><table><thead><tr><th>Попытка</th><th>Время</th><th>Результат</th><th>Ошибки</th></tr></thead>
      <tbody>${list.map((h,i)=>html`<tr key=${h.ts}><td>${i+1}</td><td>${new Date(h.ts).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})}</td><td><b>${h.score}/${h.total}</b></td><td>${h.total-h.score}</td></tr>`)}</tbody></table></div>`
      :html`<p class="muted">В этот день завершённых попыток нет.</p>`}
  </section>`;
}
function Final({state,update,sfx}){
  const T=state.test, cur=T.current;
  const [result,setResult]=useState(null); const [confirm,setConfirm]=useState(false);
  const inp=useRef(null);
  const begin=()=>{ setResult(null); update(s=>{s.test.current={order:shuffle(WORDS.map(w=>w.id)),answers:{},idx:0,startedAt:Date.now()};}); };
  useEffect(()=>{ if(inp.current) inp.current.focus({preventScroll:true}); },[cur&&cur.idx]);
  if(result) {
    const perfect=result.score===result.total;
    return html`<div>
      ${perfect?html`<div class="card win"><${Confetti}/><${Badge}/>
        <h2 class="win-h">Идеальный результат! ${TOTAL} из ${TOTAL}. Ты знаешь все слова!</h2>
        <p class="muted">${fmtDT(result.ts)}</p>
        <button class="btn btn-primary" onClick=${begin}>Пройти ещё раз</button></div>`
      :html`<div class="card result" role="status">
        <h2>Тест завершён</h2>
        <div class="stats3"><div><span class="sv">${result.score}/${result.total}</span><span class="sl">правильных ответов</span></div>
          <div><span class="sv">${result.total-result.score}</span><span class="sl">${plural(result.total-result.score,"ошибка","ошибки","ошибок")}</span></div>
          <div><span class="sv">${Math.round(result.score/result.total*100)}%</span><span class="sl">правильных</span></div></div>
        <p class="muted">${fmtDT(result.ts)}</p>
        <button class="btn btn-primary" onClick=${begin}>Пройти ещё раз</button></div>`}
      <${History} hist=${T.history}/></div>`;
  }
  if(!cur) return html`<div>
    <div class="card intro">
      <h2>Итоговая проверка</h2>
      <p>${TOTAL} заданий: по русскому значению напишите английское слово или выражение. Каждое слово встретится один раз.</p>
      <p>Во время теста правильность ответов не показывается. Между заданиями можно свободно переходить и менять ответы. Результат появится после кнопки «Завершить тест».</p>
      <p class="muted">Цель: ${TOTAL} из ${TOTAL} за одну попытку. Если выйти из вкладки, ответы сохранятся.</p>
      <button class="btn btn-primary" onClick=${begin}>Начать тест</button>
    </div>
    <${History} hist=${T.history}/></div>`;
  const id=cur.order[cur.idx], w=BY[id];
  const filled=cur.order.filter(i=>(cur.answers[i]||"").trim()).length;
  const all=filled===cur.order.length;
  const setAns=v=>update(s=>{s.test.current.answers[id]=v;});
  const go=i=>update(s=>{s.test.current.idx=Math.max(0,Math.min(cur.order.length-1,i));});
  const finish=()=>{ const score=cur.order.reduce((a,i)=>a+(accepts(BY[i].acceptedEnglishAnswers,cur.answers[i])?1:0),0);
    const r={ts:Date.now(),score,total:cur.order.length}; setConfirm(false); setResult(r); sfx(score===r.total?"done":"tap");
    update(s=>{s.test.history.push(r);s.test.current=null;}); };
  return html`<div>
    <div class="card test">
      <div class="sess-prog neutral"><span>Задание ${cur.idx+1} из ${cur.order.length}</span><span class="muted">Заполнено ${filled} из ${cur.order.length}</span></div>
      <div class="word ru">${w.testPrompt.charAt(0).toUpperCase()+w.testPrompt.slice(1)}</div>
      <form class="answer-form" onSubmit=${e=>{e.preventDefault(); if(cur.idx<cur.order.length-1) go(cur.idx+1); else { const f=cur.order.findIndex(i=>!(cur.answers[i]||"").trim()); if(f>=0) go(f); }}}>
        <input ref=${inp} lang="en" value=${cur.answers[id]||""} onInput=${e=>setAns(e.target.value)} placeholder="Английское слово или выражение" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label=${"Ответ на задание "+(cur.idx+1)}/>
      </form>
      <div class="test-nav">
        <button class="btn btn-ghost" disabled=${cur.idx===0} onClick=${()=>go(cur.idx-1)}>Назад</button>
        <button class="btn btn-ghost" disabled=${cur.idx===cur.order.length-1} onClick=${()=>go(cur.idx+1)}>Вперёд</button>
      </div>
      <div class="grid50" role="group" aria-label="Переход к заданию">
        ${cur.order.map((i,n)=>html`<button key=${i} class=${"cell"+(n===cur.idx?" cur":"")+((cur.answers[i]||"").trim()?" filled":"")} aria-label=${"Задание "+(n+1)+((cur.answers[i]||"").trim()?", заполнено":", пусто")} aria-current=${n===cur.idx?"step":undefined} onClick=${()=>go(n)}>${n+1}</button>`)}
      </div>
      <div class="finish-row">
        <span class="muted small">${all?"Все ответы заполнены. Их ещё можно изменить.":"Кнопка станет доступна, когда будут заполнены все ${TOTAL} ответов."}</span>
        <button class="btn btn-primary" disabled=${!all} onClick=${()=>setConfirm(true)}>Завершить тест</button>
      </div>
    </div>
    ${confirm?html`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="cf-h"><div class="modal-box">
      <h2 id="cf-h">Завершить тест?</h2><p>После этого ответы проверятся и изменить их будет нельзя.</p>
      <div class="row2"><button class="btn btn-primary" onClick=${finish}>Завершить тест</button><button class="btn btn-ghost" onClick=${()=>setConfirm(false)}>Вернуться к ответам</button></div></div></div>`:null}
    <${History} hist=${T.history}/></div>`;
}

/* ---------------- header schema ---------------- */
function Schema({state}){
  const counts=[0,0,0,0]; WORDS.forEach(w=>counts[mastery(state.stats[w.id])]++);
  return html`<div class="schema" aria-label=${"Закреплено "+counts[3]+" из "+TOTAL+" слов"}>
    <div class="cells" aria-hidden="true">${WORDS.map(w=>html`<i key=${w.id} class=${"m"+mastery(state.stats[w.id])}></i>`)}</div>
    <div class="schema-l"><b>${counts[3]}</b> из ${TOTAL} закреплено<span class="muted">, ${counts[2]+counts[3]} знакомо</span></div>
  </div>`;
}

/* ---------------- app ---------------- */
function App(){
  const [state,setState]=useState(loadLocal);
  const [prefs,setPrefs]=useState(()=>{try{return Object.assign({sound:true},JSON.parse(localStorage.getItem(LS_PREF)||"{}"));}catch(e){return {sound:true};}});
  const [menu,setMenu]=useState(false); const [ask,setAsk]=useState(null); const [sync,setSync]=useState("local");
  const dbRef=useRef(null), saveT=useRef(null), writing=useRef(false), pending=useRef(null);
  const update=useCallback(fn=>setState(s=>{const n=JSON.parse(JSON.stringify(s));fn(n);n.updatedAt=Date.now();return n;}),[]);
  const sfx=useCallback(k=>{ if(prefs.sound) tone(SFX[k]); },[prefs.sound]);
  useEffect(()=>{ try{localStorage.setItem(LS_PREF,JSON.stringify(prefs));}catch(e){} },[prefs]);

  /* persistence: localStorage always; account storage when available */
  useEffect(()=>{ saveLocal(state);
    if(!dbRef.current||!state.updatedAt) return;
    clearTimeout(saveT.current);
    saveT.current=setTimeout(()=>flush(state),1200);
  },[state]);
  const flush=async s=>{ pending.current=s; if(writing.current) return; writing.current=true;
    while(pending.current){ const d=pending.current; pending.current=null;
      try{ await dbRef.current.set({json:JSON.stringify(d),updatedAt:d.updatedAt}); setSync("cloud"); }catch(e){ setSync("local"); } }
    writing.current=false; };
  useEffect(()=>{ let alive=true;
    (async()=>{ if(!window.claude||!window.claude.use) return;
      try{ const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]); if(!db||!user||!alive) return;
        const uid=await user.id(); if(!uid) return;
        const ref=db.doc("data/users/"+uid+"/trainer-"+SET.id);
        const snap=await ref.get(); dbRef.current=ref;
        if(snap.exists){ const d=snap.data(); const remote=sanitize(JSON.parse(d.json||"{}"));
          setState(cur=> (remote.updatedAt||0)>(cur.updatedAt||0)? remote : cur); }
        setSync("cloud");
        setState(cur=>{ if(cur.updatedAt) flush(cur); return cur; });
      }catch(e){ setSync("local"); } })();
    return ()=>{alive=false}; },[]);

  const tab=state.tab||1;
  const setTab=n=>update(s=>{s.tab=n;});
  const resetTraining=()=>update(s=>{const f=freshState();s.stats={};s.levels=f.levels;});
  const resetHistory=()=>update(s=>{s.test.history=[];});
  const props={state,update,sfx};
  const tabsRef=useRef(null);
  useEffect(()=>{ const el=tabsRef.current&&tabsRef.current.querySelector('[aria-selected="true"]'); if(el&&el.scrollIntoView) el.scrollIntoView({block:"nearest",inline:"nearest"}); },[tab]);
  const onTabKey=e=>{ if(e.key==="ArrowRight"||e.key==="ArrowLeft"){ e.preventDefault(); const n=((tab-1+(e.key==="ArrowRight"?1:-1)+7)%7)+1; setTab(n); setTimeout(()=>{const b=document.getElementById("tab-"+n); b&&b.focus();},0);} };

  return html`<div class="app">
    <header class="top">
      <div class="brand">
        <h1>Cognitive Vocabulary Trainer</h1>
        <p class="sub">${TOTAL} слов и выражений из статьи <span lang="en">“${SET.title}”</span></p>
      </div>
      <div class="top-r">
        ${tab!==7?html`<${Schema} state=${state}/>`:null}
        <button class="icon-btn" aria-pressed=${prefs.sound} aria-label=${prefs.sound?"Выключить звук":"Включить звук"} onClick=${()=>setPrefs(p=>Object.assign({},p,{sound:!p.sound}))}>
          ${prefs.sound?html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>`
            :html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 5M22 9l-5 5"/></svg>`}
        </button>
        <div class="menu-w">
          <button class="icon-btn" aria-haspopup="true" aria-expanded=${menu} aria-label="Настройки" onClick=${()=>setMenu(m=>!m)}><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
          ${menu?html`<div class="menu" role="menu">
            <p class="muted small">${sync==="cloud"?"Прогресс сохраняется в вашем аккаунте и в этом браузере.":"Прогресс сохраняется в этом браузере."}</p>
            <button role="menuitem" onClick=${()=>{setMenu(false);setAsk("train");}}>Сбросить тренировочный прогресс</button>
            <button role="menuitem" onClick=${()=>{setMenu(false);setAsk("hist");}}>Удалить историю итоговых тестов</button>
          </div>`:null}
        </div>
      </div>
    </header>
    <nav class="tabs" ref=${tabsRef} role="tablist" aria-label="Уровни" onKeyDown=${onTabKey}>
      ${LEVELS.map(l=>html`<button key=${l.n} id=${"tab-"+l.n} role="tab" aria-selected=${tab===l.n} aria-controls="panel" tabIndex=${tab===l.n?0:-1} class=${"tab"+(l.n===7?" tab-final":"")} onClick=${()=>setTab(l.n)}>
        <span class="tn">${l.n}</span><span class="tt">${l.title}</span>
        ${l.n<7?html`<span class="tp" aria-hidden="true"><i style=${{width:(state.levels[l.n].learned.length/TOTAL*100)+"%"}}></i></span>`:null}
      </button>`)}
    </nav>
    <main id="panel" role="tabpanel" aria-labelledby=${"tab-"+tab} class=${tab===7?"final-mode":""}>
      ${tab===1?html`<${Match} ...${props}/>`:null}
      ${tab===2?html`<${Choice} ...${props}/>`:null}
      ${tab===3?html`<${Cards} ...${props}/>`:null}
      ${tab===4?html`<${TypeLevel} key="l4" lv=${4} mode="cloze" ...${props}/>`:null}
      ${tab===5?html`<${TypeLevel} key="l5" lv=${5} mode="reverse" ...${props}/>`:null}
      ${tab===6?html`<${TrueFalse} ...${props}/>`:null}
      ${tab===7?html`<${Final} ...${props}/>`:null}
    </main>
    ${ask?html`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="rs-h"><div class="modal-box">
      <h2 id="rs-h">${ask==="train"?"Сбросить тренировочный прогресс?":"Удалить историю итоговых тестов?"}</h2>
      <p>${ask==="train"?"Статистика по словам и прогресс всех шести уровней будут удалены. История итоговых тестов сохранится.":"Все результаты итоговых тестов будут удалены. Тренировочный прогресс сохранится."}</p>
      <div class="row2"><button class="btn btn-bad" onClick=${()=>{ask==="train"?resetTraining():resetHistory();setAsk(null);}}>${ask==="train"?"Сбросить прогресс":"Удалить историю"}</button><button class="btn btn-ghost" onClick=${()=>setAsk(null)}>Отмена</button></div>
    </div></div>`:null}
  </div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
})();

</script>
</body>
</html>
