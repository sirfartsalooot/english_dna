<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Словарь · Building Effective Agents</title>
<meta name="theme-color" content="#F3F4F8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Словарь">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --surface2:#EEF0F5; --ink:#15171F; --muted:#6B7080; --line:#E3E5EC;
  --primary:#15171F; --primary-ink:#FFFFFF;
  --ok:#DDF3E6; --ok-ink:#1B6B42; --ok-line:#9CD8B6;
  --bad:#FCE1E1; --bad-ink:#A3313C; --bad-line:#F0A9AE;
  --c1:#CDCAF5; --c1i:#2E2A6E;
  --c2:#C4DCF1; --c2i:#1C3A57;
  --c3:#E5BEF2; --c3i:#4B1E5A;
  --c4:#F2C8D1; --c4i:#5E2434;
  --c5:#ECDDBF; --c5i:#4D3A16;
  --c6:#C8E8D7; --c6i:#1D4A35;
  --c7:#F3E3AE; --c7i:#3F3310;
  --ui:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --lex:"Newsreader",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0F1117; --surface:#1A1D26; --surface2:#242835; --ink:#EEF0F6; --muted:#9BA1B3; --line:#2D3241;
  --primary:#EEF0F6; --primary-ink:#0F1117;
  --ok:#173828; --ok-ink:#9FE0BC; --ok-line:#2C6A48; --bad:#45232A; --bad-ink:#F5B3B8; --bad-line:#7A3940;
  --c1:#34315F; --c1i:#DCD9FF; --c2:#22374B; --c2i:#CFE5F8; --c3:#45294F; --c3i:#F3D8FB;
  --c4:#4C2A33; --c4i:#FBD9E0; --c5:#433825; --c5i:#F3E6CB; --c6:#1F3D30; --c6i:#CDEFDD; --c7:#463C1C; --c7i:#F7EBC2;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit;margin:0}
button{cursor:pointer;border:none;background:none;padding:0;touch-action:manipulation;text-align:inherit;line-height:1.3}
button:disabled{cursor:default}
:focus{outline:none}
:focus-visible{outline:3px solid var(--c1i);outline-offset:2px}
h1,h2,h3,p{margin:0}
.en{font-family:var(--lex);font-weight:500}
.muted{color:var(--muted)}
.small{font-size:14.5px}
#root{height:100%}
.boot{height:100%;display:grid;place-items:center;color:var(--muted)}

/* ---------- shell ---------- */
.screen{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;position:relative}
.topbar{flex:none;display:grid;grid-template-columns:46px 1fr 46px;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 8px}
.tb-t{text-align:center;display:grid;line-height:1.2}
.tb-t b{font-size:17px;font-weight:600}
.tb-t span{font-size:13px;color:var(--muted)}
.ib{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.ib svg{width:21px;height:21px}
.ib:active{transform:scale(.94)}
.content{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:6px 16px 24px}
.footer{flex:none;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 12px);background:var(--bg);position:relative;display:grid;gap:10px}
.footer::before{content:"";position:absolute;left:0;right:0;top:-18px;height:18px;background:linear-gradient(to bottom,transparent,var(--bg));pointer-events:none}

/* ---------- buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:14px 20px;border-radius:18px;font-weight:600;font-size:16.5px;text-align:center;transition:transform .12s,opacity .2s,background .2s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.4}
.btn-dark{background:var(--primary);color:var(--primary-ink)}
.btn-light{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn-ok{background:var(--ok);color:var(--ok-ink)}
.btn-bad{background:var(--bad);color:var(--bad-ink)}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn svg{width:20px;height:20px;flex:none}

/* ---------- home ---------- */
.home-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 14px) 0 4px}
.home-head h1{font-family:var(--lex);font-weight:600;font-size:34px;line-height:1.05;letter-spacing:-.02em}
.home-head p{margin-top:6px;color:var(--muted);font-size:14.5px;max-width:240px;line-height:1.35}
.home-head .acts{display:flex;gap:8px}
.stat{margin-top:18px;background:var(--c2);color:var(--c2i);border-radius:28px;padding:20px}
.stat-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.stat-n{font-family:var(--lex);font-size:52px;font-weight:600;line-height:1;letter-spacing:-.02em}
.stat-n small{font-size:22px;font-weight:500;opacity:.6}
.stat-l{font-size:15px;font-weight:600}
.stat-sub{font-size:14px;opacity:.75;margin-top:4px}
.dots{display:flex;flex-wrap:wrap;gap:4px;margin-top:16px}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.55)}
:root[data-theme="dark"] .dots i{background:rgba(255,255,255,.1)}
.dots i.m1{background:rgba(28,58,87,.25)}
.dots i.m2{background:rgba(28,58,87,.55)}
.dots i.m3{background:var(--c2i)}
:root[data-theme="dark"] .dots i.m1{background:rgba(207,229,248,.3)}
:root[data-theme="dark"] .dots i.m2{background:rgba(207,229,248,.6)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:13px;opacity:.8}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.sec-h{font-family:var(--lex);font-size:24px;font-weight:600;margin:26px 2px 12px}
.lv-list{display:grid;gap:12px}
.lv-card{display:grid;grid-template-columns:76px 1fr;gap:14px;align-items:center;width:100%;border-radius:26px;padding:12px 16px 12px 12px;background:var(--c);color:var(--ci);text-align:left;transition:transform .12s}
.lv-card:active{transform:scale(.98)}
.lv-num{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.6);display:grid;place-items:center;font-family:var(--lex);font-size:36px;font-weight:600}
:root[data-theme="dark"] .lv-num{background:rgba(255,255,255,.08)}
.lv-card h3{font-size:18px;font-weight:700;line-height:1.2}
.lv-card p{font-size:14px;opacity:.8;margin-top:2px}
.lv-prog{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12.5px;font-weight:600}
.lv-prog .pb{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.55);overflow:hidden}
:root[data-theme="dark"] .lv-prog .pb{background:rgba(255,255,255,.1)}
.lv-prog .pb i{display:block;height:100%;background:currentColor;border-radius:3px}
.lv-card.final{background:var(--primary);color:var(--primary-ink);grid-template-columns:76px 1fr}
.lv-card.final .lv-num{background:var(--c7);color:#3F3310}
.foot-note{text-align:center;font-size:13px;color:var(--muted);margin:22px 0 4px}

.lv-1{--c:var(--c1);--ci:var(--c1i)} .lv-2{--c:var(--c2);--ci:var(--c2i)} .lv-3{--c:var(--c3);--ci:var(--c3i)}
.lv-4{--c:var(--c4);--ci:var(--c4i)} .lv-5{--c:var(--c5);--ci:var(--c5i)} .lv-6{--c:var(--c6);--ci:var(--c6i)} .lv-7{--c:var(--c7);--ci:var(--c7i)}

/* ---------- level ---------- */
.lvbar{display:grid;gap:12px;margin-bottom:14px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 16px;border-radius:999px;background:var(--surface2);color:var(--muted);font-size:14.5px;font-weight:500;white-space:nowrap;min-height:40px}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink)}
.chips.dir .chip{flex:1;text-align:center}
.learned{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted)}
.learned b{color:var(--ink)}
.pbar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ci);border-radius:3px;transition:width .4s}
.hint{color:var(--muted);font-size:15px;margin:0 2px 12px}

/* main colored card */
.wcard{position:relative;background:var(--c);color:var(--ci);border-radius:28px;padding:20px 20px 24px;margin-bottom:16px}
.wcard .cnt{font-size:14px;font-weight:600;opacity:.7;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
.wcard .cnt .pb{width:90px;height:5px;border-radius:3px;background:rgba(255,255,255,.5);overflow:hidden}
:root[data-theme="dark"] .wcard .cnt .pb{background:rgba(255,255,255,.1)}
.wcard .cnt .pb i{display:block;height:100%;background:currentColor}
.word{font-family:var(--lex);font-weight:500;font-size:clamp(34px,10vw,48px);line-height:1.05;letter-spacing:-.015em;overflow-wrap:anywhere;hyphens:auto}
.word.ru{font-family:var(--ui);font-weight:600;font-size:clamp(24px,7vw,32px);letter-spacing:-.01em;line-height:1.2}
.wcard .sub{margin-top:10px;font-size:15px;opacity:.8}
.ex{font-family:var(--lex);font-style:italic;font-size:17.5px;line-height:1.45}

/* stacked flashcard */
.stack{position:relative;margin:6px 10px 26px 0}
.stack::before,.stack::after{content:"";position:absolute;border-radius:28px;inset:0}
.stack::before{background:var(--c2);transform:translate(10px,10px)}
.stack::after{background:var(--primary);transform:translate(18px,18px);z-index:-1}
.stack .wcard{margin:0;z-index:1;min-height:250px;display:flex;flex-direction:column;width:100%;text-align:left}
.stack{z-index:0;isolation:isolate}
.stack .wcard .word{margin-top:auto}
.tap-hint svg{width:20px;height:20px;flex:none}
.tap-hint{padding-top:18px;font-size:14px;opacity:.7;display:flex;align-items:center;gap:6px}
.back{margin-top:18px;padding-top:16px;border-top:1.5px dashed currentColor;animation:pop .3s ease}
.back .answer{font-size:clamp(22px,6.5vw,28px);font-weight:600;line-height:1.25}
.back .answer.en{font-family:var(--lex);font-weight:500}
.back p{margin-top:10px}

/* tiles */
.tiles{display:grid;gap:10px}
.tile{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:12px 16px;border-radius:18px;background:var(--surface);border:1.5px solid var(--line);font-size:16px;line-height:1.3;text-align:left;transition:background .2s,border-color .2s,opacity .25s}
.tile .k{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13.5px;font-weight:600;color:var(--muted)}
.tile.good{background:var(--ok);border-color:var(--ok-line);color:var(--ok-ink)}
.tile.good .k{border-color:var(--ok-line);color:var(--ok-ink)}
.tile.badf{background:var(--bad);border-color:var(--bad-line);color:var(--bad-ink);animation:shake .3s}
.tile.faded{opacity:.4}

/* matching */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col{display:grid;gap:10px;align-content:start}
.pair{width:100%;min-height:62px;padding:10px 12px;border-radius:18px;background:var(--surface);border:1.5px solid var(--line);font-size:14.5px;line-height:1.25;text-align:center;overflow-wrap:anywhere;hyphens:auto;transition:background .2s,border-color .2s,opacity .3s,transform .12s}
.pair.en{font-family:var(--lex);font-size:18px;font-weight:500}
.pair:active:not(:disabled){transform:scale(.97)}
.pair.sel{background:var(--c);border-color:var(--ci);color:var(--ci)}
.pair.good{background:var(--ok);border-color:var(--ok-line);color:var(--ok-ink)}
.pair.badf{background:var(--bad);border-color:var(--bad-line);color:var(--bad-ink);animation:shake .3s}
.pair.matched{background:var(--ok);border-color:transparent;color:var(--ok-ink);opacity:.4}

/* cloze */
.cloze{font-family:var(--lex);font-size:clamp(21px,6vw,26px);line-height:1.5}
.gap{display:inline-flex;gap:6px;flex-wrap:wrap;vertical-align:baseline}
.gapw{display:inline-block;height:1.05em;border-bottom:2.5px solid currentColor;vertical-align:-.15em;max-width:100%}

/* claim */
.claim-eq{font-size:15px;opacity:.7;margin:12px 0 4px}
.claim-ru{font-size:clamp(21px,6vw,26px);font-weight:600;line-height:1.3}

/* input bar */
.inbar{display:grid;grid-template-columns:1fr auto;gap:8px}
.inbar input{width:100%;min-width:0;min-height:56px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);padding:12px 16px;font-family:var(--lex);font-size:21px;-webkit-appearance:none;appearance:none}
.inbar input:focus{border-color:var(--ink)}
.inbar input.ok{border-color:var(--ok-line);background:var(--ok);color:var(--ok-ink)}
.inbar input.bad{border-color:var(--bad-line);background:var(--bad);color:var(--bad-ink);text-decoration:line-through;text-decoration-thickness:1.5px}
.inbar .btn{min-width:56px;padding:0 18px}
.nav3{display:grid;grid-template-columns:56px 1fr 56px;gap:8px}
.nav3 .btn{padding:0;min-height:50px}
.nav3 .mid{font-size:15px;font-weight:600}

/* feedback */
.fb{border-radius:22px;padding:16px 18px;display:grid;gap:6px;animation:pop .25s ease;margin-bottom:12px}
.fb-ok{background:var(--ok);color:var(--ok-ink)}
.fb-bad{background:var(--bad);color:var(--bad-ink)}
.fb-h{font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px}
.fb-h svg{width:22px;height:22px;flex:none}
.fb-b{color:var(--ink);font-size:15.5px}
.fb-b p{margin-top:7px}
.extra p{margin-top:6px}
.extra .ex{font-size:16px;color:var(--muted)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:min(calc(100vw - 28px),490px);z-index:60;border-radius:20px;padding:14px 16px;box-shadow:0 12px 32px rgba(15,17,23,.22);animation:pop .2s ease;font-size:15px;line-height:1.35}
.toast b{display:flex;align-items:center;gap:8px;font-size:17px;margin-bottom:2px}
.toast b svg{width:20px;height:20px}

/* summary & results */
.sum{background:var(--surface);border-radius:28px;padding:22px 20px;margin-bottom:14px;border:1.5px solid var(--line)}
.sum h2{font-family:var(--lex);font-size:28px;font-weight:600;line-height:1.15;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.kpis>div{border-radius:18px;padding:12px;display:grid;gap:2px}
.kpis .v{font-family:var(--lex);font-size:28px;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums}
.kpis .l{font-size:12.5px;line-height:1.25;opacity:.8}
.k-ok{background:var(--ok);color:var(--ok-ink)} .k-bad{background:var(--bad);color:var(--bad-ink)} .k-n{background:var(--surface2)}
.replist{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.replist li{padding:10px 12px;border-radius:14px;background:var(--surface2);font-size:15px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:28px;padding:20px;margin-bottom:14px}
.card h3{font-family:var(--lex);font-size:22px;font-weight:600;margin-bottom:10px}
.intro{background:var(--primary);color:var(--primary-ink);border-radius:28px;padding:22px 20px;margin-bottom:14px;position:relative;overflow:hidden}
.intro h2{font-family:var(--lex);font-size:30px;font-weight:600;line-height:1.1;margin-bottom:12px}
.intro p{opacity:.85;font-size:15.5px;margin-top:8px}
.intro .ring{position:absolute;right:-60px;bottom:-80px;width:220px;height:220px;border-radius:50%;border:1.5px solid currentColor;opacity:.18}
.stats4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.stats4>div{background:var(--surface2);border-radius:18px;padding:12px;display:grid;gap:2px}
.sv{font-family:var(--lex);font-size:26px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.sl{font-size:12.5px;color:var(--muted);line-height:1.3}
.hist-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hist-top h3{margin:0}
.daysel select{border-radius:999px;border:1.5px solid var(--line);background:var(--surface2);padding:8px 14px;min-height:40px;max-width:200px}
table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
th{text-align:left;color:var(--muted);font-weight:500;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:9px 6px;border-bottom:1px solid var(--line)}
.test-meta{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin:0 2px 8px}
.win{position:relative;overflow:hidden;text-align:center;background:var(--c7);color:var(--c7i);border-radius:28px;padding:24px 20px;margin-bottom:14px}
.win h2{font-family:var(--lex);font-size:28px;font-weight:600;line-height:1.15;margin:10px 0 6px}
.badge{width:112px;height:112px;margin:0 auto;display:block}
.confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* sheets */
.sheet-bg{position:fixed;inset:0;z-index:80;background:rgba(10,12,18,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
.sheet{width:100%;max-width:520px;max-height:88%;overflow-y:auto;background:var(--surface);border-radius:28px 28px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom,0px) + 18px);animation:up .25s ease}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-family:var(--lex);font-size:26px;font-weight:600;line-height:1.15;margin-bottom:8px}
.sheet p{color:var(--muted);margin-bottom:16px}
.sheet .btn{width:100%}
.sheet .stack-btns{display:grid;gap:10px}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:58px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:16.5px;text-align:left}
.set-row.danger{color:var(--bad-ink)}
.set-row:last-child{border-bottom:none}
.sw{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.on{background:var(--ok-ink)}
.sw.on::after{transform:translateX(20px)}
.seg{display:inline-flex;background:var(--surface2);border-radius:999px;padding:3px}
.seg button{padding:7px 12px;border-radius:999px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;margin:6px 0 16px}
.cell{min-height:46px;border-radius:14px;border:1.5px solid var(--line);font-size:14px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.cell.filled{background:var(--c7);border-color:var(--c7);color:var(--c7i)}
.cell.cur{border-color:var(--ink);color:var(--ink);font-weight:700}

@keyframes pop{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.6}}

const norm = s => (s||"").toLowerCase().normalize("NFKC")
  .replace(/[\u2010-\u2015\u2212]/g,"-").replace(/[\u2018\u2019`´]/g,"'")
  .replace(/-/g," ").replace(/\s+/g," ").trim().replace(/[.!?,;:]+$/,"").trim();
const accepts = (list, input) => { const n = norm(input); return n.length>0 && list.some(a=>norm(a)===n); };
const clozeList = w => w.clozeAnswers || w.acceptedEnglishAnswers;
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const dayKey = ts => { const d=new Date(ts); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const fmtDT = ts => new Date(ts).toLocaleString("ru-RU",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"});
const fmtDayKey = k => { const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString("ru-RU",{weekday:"short",day:"numeric",month:"long"}); };
const plural=(n,a,b,c)=>{const m10=n%10,m100=n%100;return m10===1&&m100!==11?a:(m10>=2&&m10<=4&&(m100<12||m100>14)?b:c);};

function freshState(){ const levels={}; for(let i=1;i<=6;i++) levels[i]={learned:[],size:10,runs:0,session:null};
  return {v:1,updatedAt:0,stats:{},levels,test:{current:null,history:[]},tab:0}; }
function sanitize(s){ const f=freshState(); if(!s||typeof s!=="object") return f;
  const out=Object.assign(f,s); out.levels=Object.assign(freshState().levels,s.levels||{});
  out.test=Object.assign({current:null,history:[]},s.test||{}); out.stats=s.stats||{}; out.tab=0; return out; }
function loadLocal(){ try{ return sanitize(JSON.parse(localStorage.getItem(LS_KEY))); }catch(e){ return freshState(); } }

function pickWords(state, level, n){
  const learned=new Set(state.levels[level].learned);
  const keyed=WORDS.map(w=>{const st=state.stats[w.id]||{c:0,w:0};
    let wt=1+2.2*Math.min(st.w,5)+(learned.has(w.id)?0:1.2)-Math.min(st.c,5)*0.15; wt=Math.max(.3,wt);
    return {id:w.id,k:Math.pow(Math.random(),1/wt)};});
  keyed.sort((a,b)=>b.k-a.k); return keyed.slice(0,n).map(x=>x.id);
}
function distractors(target, n, field){
  const t=BY[target];
  const ok=w=>w.id!==target && !(t.group && w.group===t.group) && w[field]!==t[field];
  let pool=shuffle(WORDS.filter(w=>ok(w)&&w.category===t.category));
  if(pool.length<n) pool=pool.concat(shuffle(WORDS.filter(w=>ok(w)&&w.category!==t.category)));
  return pool.slice(0,n).map(w=>w.id);
}
function mastery(st){ if(!st) return 0; const m=st.c-st.w; if(m>=3) return 3; if(m>=1) return 2; return 1; }
function record(s, level, id, ok){ const st=s.stats[id]||(s.stats[id]={c:0,w:0}); if(ok) st.c++; else st.w++;
  if(ok && !s.levels[level].learned.includes(id)) s.levels[level].learned.push(id); }
function newQueueSession(s,lv,extra){ const ids=pickWords(s,lv,s.levels[lv].size);
  s.levels[lv].session=Object.assign({queue:ids,pos:0,correct:0,wrong:0,requeued:[],ans:null,done:false},extra?extra(ids):{}); s.levels[lv].runs++; }
function advance(s,lv){ const ss=s.levels[lv].session; ss.pos++; ss.ans=null; if(ss.pos>=ss.queue.length) ss.done=true; }
function answerQ(s,lv,id,ok,ans){ const ss=s.levels[lv].session; record(s,lv,id,ok); if(ok) ss.correct++; else { ss.wrong++;
  if(!ss.requeued.includes(id)){ ss.requeued.push(id); const at=Math.min(ss.queue.length, ss.pos+3+Math.floor(Math.random()*3)); ss.queue.splice(at,0,id); } }
  ss.ans=Object.assign({ok},ans); }

function unlockAudio(){ const c=audio(); if(!c) return; try{ const b=c.createBuffer(1,1,22050), s=c.createBufferSource(); s.buffer=b; s.connect(c.destination); s.start(0); }catch(e){} }
window.addEventListener("pointerdown",unlockAudio,{passive:true,capture:true});

function tone(seq){ const c=audio(); if(!c) return; try{ const t0=c.currentTime+.02;
  seq.forEach(([f,start,dur,vol,type,f2])=>{ const o=c.createOscillator(), g=c.createGain();
    o.type=type||"sine"; o.frequency.setValueAtTime(f,t0+start); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t0+start+dur);
    g.gain.setValueAtTime(.0001,t0+start); g.gain.linearRampToValueAtTime(vol||.2,t0+start+.012); g.gain.exponentialRampToValueAtTime(.0001,t0+start+dur);
    o.connect(g); g.connect(c.destination); o.start(t0+start); o.stop(t0+start+dur+.05); }); }catch(e){} }

/* ---------------- building blocks ---------------- */
function Screen({title,sub,onBack,right,footer,scrollKey,lv,children}){

  useEffect(()=>{ if(sc.current) sc.current.scrollTop=0; },[scrollKey]);
  return html`<div class=${"screen"+(lv?" lv-"+lv:"")}>
    ${title!=null?html`<header class="topbar">
      ${onBack?html`<button class="ib" onClick=${onBack} aria-label="Назад">${I.back}</button>`:html`<span></span>`}
      <div class="tb-t"><b>${title}</b>${sub?html`<span>${sub}</span>`:null}</div>
      ${right||html`<span></span>`}
    </header>`:null}
    <main class="content" ref=${sc}>${children}</main>
    ${footer?html`<footer class="footer">${footer}</footer>`:null}
  </div>`;
}
function Feedback({ok,title,children}){
  const ref=useRef(null);
  useEffect(()=>{ const t=setTimeout(()=>revealInScroller(ref.current),50); return ()=>clearTimeout(t); },[]);
  return html`<div ref=${ref} class=${"fb "+(ok?"fb-ok":"fb-bad")} role="status" aria-live="polite">
    <div class="fb-h">${ok?I.ok:I.bad}${title||(ok?"Правильно!":"Ошибка")}</div>
    ${children?html`<div class="fb-b">${children}</div>`:null}

}
function LevelBar({level,state,update,extra}){

const summaryFooter = (again,home) => html`<button class="btn btn-dark" onClick=${again}>Ещё одна тренировка</button><button class="btn btn-light" onClick=${home}>К этапам</button>`;

/* ---------------- Level 1: matching ---------------- */
function buildSets(ids){
  const sets=[]; const rest=ids.slice();
  while(rest.length){ const size=rest.length<=8?rest.length:6; const set=[];
    for(let i=0;i<rest.length&&set.length<size;){ const w=BY[rest[i]];
      if(!w.group||!set.some(x=>BY[x].group===w.group)){ set.push(rest[i]); rest.splice(i,1);} else i++; }
    if(!set.length) set.push(rest.shift());
    sets.push({ids:set,ru:shuffle(set),matched:[]}); }
  return sets;
}
function Match({state,update,sfx,goHome}){
  const lv=1, L=state.levels[lv], S=L.session;
  const start=()=>update(s=>{const ids=pickWords(s,lv,s.levels[lv].size);s.levels[lv].session={sets:buildSets(ids),idx:0,correct:0,wrong:0,done:false};s.levels[lv].runs++;});
  useEffect(()=>{ if(!L.session) start(); },[L.session]);
  return html`<${Screen} lv=${lv} title="Найди пару" sub="Этап 1" onBack=${goHome} right=${restartBtn(start)} scrollKey=${S?S.idx+":"+L.runs:0}
      footer=${S&&S.done?summaryFooter(start,goHome):null}>
    <${LevelBar} level=${lv} state=${state} update=${update}/>
    ${!S?null:S.done?html`<${SummaryCard} sess=${S} sfx=${sfx}/>`:html`<${MatchSet} key=${S.idx+":"+L.runs} S=${S} update=${update} sfx=${sfx}/>`}
  </${Screen}>`;
}
function MatchSet({S,update,sfx}){
  const lv=1, set=S.sets[S.idx];
  const [sel,setSel]=useState({en:null,ru:null}); const [flash,setFlash]=useState(null); const [msg,setMsg]=useState(null);
  const setDone=set.matched.length===set.ids.length;
  useEffect(()=>{ if(setDone&&!S.done){ const t=setTimeout(()=>update(s=>{s.levels[lv].session.idx++;}),1300); return ()=>clearTimeout(t);} },[setDone,S.done]);
  useEffect(()=>{ if(!msg) return; const t=setTimeout(()=>setMsg(null),msg.ok?1100:3200); return ()=>clearTimeout(t); },[msg]);
  const trySel=(side,id)=>{
    if(set.matched.includes(id)) return;
    const next=Object.assign({},sel,{[side]:sel[side]===id?null:id});
    if(next.en!=null&&next.ru!=null){
      const ok=next.en===next.ru, en=next.en, completes=ok&&set.matched.length+1===set.ids.length;
      setFlash({en:next.en,ru:next.ru,ok}); sfx(ok?(completes?"set":"ok"):"bad"); setMsg({ok,en,k:Date.now(),completes});
      setTimeout(()=>setFlash(null),650); setSel({en:null,ru:null});
      update(s=>{const ss=s.levels[lv].session, st=ss.sets[ss.idx]; record(s,lv,en,ok);
        if(ok){ss.correct++; st.matched.push(en); if(st.matched.length===st.ids.length && ss.idx===ss.sets.length-1) ss.done=true;}
        else ss.wrong++;});
    } else { sfx("tap"); setSel(next); }
  };
  const cls=(side,id)=>{ let c="pair"; if(set.matched.includes(id)) c+=" matched"; if(sel[side]===id) c+=" sel";
    if(flash&&flash[side]===id) c+=flash.ok?" good":" badf"; return c; };
  return html`<div>
    <div class="test-meta"><span>Набор ${S.idx+1} из ${S.sets.length}</span><span>${set.matched.length} / ${set.ids.length} пар</span></div>
    <p class="hint">Нажмите английское слово, а затем его перевод.</p>
    <div class="match">
      <div class="col" role="group" aria-label="Английские слова">${set.ids.map(id=>html`<button key=${"e"+id} class=${cls("en",id)+" en"} lang="en" disabled=${set.matched.includes(id)} aria-pressed=${sel.en===id} onClick=${()=>trySel("en",id)}>${BY[id].english}</button>`)}</div>
      <div class="col" role="group" aria-label="Переводы">${set.ru.map(id=>html`<button key=${"r"+id} class=${cls("ru",id)} lang="ru" disabled=${set.matched.includes(id)} aria-pressed=${sel.ru===id} onClick=${()=>trySel("ru",id)}>${BY[id].russian}</button>`)}</div>
    </div>
    ${msg?html`<div key=${msg.k} class=${"toast "+(msg.ok?"fb-ok":"fb-bad")} role="status" aria-live="polite">
      <b>${msg.ok?I.ok:I.bad}${msg.ok?(msg.completes?"Набор собран!":"Правильно!"):"Ошибка"}</b>
      ${!msg.ok?html`<span style=${{color:"var(--ink)"}}><span lang="en" class="en">${BY[msg.en].english}</span> означает «${BY[msg.en].russian}».</span>`
        :msg.completes?html`<span>${S.idx<S.sets.length-1||!S.done?"Переходим к следующему набору.":""}</span>`:null}
    </div>`:null}
  </div>`;
}

/* ---------------- Level 2: choice ---------------- */
function Choice({state,update,sfx,goHome}){
  const lv=2, L=state.levels[lv], S=L.session;
  const start=()=>update(s=>newQueueSession(s,lv,()=>({opts:{}})));
  useEffect(()=>{ if(!L.session) start(); },[L.session]);
  const id=S&&!S.done?S.queue[S.pos]:null, w=id!=null?BY[id]:null;
  useEffect(()=>{ if(S&&!S.done&&!S.opts[S.pos]) update(s=>{const ss=s.levels[lv].session; ss.opts[ss.pos]=shuffle([id].concat(distractors(id,3,"russian")));}); },[S&&S.pos,S&&S.done,L.runs]);
  const o=S&&S.opts?S.opts[S.pos]||[]:[];
  const choose=c=>{ if(S.ans) return; const ok=c===id; sfx(ok?"ok":"bad"); update(s=>answerQ(s,lv,id,ok,{choice:c})); };
  const next=()=>update(s=>advance(s,lv));
  useEffect(()=>{ const k=e=>{ if(!S||S.done) return; if(S.ans){ if(e.key==="Enter"){e.preventDefault();next();} return; }
      const n=parseInt(e.key,10); if(n>=1&&n<=4&&o[n-1]!=null) choose(o[n-1]); };
    window.addEventListener("keydown",k); return ()=>window.removeEventListener("keydown",k); });
  const footer = !S?null : S.done? summaryFooter(start,goHome) : S.ans? html`<button class="btn btn-dark" onClick=${next}>Дальше</button>` : null;
  return html`<${Screen} lv=${lv} title="Выбери перевод" sub="Этап 2" onBack=${goHome} right=${restartBtn(start)} scrollKey=${S?S.pos+":"+L.runs+":"+S.done:0} footer=${footer}>
    <${LevelBar} level=${lv} state=${state} update=${update}/>
    ${!S?null:S.done?html`<${SummaryCard} sess=${S} sfx=${sfx}/>`:html`<div>
      <div class="wcard"><${Count} pos=${S.pos} len=${S.queue.length}/><div class="word" lang="en">${w.english}</div></div>
      <div class="tiles" role="group" aria-label="Варианты перевода">
        ${o.map((c,i)=>{ let cl="tile"; if(S.ans){ if(c===id) cl+=" good"; else if(c===S.ans.choice) cl+=" badf"; else cl+=" faded"; }
          return html`<button key=${c} class=${cl} disabled=${!!S.ans} onClick=${()=>choose(c)}><span class="k" aria-hidden="true">${i+1}</span>${BY[c].russian}</button>`; })}
      </div>
      ${S.ans?html`<div style=${{marginTop:"14px"}}><${Feedback} key=${"f"+S.pos} ok=${S.ans.ok}>
        ${S.ans.ok?html`<span class="ex" lang="en">${plainSentence(w)}</span><${Extra} w=${w}/>`:html`<span><span lang="en" class="en">${w.english}</span> означает «${w.russian}».<p><span class="ex" lang="en">${plainSentence(w)}</span></p><${Extra} w=${w}/></span>`}
      </${Feedback}></div>`:null}
    </div>`}
  </${Screen}>`;
}

/* ---------------- Level 3: cards ---------------- */
function Cards({state,update,sfx,goHome}){
  const lv=3, L=state.levels[lv], S=L.session;
  const start=()=>update(s=>{const dir=(s.levels[lv].session&&s.levels[lv].session.dir)||"en";newQueueSession(s,lv,()=>({dir,revealed:false,repeat:[]}));});
  useEffect(()=>{ if(!L.session) start(); },[L.session]);
  if(!S) return html`<${Screen} lv=${lv} title="Вспомни перевод" onBack=${goHome}/>`;
  const setDir=d=>update(s=>{s.levels[lv].session.dir=d;s.levels[lv].session.revealed=false;});
  const extra=html`<button class="chip" aria-pressed=${S.dir==="en"} onClick=${()=>setDir("en")}>EN → RU</button><button class="chip" aria-pressed=${S.dir==="ru"} onClick=${()=>setDir("ru")}>RU → EN</button>`;
  const head=html`<${LevelBar} level=${lv} state=${state} update=${update} extra=${extra}/>`;
  if(S.done) return html`<${Screen} lv=${lv} title="Вспомни перевод" sub="Этап 3" onBack=${goHome} right=${restartBtn(start)} scrollKey=${"d"+L.runs} footer=${summaryFooter(start,goHome)}>
    ${head}<${SummaryCard} sess=${S} sfx=${sfx}/>
    ${S.repeat.length?html`<div class="card"><h3>Повторить эти слова</h3><ul class="replist">${S.repeat.map(i=>html`<li key=${i}><span lang="en" class="en">${BY[i].english}</span> — ${BY[i].russian}</li>`)}</ul></div>`:null}
  </${Screen}>`;
  const id=S.queue[S.pos], w=BY[id];
  const front = S.dir==="en"? html`<div class="word" lang="en">${w.english}</div>` : html`<div class="word ru">${w.russian}</div>`;
  const back = S.dir==="en"? html`<div class="answer">${w.russian}</div>` : html`<div class="answer en" lang="en">${w.english}</div>`;
  const reveal=()=>{ if(S.revealed) return; sfx("tap"); update(s=>{s.levels[lv].session.revealed=true;}); };
  const mark=ok=>{ sfx(ok?"ok":"bad"); update(s=>{const ss=s.levels[lv].session; answerQ(s,lv,id,ok,{}); if(!ok&&!ss.repeat.includes(id)) ss.repeat.push(id); advance(s,lv); ss.revealed=false;}); };
  const footer = !S.revealed? html`<button class="btn btn-dark" onClick=${reveal}>Показать перевод</button>`
    : html`<div class="btn-row"><button class="btn btn-bad" onClick=${()=>mark(false)}>Не вспомнила</button><button class="btn btn-ok" onClick=${()=>mark(true)}>Вспомнила</button></div>`;
  return html`<${Screen} lv=${lv} title="Вспомни перевод" sub="Этап 3" onBack=${goHome} right=${restartBtn(start)} scrollKey=${S.pos+":"+L.runs} footer=${footer}>
    ${head}
    <div class="stack">
      ${S.revealed? html`<div class="wcard"><${Count} pos=${S.pos} len=${S.queue.length}/>${front}
          <div class="back">${back}<p class="ex" lang="en">${plainSentence(w)}</p><p class="small" style=${{opacity:.8}}>${w.exampleTranslation}</p><${Extra} w=${w}/></div></div>`
        : html`<button class="wcard" onClick=${reveal} aria-label="Показать перевод"><${Count} pos=${S.pos} len=${S.queue.length}/>${front}<span class="tap-hint">${I.tap}Вспомните перевод и нажмите на карточку</span></button>`}
    </div>
    ${S.repeat.length?html`<p class="muted small" style=${{textAlign:"center"}}>Для повторения: ${S.repeat.length}</p>`:null}
  </${Screen}>`;
}

/* ---------------- Levels 4 & 5: typing ---------------- */
function TypeLevel({lv,mode,state,update,sfx,goHome}){
  const L=state.levels[lv], S=L.session;
  const start=()=>update(s=>newQueueSession(s,lv));
  useEffect(()=>{ if(!L.session) start(); },[L.session]);
  const [val,setVal]=useState(""); const inp=useRef(null);
  useEffect(()=>{ setVal(""); if(inp.current&&acted&&finePointer()) inp.current.focus({preventScroll:true}); },[S&&S.pos,S&&S.done,L.runs]);
  const title = mode==="cloze"?"Заполни пропуск":"Переведи наоборот";
  if(!S) return html`<${Screen} lv=${lv} title=${title} onBack=${goHome}/>`;
  const head=html`<${LevelBar} level=${lv} state=${state} update=${update}/>`;
  if(S.done) return html`<${Screen} lv=${lv} title=${title} sub=${"Этап "+lv} onBack=${goHome} right=${restartBtn(start)} scrollKey=${"d"+L.runs} footer=${summaryFooter(start,goHome)}>${head}<${SummaryCard} sess=${S} sfx=${sfx}/></${Screen}>`;
  const id=S.queue[S.pos], w=BY[id];
  const list = mode==="cloze"? clozeList(w) : w.acceptedEnglishAnswers;
  const submit=e=>{ e&&e.preventDefault();
    if(S.ans){ update(s=>advance(s,lv)); return; }
    if(!val.trim()) return; const ok=accepts(list,val); sfx(ok?"ok":"bad"); update(s=>answerQ(s,lv,id,ok,{given:val})); };
  let prompt;
  if(mode==="cloze"){
    const parts=w.exampleSentence.split(/\[\[(.+?)\]\]/);
    prompt=html`<p class="cloze" lang="en">${parts.map((p,i)=> i%2? html`<span key=${i} class="gap">${p.split(" ").map((x,j)=>html`<span key=${j} class="gapw" style=${{width:Math.max(2.5,x.length*.6)+"em"}}></span>`)}</span>` : p)}</p>
      <p class="sub">Значение: «${w.russian}»</p>`;
  } else prompt=html`<div class="word ru">${cap(w.testPrompt)}</div><p class="sub">Напишите по-английски</p>`;
  const footer=html`<form class="inbar" onSubmit=${submit} autocomplete="off">
    <input ref=${inp} lang="en" class=${S.ans?(S.ans.ok?"ok":"bad"):""} value=${S.ans?S.ans.given:val} readOnly=${!!S.ans} onChange=${e=>{ if(!S.ans) setVal(e.target.value); }}
      placeholder="Ответ на английском" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint=${S.ans?"next":"done"} aria-label="Ответ"/>
    <button class="btn btn-dark" type="submit" onMouseDown=${keepFocus} disabled=${!S.ans&&!val.trim()}>${S.ans?"Дальше":"Проверить"}</button>
  </form>`;
  return html`<${Screen} lv=${lv} title=${title} sub=${"Этап "+lv} onBack=${goHome} right=${restartBtn(start)} scrollKey=${S.pos+":"+L.runs} footer=${footer}>
    ${head}
    <div class="wcard"><${Count} pos=${S.pos} len=${S.queue.length}/>${prompt}</div>
    ${S.ans?html`<${Feedback} key=${"f"+S.pos} ok=${S.ans.ok}>
      ${mode==="cloze"?html`<span>${!S.ans.ok?html`<span>Правильно: <b lang="en" class="en">${clozeList(w)[0]}</b></span>`:null}<p><span class="ex" lang="en">${plainSentence(w)}</span></p><p class="muted">${w.exampleTranslation}</p><${Extra} w=${w}/>${!S.ans.ok?html`<p class="muted">Это слово встретится ещё раз в этой тренировке.</p>`:null}</span>`
        :html`<span>Правильно: <b lang="en" class="en">${w.english}</b>${w.acceptedEnglishAnswers.length>1?html` <span class="muted">(принимается также: ${w.acceptedEnglishAnswers.filter(a=>norm(a)!==norm(w.english)).join(", ")})</span>`:null}${!S.ans.ok?html`<p class="muted">Это слово встретится ещё раз в этой тренировке.</p>`:null}</span>`}
    </${Feedback}>`:null}
  </${Screen}>`;
}

/* ---------------- Level 6: true/false ---------------- */
function TrueFalse({state,update,sfx,goHome}){
  const lv=6, L=state.levels[lv], S=L.session;
  const start=()=>update(s=>newQueueSession(s,lv,ids=>{const t={};const half=shuffle(ids).slice(0,Math.ceil(ids.length/2));ids.forEach(i=>t[i]=half.includes(i));return {truth:t};}));
  useEffect(()=>{ if(!L.session) start(); },[L.session]);
  const fallback=useRef({});
  if(!S) return html`<${Screen} lv=${lv} title="Найди ошибку" onBack=${goHome}/>`;
  const head=html`<${LevelBar} level=${lv} state=${state} update=${update}/>`;
  if(S.done) return html`<${Screen} lv=${lv} title="Найди ошибку" sub="Этап 6" onBack=${goHome} right=${restartBtn(start)} scrollKey=${"d"+L.runs} footer=${summaryFooter(start,goHome)}>${head}<${SummaryCard} sess=${S} sfx=${sfx}/></${Screen}>`;
  const id=S.queue[S.pos], w=BY[id];
  let isTrue=S.truth[id];
  if(isTrue===undefined){ const fk=S.pos+":"+id; if(fallback.current[fk]===undefined) fallback.current[fk]=Math.random()<.5; isTrue=fallback.current[fk]; }
  const shown=isTrue? w.russian : w.wrongRussian;
  const pick=v=>{ if(S.ans) return; const ok=v===isTrue; sfx(ok?"ok":"bad"); update(s=>{ answerQ(s,lv,id,ok,{v,isTrue,shown}); const ss=s.levels[lv].session; if(ss.truth[id]!==undefined && ss.requeued.includes(id)) ss.truth[id]=!ss.truth[id]; }); };
  const disp=S.ans? S.ans.shown : shown, truthNow=S.ans? S.ans.isTrue : isTrue;
  const footer = S.ans? html`<button class="btn btn-dark" onClick=${()=>update(s=>advance(s,lv))}>Дальше</button>`
    : html`<div class="btn-row"><button class="btn btn-bad" onClick=${()=>pick(false)}>${I.bad}Неверно</button><button class="btn btn-ok" onClick=${()=>pick(true)}>${I.ok}Верно</button></div>`;
  return html`<${Screen} lv=${lv} title="Найди ошибку" sub="Этап 6" onBack=${goHome} right=${restartBtn(start)} scrollKey=${S.pos+":"+L.runs} footer=${footer}>
    ${head}
    <div class="wcard"><${Count} pos=${S.pos} len=${S.queue.length}/>
      <div class="word" lang="en">${w.english}</div>
      <p class="claim-eq">означает</p>
      <div class="claim-ru">«${disp}»</div>
    </div>
    <p class="hint" style=${{textAlign:"center"}}>Верен ли перевод?</p>
    ${S.ans?html`<${Feedback} key=${"f"+S.pos} ok=${S.ans.ok}>
      ${truthNow?html`<span>Перевод верный: «${w.russian}».</span>`:html`<span>Перевод неверный. Правильно: <b>«${w.russian}»</b>.</span>`}
    </${Feedback}>`:null}
  </${Screen}>`;
}

/* ---------------- Level 7: final test ---------------- */
function Confetti(){
  const ref=useRef(null);
  useEffect(()=>{ if(reduced()) return;
    const c=ref.current,x=c.getContext("2d"),dpr=window.devicePixelRatio||1; const W=c.width=c.offsetWidth*dpr, H=c.height=c.offsetHeight*dpr;
    const cols=["#7C89F0","#9DDBB7","#E5BEF2","#F2A9B6","#C4DCF1","#15171F"];
    const P=Array.from({length:120},()=>({x:Math.random()*W,y:-Math.random()*H*.6,vx:(Math.random()-.5)*2*dpr,vy:(2+Math.random()*3)*dpr,r:(4+Math.random()*5)*dpr,a:Math.random()*6,va:(Math.random()-.5)*.25,c:cols[Math.floor(Math.random()*cols.length)]}));
    let raf,t0=performance.now();
    const step=t=>{x.clearRect(0,0,W,H);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore();});
      if(t-t0<4200) raf=requestAnimationFrame(step); else x.clearRect(0,0,W,H);};
    raf=requestAnimationFrame(step); return ()=>cancelAnimationFrame(raf); },[]);
  return html`<canvas ref=${ref} class="confetti" aria-hidden="true"></canvas>`;
}
const Badge = () => html`<svg class="badge" viewBox="0 0 120 120" aria-hidden="true">
  <circle cx="60" cy="60" r="56" fill="#15171F"/><circle cx="60" cy="60" r="46" fill="none" stroke="#F3E3AE" stroke-width="1.5" stroke-dasharray="3 5"/>
  <text x="60" y="60" text-anchor="middle" font-family="Newsreader, Georgia, serif" font-size="27" font-weight="600" fill="#F3E3AE">${TOTAL}/${TOTAL}</text>
  <text x="60" y="80" text-anchor="middle" font-family="Onest, sans-serif" font-size="11" fill="#F3E3AE">все слова</text></svg>`;
function History({hist}){
  const days=useMemo(()=>{const m={};hist.forEach(h=>{const k=dayKey(h.ts);(m[k]=m[k]||[]).push(h);});return m;},[hist]);
  const keys=Object.keys(days).sort().reverse(); const today=dayKey(Date.now());
  const [day,setDay]=useState(today);
  const list=(days[day]||[]).slice().sort((a,b)=>a.ts-b.ts);
  const best=list.length?Math.max(...list.map(h=>h.score)):null;
  const avg=list.length?(list.reduce((a,h)=>a+h.score,0)/list.length):null;
  const perfect=hist.filter(h=>h.score===h.total); const lastPerfect=perfect.length?Math.max(...perfect.map(h=>h.ts)):null;
  const perfectDays=new Set(perfect.map(h=>dayKey(h.ts))).size;
  const opts=keys.includes(today)?keys:[today].concat(keys);
  return html`<section class="card">
    <div class="hist-top"><h3>Мои результаты</h3>
      <label class="daysel"><select value=${day} onChange=${e=>setDay(e.target.value)} aria-label="День">${opts.map(k=>html`<option key=${k} value=${k}>${k===today?"Сегодня":fmtDayKey(k)}</option>`)}</select></label></div>
    <div class="stats4">
      <div><span class="sv">${best!=null?best+"/"+TOTAL:"—"}</span><span class="sl">лучший результат дня</span></div>
      <div><span class="sv">${list.length}</span><span class="sl">${plural(list.length,"попытка","попытки","попыток")} за день</span></div>
      <div><span class="sv">${avg!=null?avg.toFixed(1).replace(".",","):"—"}</span><span class="sl">средний балл</span></div>
      <div><span class="sv">${perfectDays}</span><span class="sl">${plural(perfectDays,"день","дня","дней")} с ${TOTAL}/${TOTAL}</span></div>
    </div>
    <p class="muted small">Последнее идеальное прохождение: ${lastPerfect?fmtDT(lastPerfect):"пока не было"}.</p>
    ${list.length?html`<div style=${{overflowX:"auto",marginTop:"8px"}}><table><thead><tr><th>№</th><th>Время</th><th>Результат</th><th>Ошибки</th></tr></thead>
      <tbody>${list.map((h,i)=>html`<tr key=${h.ts}><td>${i+1}</td><td>${new Date(h.ts).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})}</td><td><b>${h.score}/${h.total}</b></td><td>${h.total-h.score}</td></tr>`)}</tbody></table></div>`
      :html`<p class="muted small" style=${{marginTop:"6px"}}>В этот день завершённых попыток нет.</p>`}
  </section>`;
}
function Final({state,update,sfx,goHome,openSheet}){
  const T=state.test, cur=T.current;
  const [result,setResult]=useState(null);
  const inp=useRef(null);
  const begin=()=>{ setResult(null); sfx("tap"); update(s=>{s.test.current={order:shuffle(WORDS.map(w=>w.id)),answers:{},idx:0,startedAt:Date.now()};}); };
  useEffect(()=>{ if(inp.current&&acted&&finePointer()) inp.current.focus({preventScroll:true}); },[cur&&cur.idx]);
  if(result){
    const perfect=result.score===result.total;
    return html`<${Screen} lv=${7} title="Итоговая проверка" onBack=${goHome} scrollKey=${"r"+result.ts} footer=${html`<button class="btn btn-dark" onClick=${begin}>Пройти ещё раз</button>`}>
      ${perfect?html`<div class="win"><${Confetti}/><${Badge}/><h2>Идеальный результат! Ты знаешь все слова!</h2><p class="small" style=${{opacity:.75}}>${fmtDT(result.ts)}</p></div>`
      :html`<div class="sum" role="status"><h2>Тест завершён</h2>
        <div class="kpis"><div class="k-ok"><span class="v">${result.score}</span><span class="l">из ${result.total} верно</span></div>
          <div class="k-bad"><span class="v">${result.total-result.score}</span><span class="l">${plural(result.total-result.score,"ошибка","ошибки","ошибок")}</span></div>
          <div class="k-n"><span class="v">${Math.round(result.score/result.total*100)}%</span><span class="l">результат</span></div></div>
        <p class="muted small">${fmtDT(result.ts)}</p></div>
        ${result.wrong.length?html`<div class="card"><h3>Ошибки</h3><ul class="replist">${result.wrong.map(r=>html`<li key=${r.id}>${BY[r.id].testPrompt} — <b lang="en" class="en">${BY[r.id].english}</b>${r.given?html`<br/><span class="muted small">ваш ответ: <s>${r.given}</s></span>`:null}</li>`)}</ul></div>`:null}`}
      <${History} hist=${T.history}/>
    </${Screen}>`;
  }
  if(!cur) return html`<${Screen} lv=${7} title="Итоговая проверка" onBack=${goHome} scrollKey="intro" footer=${html`<button class="btn btn-dark" onClick=${begin}>Начать тест</button>`}>
    <div class="intro"><span class="ring"></span>
      <h2>${TOTAL} слов — одна попытка</h2>
      <p>По русскому значению напишите английское слово или выражение. Каждое слово встретится один раз.</p>
      <p>Правильность во время теста не показывается. Между заданиями можно свободно переходить и менять ответы.</p>
      <p>Если закрыть приложение, ответы сохранятся.</p>
    </div>
    <${History} hist=${T.history}/>
  </${Screen}>`;
  const id=cur.order[cur.idx], w=BY[id], n=cur.order.length;
  const isFilled=i=>!!(cur.answers[i]||"").trim();
  const filled=cur.order.filter(isFilled).length, all=filled===n;
  const setAns=v=>update(s=>{s.test.current.answers[id]=v;});
  const go=i=>update(s=>{s.test.current.idx=Math.max(0,Math.min(n-1,i));});
  const nextEmpty=()=>{ for(let k=1;k<=n;k++){ const j=(cur.idx+k)%n; if(!isFilled(cur.order[j])) return j; } return -1; };
  const finish=()=>{ let score=0; const wrong=[];
    cur.order.forEach(i=>{ if(accepts(BY[i].acceptedEnglishAnswers,cur.answers[i])) score++; else wrong.push({id:i,given:(cur.answers[i]||"").trim()}); });
    const r={ts:Date.now(),score,total:n}; openSheet(null); setResult(Object.assign({wrong},r)); sfx(score===n?"done":"finish");
    update(s=>{s.test.history.push(r);s.test.current=null;}); };
  const onSubmit=e=>{ e.preventDefault(); if(cur.idx<n-1) go(cur.idx+1); else { const f=nextEmpty(); if(f>=0) go(f); } };
  const ne=nextEmpty();
  const footer=html`<form class="inbar" style=${{gridTemplateColumns:"1fr"}} onSubmit=${onSubmit} autocomplete="off">
      <input ref=${inp} lang="en" value=${cur.answers[id]||""} onChange=${e=>setAns(e.target.value)} placeholder="Английское слово или выражение"
        autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="next" aria-label=${"Ответ на задание "+(cur.idx+1)}/>
    </form>
    <div class="nav3">
      <button class="btn btn-light" onMouseDown=${keepFocus} disabled=${cur.idx===0} onClick=${()=>go(cur.idx-1)} aria-label="Предыдущее задание">${I.left}</button>
      <button class="btn btn-light mid" onClick=${()=>openSheet({kind:"grid",finish,go})}>${I.grid}${filled} / ${n} заполнено</button>
      <button class="btn btn-light" onMouseDown=${keepFocus} disabled=${cur.idx===n-1} onClick=${()=>go(cur.idx+1)} aria-label="Следующее задание">${I.right}</button>
    </div>`;
  return html`<${Screen} lv=${7} title="Итоговая проверка" sub=${"Задание "+(cur.idx+1)+" из "+n} onBack=${goHome}
      right=${html`<button class="ib" onClick=${()=>openSheet({kind:"grid",finish,go})} aria-label="Все задания">${I.grid}</button>`} scrollKey=${cur.idx} footer=${footer}>
    <div class="learned" style=${{marginBottom:"12px"}}><span>Заполнено <b>${filled}</b> из ${n}</span><span class="pbar"><i style=${{width:(filled/n*100)+"%"}}></i></span></div>
    <div class="wcard"><div class="cnt"><span>${cur.idx+1} / ${n}</span></div><div class="word ru">${cap(w.testPrompt)}</div><p class="sub">Напишите по-английски</p></div>
    ${ne>=0&&ne!==cur.idx&&ne!==cur.idx+1?html`<button class="btn btn-light" style=${{width:"100%",minHeight:"48px",fontSize:"15px",marginBottom:"10px"}} onMouseDown=${keepFocus} onClick=${()=>go(ne)}>К следующему пустому — № ${ne+1}</button>`:null}
    ${all?html`<button class="btn btn-dark" style=${{width:"100%"}} onClick=${()=>openSheet({kind:"confirm",finish})}>Завершить тест</button>`
      :html`<p class="muted small" style=${{textAlign:"center"}}>Завершить тест можно, когда будут заполнены все ${n} ответов.</p>`}
  </${Screen}>`;
}

      <button class="lv-card final" onClick=${()=>openLevel(7)}>
        <span class="lv-num">7</span>
        <span><h3>Итоговая проверка</h3><p>${cur?"Тест продолжается: заполнено "+cur.order.filter(i=>(cur.answers[i]||"").trim()).length+" из "+TOTAL:LEVELS[6].desc}</p>
          <span class="lv-prog">${best!=null?"Лучший результат: "+best+"/"+TOTAL:"Попыток пока не было"}</span></span>
      </button>
    </div>
    <p class="foot-note">Прогресс сохраняется на этом устройстве</p>
  </${Screen}>`;
}

/* ---------------- Sheets ---------------- */
function Sheet({onClose,children,label}){
  return html`<div class="sheet-bg" onClick=${e=>{ if(e.target===e.currentTarget) onClose(); }}>
    <div class="sheet" role="dialog" aria-modal="true" aria-label=${label}><div class="grab"></div>${children}</div></div>`;
}
function Sheets({sheet,close,state,prefs,setPref,update,openSheet}){
  if(!sheet) return null;
  if(sheet.kind==="settings") return html`<${Sheet} onClose=${close} label="Настройки">
    <h2>Настройки</h2>
    <button class="set-row" onClick=${()=>setPref("sound",!prefs.sound,true)}><span>Звук ответов</span><span class=${"sw"+(prefs.sound?" on":"")}></span></button>
    ${navigator.vibrate?html`<button class="set-row" onClick=${()=>{ const on=!prefs.vibro; setPref("vibro",on); if(on) try{navigator.vibrate(30);}catch(e){} }}><span>Вибрация</span><span class=${"sw"+(prefs.vibro?" on":"")}></span></button>`:null}
    <div class="set-row"><span>Тема</span><div class="seg">${[["light","Светлая"],["dark","Тёмная"],["auto","Авто"]].map(([k,l])=>html`<button key=${k} aria-pressed=${prefs.theme===k} onClick=${()=>setPref("theme",k)}>${l}</button>`)}</div></div>
    <button class="set-row danger" onClick=${()=>openSheet({kind:"reset",what:"train"})}>Сбросить тренировочный прогресс</button>
    <button class="set-row danger" onClick=${()=>openSheet({kind:"reset",what:"hist"})}>Удалить историю итоговых тестов</button>
  </${Sheet}>`;
  if(sheet.kind==="reset"){ const tr=sheet.what==="train";
    return html`<${Sheet} onClose=${close} label="Подтверждение">
      <h2>${tr?"Сбросить тренировочный прогресс?":"Удалить историю итоговых тестов?"}</h2>
      <p>${tr?"Статистика по словам и прогресс всех шести этапов будут удалены. История итоговых тестов сохранится.":"Все результаты итоговых тестов будут удалены. Тренировочный прогресс сохранится."}</p>
      <div class="stack-btns"><button class="btn btn-bad" onClick=${()=>{ update(s=>{ if(tr){const f=freshState();s.stats={};s.levels=f.levels;} else s.test.history=[]; }); close(); }}>${tr?"Сбросить прогресс":"Удалить историю"}</button>
        <button class="btn btn-light" onClick=${close}>Отмена</button></div>
    </${Sheet}>`; }
  if(sheet.kind==="confirm") return html`<${Sheet} onClose=${close} label="Завершить тест">
    <h2>Завершить тест?</h2><p>После этого ответы проверятся и изменить их будет нельзя.</p>
    <div class="stack-btns"><button class="btn btn-dark" onClick=${sheet.finish}>Завершить тест</button><button class="btn btn-light" onClick=${close}>Вернуться к ответам</button></div>
  </${Sheet}>`;
  if(sheet.kind==="grid"){ const cur=state.test.current; if(!cur) return null;
    const isFilled=i=>!!(cur.answers[i]||"").trim(); const filled=cur.order.filter(isFilled).length, all=filled===cur.order.length;
    return html`<${Sheet} onClose=${close} label="Все задания">
      <h2>Все задания</h2><p>Заполнено ${filled} из ${cur.order.length}. Нажмите номер, чтобы перейти.</p>
      <div class="grid">${cur.order.map((i,n)=>html`<button key=${i} class=${"cell"+(n===cur.idx?" cur":"")+(isFilled(i)?" filled":"")} aria-label=${"Задание "+(n+1)+(isFilled(i)?", заполнено":", пусто")} onClick=${()=>{ sheet.go(n); close(); }}>${n+1}</button>`)}</div>
      <div class="stack-btns">${all?html`<button class="btn btn-dark" onClick=${()=>openSheet({kind:"confirm",finish:sheet.finish})}>Завершить тест</button>`:null}<button class="btn btn-light" onClick=${close}>Закрыть</button></div>
    </${Sheet}>`; }
  return null;
}

/* ---------------- App ---------------- */
function App(){
  const [state,setState]=useState(loadLocal);
  const [prefs,setPrefs]=useState(()=>{ const d={sound:true,vibro:true,theme:"light"}; try{return Object.assign(d,JSON.parse(localStorage.getItem(LS_PREF)||"{}"));}catch(e){return d;} });
  const [sheet,setSheet]=useState(null);
  const update=useCallback(fn=>setState(s=>{const n=JSON.parse(JSON.stringify(s));fn(n);n.updatedAt=Date.now();return n;}),[]);
  const sfx=useCallback(k=>{ if(prefs.sound&&SFX[k]) tone(SFX[k]); if(prefs.vibro&&VIB[k]&&navigator.vibrate){ try{navigator.vibrate(VIB[k]);}catch(e){} } },[prefs.sound,prefs.vibro]);
  const setPref=(k,v,demo)=>{ setPrefs(p=>Object.assign({},p,{[k]:v})); if(demo&&k==="sound"&&v){ unlockAudio(); tone(SFX.ok); } };
  useEffect(()=>{ try{localStorage.setItem(LS_PREF,JSON.stringify(prefs));}catch(e){}
    const dark = prefs.theme==="dark" || (prefs.theme==="auto" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme",dark?"dark":"light");
    const m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute("content",dark?"#0F1117":"#F3F4F8"); },[prefs]);
  useEffect(()=>{ saveLocal(state); },[state]);

  /* системная кнопка «Назад» на Android возвращает на главный экран */
  const tab=state.tab||0;
  const tabRef=useRef(tab); tabRef.current=tab;
  const sheetRef=useRef(sheet); sheetRef.current=sheet;
  useEffect(()=>{ const onPop=()=>{ if(sheetRef.current){ setSheet(null); return; } if(tabRef.current) update(s=>{s.tab=0;}); };
    window.addEventListener("popstate",onPop); return ()=>window.removeEventListener("popstate",onPop); },[]);
  const openLevel=n=>{ sfx("tap"); history.pushState({cvt:1},""); update(s=>{s.tab=n;}); };
  const goHome=()=>{ if(history.state&&history.state.cvt) history.back(); else update(s=>{s.tab=0;}); };
  const close=()=>{ if(history.state&&history.state.sheet) history.back(); else setSheet(null); };
  const openSheet=s=>{ if(s==null) return close(); if(!sheetRef.current) history.pushState({cvt:1,sheet:1},""); setSheet(s); };

  const props={state,update,sfx,goHome,openSheet};
  let screen;
  switch(tab){
    case 1: screen=html`<${Match} ...${props}/>`; break;
    case 2: screen=html`<${Choice} ...${props}/>`; break;
    case 3: screen=html`<${Cards} ...${props}/>`; break;
    case 4: screen=html`<${TypeLevel} key="l4" lv=${4} mode="cloze" ...${props}/>`; break;
    case 5: screen=html`<${TypeLevel} key="l5" lv=${5} mode="reverse" ...${props}/>`; break;
    case 6: screen=html`<${TrueFalse} ...${props}/>`; break;
    case 7: screen=html`<${Final} ...${props}/>`; break;
    default: screen=html`<${Home} state=${state} prefs=${prefs} setPref=${setPref} openLevel=${openLevel} openSheet=${openSheet}/>`;
  }
  return html`${screen}<${Sheets} sheet=${sheet} close=${close} state=${state} prefs=${prefs} setPref=${setPref} update=${update} openSheet=${openSheet}/>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
</body>
</html>
